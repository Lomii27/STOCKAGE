    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(26, 71, 42, 0.28); border-radius: 9999px; }

    @media print {
      body { background: #FFFFFF !important; color: #000000 !important; }
      .no-print { display: none !important; }
      #printable-qc-sheet {
        box-shadow: none !important;
        border: 1.5px solid #1A472A !important;
        margin: 0 !important;
        padding: 12px !important;
        width: 100% !important;
      }
      input, textarea {
        border: none !important;
        background: transparent !important;
        padding: 0 !important;
      }

    function todayISO() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    let ui = {
      view: 'dashboard',
      authTab: 'login',
      selectedLoginUserId: '',
      diameterFilter: 'ALL',
      searchQuery: '',
      stockFilter: 'ALL',
      selectedQcId: '',
      receiptDraft: {
        date: todayISO(),
        deliveryNote: '',
        supplier: 'Armatures Usine',
        zone: 'Parc Principal',
        notes: '',
        lines: []
      }
    };

    function uid(prefix) {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
    }

    function escapeHtml(val) {
      if (val === null || val === undefined) return '';
      return String(val)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatDateFR(iso) {
      if (!iso) return '-';
      const parts = String(iso).slice(0, 10).split('-');
      if (parts.length !== 3) return iso;
      return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    function formatDateTimeFR(iso) {
      if (!iso) return '-';
      try {
        return new Date(iso).toLocaleString('fr-FR', {
          timeZone: 'Europe/Paris',
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
      } catch (_) {
        return iso;
      }
    }

    function showToast(message, type) {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const el = document.createElement('div');
      const isErr = type === 'error';
      el.className = `pointer-events-auto px-4 py-3 rounded-2xl shadow-xl border text-xs font-extrabold flex items-center justify-between gap-3 transition-all ${
        isErr
          ? 'bg-red-600 text-white border-red-400'
          : 'bg-[#101513] text-white border-emerald-500/40'
      }`;
      el.innerHTML = `<span>${escapeHtml(message)}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 250);
      }, 3200);
    }

    function persistState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (_) {}
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed === 'object') {
            state = { ...state, ...parsed };
          }
        }
      } catch (_) {}

      if (state.darkMode) {
        document.documentElement.classList.add('dark');
      }
      if (state.users.length && !ui.selectedLoginUserId) {
        ui.selectedLoginUserId = state.users[0].id;
      }
    }

    function createInitialCagesForProject(projectId, mode) {
      if (mode === 'empty') return [];
      return NDC_35_TEMPLATE.map((item, idx) => ({
        id: uid('cage'),
        projectId,
        code: item.code,
        type: 'Cage Armature Pieux (AB)',
        diameter: item.diameter,
        length: item.length,
        currentStock: 0,
        totalReceived: 0,
        totalUsed: 0,
        plannedQty: 0,
        forecastNextQty: 0,
        forecastNextDate: '',
        minStock: 2,
        zone: 'Parc Principal',
        orderIndex: idx
      }));
    }

    window.switchAuthTab = function (tab) {
      ui.authTab = tab;
      render();
    };

    window.submitLoginUser = function (e) {
      e.preventDefault();
      const userId = document.getElementById('login-user-id')?.value || ui.selectedLoginUserId;
      const pass = document.getElementById('login-password')?.value || '';
      const user = state.users.find(u => u.id === userId);
      if (!user) {
        showToast('Utilisateur introuvable.', 'error');
        return;
      }
      if (user.password !== pass) {
        showToast('Mot de passe incorrect.', 'error');
        return;
      }
      state.activeUserId = user.id;
      if (user.defaultProjectId && state.projects.some(p => p.id === user.defaultProjectId)) {
        state.activeProjectId = user.defaultProjectId;
      } else if (!state.activeProjectId && state.projects.length) {
        state.activeProjectId = state.projects[0].id;
      }
      syncDraftCages();
      persistState();
      showToast(`Bienvenue ${user.name}`);
      render();
    };

    window.submitRegisterUser = function (e) {
      e.preventDefault();
      const name = (document.getElementById('reg-user-name')?.value || '').trim();
      const title = (document.getElementById('reg-user-title')?.value || 'Conducteur de travaux').trim();
      const role = document.getElementById('reg-user-role')?.value || 'ADMIN';
      const password = document.getElementById('reg-user-pass')?.value || '';
      const choice = document.getElementById('reg-project-choice')?.value || 'NEW';

      if (!name || !password) {
        showToast('Renseignez votre nom et un mot de passe.', 'error');
        return;
      }

      let targetProjectId = choice;
      if (choice === 'NEW' || !state.projects.length) {
        const prjName = (document.getElementById('reg-prj-name')?.value || '').trim();
        const prjRef = (document.getElementById('reg-prj-ref')?.value || 'SBFS-515579').trim();
        const catMode = document.querySelector('input[name="reg-cat-mode"]:checked')?.value || 'ndc35';
        if (!prjName) {
          showToast('Saisissez le nom du nouveau chantier.', 'error');
          return;
        }
        const newPrj = {
          id: uid('prj'),
          name: prjName,
          reference: prjRef,
          location: 'Chantier Fondations Spéciales',
          startDate: todayISO()
        };
        state.projects.push(newPrj);
        const generatedCages = createInitialCagesForProject(newPrj.id, catMode);
        state.cages.push(...generatedCages);
        targetProjectId = newPrj.id;
      }

      const newUser = {
        id: uid('usr'),
        name,
        title,
        role,
        password,
        defaultProjectId: targetProjectId
      };
      state.users.push(newUser);
      state.initialized = true;
      state.activeUserId = newUser.id;
      state.activeProjectId = targetProjectId;
      ui.selectedLoginUserId = newUser.id;
      ui.view = 'config';
      syncDraftCages();
      persistState();
      showToast(`Espace créé pour ${name} !`);
      render();
    };

    window.logoutSession = function () {
      state.activeUserId = null;
      persistState();
      render();
    };

    function renderBrandLogo(compact) {

        <div class="flex items-center">
          <div class="${compact ? 'h-9 max-w-[140px]' : 'h-12 max-w-[190px]'} rounded-xl bg-white border border-gray-200/80 shadow-sm flex items-center justify-center overflow-hidden px-2 py-1 shrink-0">
            <img src="./logo.png" alt="Logo" class="h-full w-auto object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
            <div style="display:none" class="px-2 h-full bg-[#1A472A] text-white font-black text-xs items-center justify-center rounded-lg">LOGO</div>
          </div>
        </div>
      `;
    }
// ... existing code ... -->

      const activeTab = hasUsers ? ui.authTab : 'register';

          <!-- Barre supérieure avec uniquement le Logo GitHub en haut à gauche -->
          <div class="max-w-5xl w-full mx-auto flex items-center justify-start py-2">
            ${renderBrandLogo(false)}
          </div>

          <!-- Carte Centrale Connexion / Inscription -->
          <div class="max-w-xl w-full mx-auto my-auto bg-white text-[#101513] rounded-3xl shadow-2xl border border-white/10 overflow-hidden animate-view">

              <div class="text-[11px] font-extrabold uppercase tracking-widest text-emerald-200">Espace Chantier Sécurisé</div>
              <h1 class="text-2xl font-black mt-1">Accès STOCAGE — Fondations Spéciales</h1>
              <p class="text-xs text-emerald-100 mt-1">Connectez-vous à votre espace personnel ou créez un nouveau profil collaborateur.</p>
            </div>

            ${hasUsers ? `
              <div class="grid grid-cols-2 border-b border-gray-200 bg-[#F7F9F7] text-xs font-extrabold">
                <button type="button" onclick="switchAuthTab('login')" class="py-3.5 text-center transition ${activeTab === 'login' ? 'bg-white text-[#1A472A] border-b-2 border-[#1A472A]' : 'text-gray-500 hover:text-gray-800'}">
                  Utilisateurs existants (${state.users.length})
                </button>
                <button type="button" onclick="switchAuthTab('register')" class="py-3.5 text-center transition ${activeTab === 'register' ? 'bg-white text-[#1A472A] border-b-2 border-[#1A472A]' : 'text-gray-500 hover:text-gray-800'}">
                  + Créer un nouvel utilisateur
                </button>
              </div>
            ` : ''}

            ${activeTab === 'login' && hasUsers ? `
              <form onsubmit="submitLoginUser(event)" class="p-6 sm:p-8 space-y-4 text-xs">
                <div>
                  <label class="block font-bold mb-1.5 text-gray-700">Sélectionnez votre profil utilisateur *</label>

                    ${state.users.map(u => `
                      <option value="${u.id}" ${u.id === ui.selectedLoginUserId ? 'selected' : ''}>
                        ${escapeHtml(u.name)} — ${escapeHtml(u.title || u.role)}
                      </option>
                    `).join('')}
                  </select>
                </div>

                <div>
                  <label class="block font-bold mb-1.5 text-gray-700">Mot de passe personnel *</label>
                  <input id="login-password" type="password" required placeholder="Saisissez votre mot de passe" class="w-full px-3.5 py-3 rounded-xl border border-gray-300 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-[#1A472A]" />
                </div>

                <button type="submit" class="w-full py-3.5 rounded-xl bg-[#1A472A] hover:bg-[#2A623D] text-white font-extrabold text-sm shadow-lg transition">
                  Ouvrir mon espace chantier →
                </button>
              </form>
            ` : `
              <form onsubmit="submitRegisterUser(event)" class="p-6 sm:p-8 space-y-4 text-xs">

                    <input id="reg-user-name" type="text" required placeholder="Ex: Jean Moreau" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 font-bold" />
                  </div>
                  <div>
                    <label class="block font-bold mb-1">Fonction sur chantier</label>
                    <input id="reg-user-title" type="text" value="Conducteur de travaux" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300" />

                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                  <div>
                    <label class="block font-bold mb-1">Rôle & Droits</label>
                    <select id="reg-user-role" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 bg-white font-bold">
                      <option value="ADMIN">Administrateur (Tout accès)</option>
                      <option value="OPERATIONAL">Opérationnel (Réception / Sorties)</option>
                      <option value="VIEWER">Consultation seule</option>
                    </select>
                  </div>
                  <div>
                    <label class="block font-bold mb-1">Mot de passe d'accès *</label>
                    <input id="reg-user-pass" type="password" required placeholder="Choisissez un mot de passe" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 font-bold" />
                  </div>
                </div>

                <div class="pt-2 border-t border-gray-200 space-y-3">
                  <label class="block font-extrabold text-[#1A472A]">Chantier rattaché à cet utilisateur</label>
                  <select id="reg-project-choice" onchange="document.getElementById('new-prj-fields').style.display = this.value === 'NEW' ? 'block' : 'none'" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 bg-white font-bold">
                    ${state.projects.map(p => `<option value="${p.id}">Chantier existant : ${escapeHtml(p.name)} (${escapeHtml(p.reference)})</option>`).join('')}

                  </select>

                  <div id="new-prj-fields" style="display: ${!state.projects.length || selectedChoice === 'NEW' ? 'block' : 'none'}" class="space-y-3 bg-[#F7F9F7] p-3.5 rounded-2xl border border-gray-200">

                      <div>
                        <label class="block font-bold mb-1">Nom du nouveau chantier *</label>

    // =========================================================================
    // 6. ACTIONS MÉTIER (STOCK, RÉCEPTION, FICHE CONTRÔLE PDF, NDC, SOIR)
    // =========================================================================
    function getActiveProject() {
      return state.projects.find(p => p.id === state.activeProjectId) || state.projects[0] || null;
    }

    function getActiveUser() {
      return state.users.find(u => u.id === state.activeUserId) || null;
    }

    function getProjectCages() {
      return state.cages.filter(c => c.projectId === state.activeProjectId);
    }

    function syncDraftCages() {
      const cages = getProjectCages();
      ui.receiptDraft.lines = cages.length ? [{ cageId: cages[0].id, qty: 1 }] : [];
    }

    function getFilteredProjectCages() {
      let list = getProjectCages();
      if (ui.diameterFilter !== 'ALL') {
        list = list.filter(c => Number(c.diameter) === Number(ui.diameterFilter));
      }
      if (ui.searchQuery.trim()) {
        const q = ui.searchQuery.trim().toLowerCase();
        list = list.filter(c =>
          (c.code || '').toLowerCase().includes(q) ||
          (c.type || '').toLowerCase().includes(q) ||
          (c.zone || '').toLowerCase().includes(q)
        );
      }
      if (ui.stockFilter === 'AVAILABLE') list = list.filter(c => c.currentStock > 0);
      if (ui.stockFilter === 'LOW') list = list.filter(c => c.currentStock > 0 && c.currentStock <= c.minStock);
      if (ui.stockFilter === 'EMPTY') list = list.filter(c => c.currentStock === 0);
      return list;
    }

    window.setView = function (v) {
      ui.view = v;
      render();
    };

    window.setDiameterFilter = function (d) {
      ui.diameterFilter = d;
      render();
    };

    window.toggleDarkMode = function () {
      state.darkMode = !state.darkMode;
      document.documentElement.classList.toggle('dark', state.darkMode);
      persistState();
      render();
    };

    window.switchProject = function (projectId) {
      state.activeProjectId = projectId;
      syncDraftCages();
      persistState();
      render();
    };

    function computeControlledCount(qty) {
      const n = Number(qty) || 0;
      if (n <= 0) return 0;
      if (n <= 2) return n;
      if (n <= 5) return 2;
      if (n <= 15) return 3;
      return Math.max(3, Math.ceil(n * 0.2));
    }

    window.addReceiptLine = function () {
      const cages = getProjectCages();
      if (!cages.length) return;
      ui.receiptDraft.lines.push({ cageId: cages[0].id, qty: 1 });
      render();
    };

    window.removeReceiptLine = function (idx) {
      if (ui.receiptDraft.lines.length <= 1) return;
      ui.receiptDraft.lines.splice(idx, 1);
      render();
    };

    window.submitReceiptForm = function (e) {
      e.preventDefault();
      const user = getActiveUser();
      const project = getActiveProject();
      if (!project) return;
      if (user && user.role === 'VIEWER') {
        showToast('Votre profil est en consultation seule.', 'error');
        return;
      }

      const date = document.getElementById('rec-date')?.value || todayISO();
      const supplier = (document.getElementById('rec-supplier')?.value || '').trim();
      const deliveryNote = (document.getElementById('rec-bl')?.value || '').trim();
      const zone = (document.getElementById('rec-zone')?.value || 'Parc Principal').trim();
      const notes = (document.getElementById('rec-notes')?.value || '').trim();

      const validLines = [];
      ui.receiptDraft.lines.forEach((line, idx) => {
        const cageId = document.getElementById(`rec-cage-${idx}`)?.value || line.cageId;
        const qty = parseInt(document.getElementById(`rec-qty-${idx}`)?.value || line.qty, 10);
        if (cageId && qty > 0) validLines.push({ cageId, qty });
      });

      if (!validLines.length) {
        showToast('Sélectionnez au moins une cage et une quantité > 0.', 'error');
        return;
      }

      const qcLines = [];
      validLines.forEach(item => {
        const cage = state.cages.find(c => c.id === item.cageId);
        if (!cage) return;
        const before = cage.currentStock;
        const after = before + item.qty;
        cage.currentStock = after;
        cage.totalReceived = (cage.totalReceived || 0) + item.qty;
        if (zone) cage.zone = zone;

        state.movements.unshift({
          id: uid('mov'),
          projectId: project.id,
          cageId: cage.id,
          cageCode: cage.code,
          type: 'RECEIPT',
          qty: item.qty,
          beforeStock: before,
          afterStock: after,
          user: user ? user.name : 'Opérateur',
          date: new Date(`${date}T08:30:00`).toISOString(),
          deliveryNote,
          note: notes
        });

        qcLines.push({
          cageId: cage.id,
          cageCode: cage.code,
          diameter: cage.diameter,
          length: cage.length,
          receivedQty: item.qty,
          controlledQty: computeControlledCount(item.qty),
          extDiameterCheck: `Ø${cage.diameter} mm — Conforme`,
          verticalBarsCheck: 'Nombre, Ø et longueur conformes au plan',
          stirrupsCheck: 'Cerces/cadres et écartement conformes',
          lapLengthCheck: 'Longueur de recouvrement conforme',
          liftingLoopsCheck: 'Anses de positionnement conformes',
          spliceLengthCheck: 'Recouvrement inter-cages / raboutage conforme',
          topLevelCheck: 'Conforme',
          noTransportDeformation: 'Conforme (Aucune déformation)',
          noCutMissingDamaged: 'Conforme (Aucun acier coupé/manquant)'
        });
      });

      const qcNum = `FC-${new Date().getFullYear()}-${String(state.qcSheets.filter(q => q.projectId === project.id).length + 1).padStart(3, '0')}`;
      const newQc = {
        id: uid('qc'),
        projectId: project.id,
        sheetNumber: qcNum,
        deliveryDate: date,
        controlDate: todayISO(),
        deliveryNote,
        supplier,
        planRef: 'SBFS.515579.NDC.00001 ind B',
        controllerName: user ? user.name : 'Contrôleur Chantier',
        observations: notes || 'Réception conforme aux exigences Soletanche Bachy Fondations Spéciales.',
        lines: qcLines
      };
      state.qcSheets.unshift(newQc);
      ui.selectedQcId = newQc.id;
      ui.receiptDraft.lines = [{ cageId: validLines[0].cageId, qty: 1 }];
      ui.receiptDraft.deliveryNote = '';
      ui.receiptDraft.notes = '';

      persistState();
      showToast(`Réception validée & Fiche de contrôle ${qcNum} générée !`);
      ui.view = 'qc';
      render();
    };

    window.addNdcPile = function (e) {
      e.preventDefault();
      const project = getActiveProject();
      if (!project) return;
      const pileNumber = (document.getElementById('ndc-pile-num')?.value || '').trim();
      const diameter = parseInt(document.getElementById('ndc-diam')?.value || '920', 10);
      const ngfTop = parseFloat(document.getElementById('ndc-ngf')?.value || '0');
      const pileLength = parseFloat(document.getElementById('ndc-len')?.value || '0');
      const nbr = parseFloat(document.getElementById('ndc-nbr')?.value || '0');
      const cageId1 = document.getElementById('ndc-cage-1')?.value || '';
      const qty1 = parseInt(document.getElementById('ndc-qty-1')?.value || '1', 10);
      const cageId2 = document.getElementById('ndc-cage-2')?.value || '';
      const qty2 = parseInt(document.getElementById('ndc-qty-2')?.value || '0', 10);
      const soupape = document.getElementById('ndc-soupape')?.value || 'NON';
      const soupapeLevel = (document.getElementById('ndc-soupape-val')?.value || '').trim();

      if (!pileNumber || !cageId1) {
        showToast('Saisissez le N° de pieu et une cage.', 'error');
        return;
      }

      const delta = Number((ngfTop - nbr).toFixed(2));
      const c1 = state.cages.find(c => c.id === cageId1);
      const c2 = cageId2 ? state.cages.find(c => c.id === cageId2) : null;

      state.ndcPiles.unshift({
        id: uid('ndc'),
        projectId: project.id,
        pileNumber,
        diameter,
        ngfTop,
        pileLength,
        nbr,
        delta,
        cageId1,
        cageCode1: c1 ? c1.code : '',
        qty1: Math.max(1, qty1),
        cageId2: c2 ? c2.id : '',
        cageCode2: c2 ? c2.code : '',
        qty2: c2 ? Math.max(0, qty2) : 0,
        soupape,
        soupapeLevel,
        status: 'A_COULER'
      });

      if (c1) c1.plannedQty = (c1.plannedQty || 0) + Math.max(1, qty1);
      if (c2 && qty2 > 0) c2.plannedQty = (c2.plannedQty || 0) + qty2;

      persistState();
      showToast(`Pieu ${pileNumber} enregistré dans la NDC.`);
      render();
    };

    window.pourSelectedNdcPiles = function (e) {
      e.preventDefault();
      const user = getActiveUser();
      const project = getActiveProject();
      if (!project) return;
      const checked = Array.from(document.querySelectorAll('input[name="evening-pile"]:checked')).map(el => el.value);
      if (!checked.length) {
        showToast('Cochez au moins un pieu réalisé aujourd’hui.', 'error');
        return;
      }

      const neededByCage = {};
      checked.forEach(pid => {
        const pile = state.ndcPiles.find(p => p.id === pid);
        if (!pile || pile.status === 'COULE') return;
        if (pile.cageId1 && pile.qty1 > 0) neededByCage[pile.cageId1] = (neededByCage[pile.cageId1] || 0) + pile.qty1;
        if (pile.cageId2 && pile.qty2 > 0) neededByCage[pile.cageId2] = (neededByCage[pile.cageId2] || 0) + pile.qty2;
      });

      for (const [cid, reqQty] of Object.entries(neededByCage)) {
        const cage = state.cages.find(c => c.id === cid);
        if (!cage || cage.currentStock < reqQty) {
          showToast(`Stock insuffisant pour ${cage ? cage.code : 'cage'} (besoin: ${reqQty}, dispo: ${cage ? cage.currentStock : 0}).`, 'error');
          return;
        }
      }

      const pileNames = [];
      checked.forEach(pid => {
        const pile = state.ndcPiles.find(p => p.id === pid);
        if (!pile || pile.status === 'COULE') return;
        pile.status = 'COULE';
        pile.pouredDate = todayISO();
        pileNames.push(pile.pileNumber);
      });

      for (const [cid, reqQty] of Object.entries(neededByCage)) {
        const cage = state.cages.find(c => c.id === cid);
        const before = cage.currentStock;
        cage.currentStock = before - reqQty;
        cage.totalUsed = (cage.totalUsed || 0) + reqQty;
        state.movements.unshift({
          id: uid('mov'),
          projectId: project.id,
          cageId: cage.id,
          cageCode: cage.code,
          type: 'USAGE',
          qty: reqQty,
          beforeStock: before,
          afterStock: cage.currentStock,
          user: user ? user.name : 'Chef de chantier',
          date: new Date().toISOString(),
          pileNumber: pileNames.join(', '),
          note: `Clôture journée — Pieux ${pileNames.join(', ')}`
        });
      }

      persistState();
      showToast(`${pileNames.length} pieu(x) clôturé(s) et stock mis à jour !`);
      ui.view = 'stock';
      render();
    };

    window.submitManualUsage = function (e) {
      e.preventDefault();
      const user = getActiveUser();
      const project = getActiveProject();
      const cageId = document.getElementById('man-use-cage')?.value;
      const qty = parseInt(document.getElementById('man-use-qty')?.value || '0', 10);
      const pileNumber = (document.getElementById('man-use-pile')?.value || '').trim();
      const note = (document.getElementById('man-use-note')?.value || '').trim();

      const cage = state.cages.find(c => c.id === cageId);
      if (!cage || qty <= 0) return;
      if (cage.currentStock < qty) {
        showToast(`Stock insuffisant (${cage.currentStock} disponible).`, 'error');
        return;
      }
      const before = cage.currentStock;
      cage.currentStock = before - qty;
      cage.totalUsed = (cage.totalUsed || 0) + qty;
      state.movements.unshift({
        id: uid('mov'),
        projectId: project.id,
        cageId: cage.id,
        cageCode: cage.code,
        type: 'USAGE',
        qty,
        beforeStock: before,
        afterStock: cage.currentStock,
        user: user ? user.name : 'Opérateur',
        date: new Date().toISOString(),
        pileNumber,
        note
      });
      persistState();
      showToast(`Sortie enregistrée : -${qty} ${cage.code}`);
      ui.view = 'stock';
      render();
    };

    window.saveProjectAndCagesConfig = function (e) {
      e.preventDefault();
      const project = getActiveProject();
      if (!project) return;
      project.name = (document.getElementById('cfg-prj-name')?.value || project.name).trim();
      project.reference = (document.getElementById('cfg-prj-ref')?.value || project.reference).trim();
      project.location = (document.getElementById('cfg-prj-loc')?.value || project.location).trim();

      const cages = getProjectCages();
      cages.forEach(c => {
        const dEl = document.getElementById(`cfg-diam-${c.id}`);
        const sEl = document.getElementById(`cfg-stock-${c.id}`);
        const pEl = document.getElementById(`cfg-plan-${c.id}`);
        const fEl = document.getElementById(`cfg-fqty-${c.id}`);
        const fdEl = document.getElementById(`cfg-fdate-${c.id}`);
        const mEl = document.getElementById(`cfg-min-${c.id}`);
        const zEl = document.getElementById(`cfg-zone-${c.id}`);
        if (dEl) c.diameter = parseInt(dEl.value, 10) || c.diameter;
        if (sEl) c.currentStock = Math.max(0, parseInt(sEl.value, 10) || 0);
        if (pEl) c.plannedQty = Math.max(0, parseInt(pEl.value, 10) || 0);
        if (fEl) c.forecastNextQty = Math.max(0, parseInt(fEl.value, 10) || 0);
        if (fdEl) c.forecastNextDate = fdEl.value || '';
        if (mEl) c.minStock = Math.max(0, parseInt(mEl.value, 10) || 0);
        if (zEl) c.zone = zEl.value.trim() || 'Parc Principal';
      });

      persistState();
      showToast('Configuration du chantier et des stocks enregistrée !');
      render();
    };

    window.exportBackupJson = function () {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `STOCAGE_Sauvegarde_${todayISO()}.json`;
      a.click();
      showToast('Sauvegarde téléchargée.');
    };

    window.importBackupJson = function (e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (ev) {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (parsed && parsed.projects) {
            state = { ...state, ...parsed };
            persistState();
            showToast('Sauvegarde restaurée avec succès !');
            render();
          }
        } catch (_) {
          showToast('Fichier invalide.', 'error');
        }
      };
      reader.readAsText(file);
    };

          <div>
            <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight">Utilisateurs, Sauvegardes & Base de Données</h1>
            <p class="text-xs text-gray-500">Gérez les comptes protégés par mot de passe et vos sauvegardes de sécurité.</p>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-5 text-xs">
            <div class="bg-white dark:bg-[#242A26] p-5 rounded-2xl border border-gray-200/80 dark:border-white/10 shadow-sm space-y-4">
              <div class="flex items-center justify-between">
                <h2 class="font-extrabold text-sm">Collaborateurs enregistrés (${state.users.length})</h2>
                <button type="button" onclick="logoutSession(); ui.authTab='register'; render();" class="px-3 py-1.5 rounded-xl bg-[#1A472A] text-white font-bold">+ Nouvel utilisateur</button>
              </div>
              <div class="divide-y divide-gray-100 dark:divide-white/10">
                ${state.users.map(u => `
                  <div class="py-2.5 flex items-center justify-between">
                    <div>
                      <div class="font-extrabold">${escapeHtml(u.name)}</div>
                      <div class="text-gray-500">${escapeHtml(u.title || u.role)}</div>
                    </div>
                    <span class="px-2.5 py-1 rounded-lg bg-[#E8F1EB] text-[#1A472A] font-bold">${u.id === state.activeUserId ? 'Connecté' : 'Protégé par mot de passe'}</span>
                  </div>
                `).join('')}
              </div>
            </div>

            <div class="bg-white dark:bg-[#242A26] p-5 rounded-2xl border border-gray-200/80 dark:border-white/10 shadow-sm space-y-3">
              <h2 class="font-extrabold text-sm">Protection Anti-Virus / Fichier de Secours (.JSON)</h2>
              <p class="text-gray-500">Téléchargez une sauvegarde complète de vos chantiers, stocks et fiches de contrôle à conserver sur votre serveur ou clé USB.</p>
              <div class="flex flex-wrap gap-2 pt-2">
                <button type="button" onclick="exportBackupJson()" class="px-4 py-2.5 rounded-xl bg-[#101513] text-white font-bold">Télécharger sauvegarde (.json)</button>
                <label class="px-4 py-2.5 rounded-xl bg-[#E8F1EB] text-[#1A472A] font-bold cursor-pointer">
                  Restaurer un fichier (.json)
                  <input type="file" accept=".json" onchange="importBackupJson(event)" class="hidden" />
                </label>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderMainShell() {
      const project = getActiveProject();
      const user = getActiveUser();
      const navItems = [
        { id: 'dashboard', label: 'Tableau de bord', icon: ICONS.dashboard },
        { id: 'receipt', label: '1. Réception (Matin)', icon: ICONS.receipt },
        { id: 'qc', label: '2. Fiche Contrôle PDF', icon: ICONS.qc },
        { id: 'stock', label: '3. Stock Réel & NDC', icon: ICONS.stock },
        { id: 'usage', label: '4. Clôture Pieux (Soir)', icon: ICONS.usage },
        { id: 'ndc', label: 'Note de Calcul (Pieux)', icon: ICONS.ndc },
        { id: 'history', label: 'Historique Mouvements', icon: ICONS.history },
        { id: 'config', label: 'Configuration Cages', icon: ICONS.config },
        { id: 'users', label: 'Utilisateurs & Sauvegarde', icon: ICONS.users }
      ];

      let viewHtml = '';
      if (ui.view === 'dashboard') viewHtml = renderDashboardView();
      else if (ui.view === 'receipt') viewHtml = renderReceiptView();
      else if (ui.view === 'qc') viewHtml = renderQcSheetView();
      else if (ui.view === 'stock') viewHtml = renderStockView();
      else if (ui.view === 'usage') viewHtml = renderUsageView();
      else if (ui.view === 'ndc') viewHtml = renderNdcView();
      else if (ui.view === 'history') viewHtml = renderHistoryView();
      else if (ui.view === 'config') viewHtml = renderConfigView();
      else if (ui.view === 'users') viewHtml = renderUsersAndDatabaseView();

      return `
        <div class="min-h-screen flex flex-col lg:flex-row">
          <!-- Barre latérale Ordinateur avec uniquement le Logo GitHub en haut à gauche -->
          <aside class="hidden lg:flex lg:w-64 lg:flex-col bg-[#101513] text-white shrink-0 border-r border-white/10 no-print">
            <div class="p-4 border-b border-white/10 flex items-center justify-start">
              ${renderBrandLogo(false)}
            </div>
            <nav class="flex-1 p-3 space-y-1 overflow-y-auto custom-scrollbar">
              ${navItems.map(item => `
                <button type="button" onclick="setView('${item.id}')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold transition ${ui.view === item.id ? 'bg-[#1A472A] text-white shadow' : 'text-gray-300 hover:bg-white/5'}">
                  ${item.icon}
                  <span>${item.label}</span>
                </button>
              `).join('')}
            </nav>
            <div class="p-4 border-t border-white/10 text-xs space-y-2.5">
              <div class="flex items-center justify-between">
                <span class="font-bold truncate">${escapeHtml(user ? user.name : '')}</span>
                <button type="button" onclick="toggleDarkMode()" class="px-2 py-1 rounded bg-white/10 text-[10px]">${state.darkMode ? 'Clair' : 'Sombre'}</button>
              </div>
              <button type="button" onclick="logoutSession()" class="w-full py-2 rounded-xl bg-white/10 hover:bg-white/20 font-bold flex items-center justify-center gap-1.5">
                ${ICONS.logout} <span>Changer d'utilisateur</span>
              </button>
            </div>
          </aside>

          <!-- Zone Principale -->
          <div class="flex-1 flex flex-col min-w-0">
            <!-- En-tête supérieur (Logo GitHub en haut à gauche sur mobile + Sélecteur Chantier) -->
            <header class="bg-white dark:bg-[#242A26] border-b border-gray-200/80 dark:border-white/10 px-4 sm:px-6 py-2.5 flex items-center justify-between gap-2 sticky top-0 z-20 no-print">
              <div class="flex items-center gap-2.5 min-w-0">
                <div class="lg:hidden">
                  ${renderBrandLogo(true)}
                </div>
                <select onchange="switchProject(this.value)" class="px-3 py-2 rounded-xl bg-[#E8F1EB] dark:bg-[#1A472A] text-[#1A472A] dark:text-white font-extrabold text-xs truncate max-w-[180px] sm:max-w-xs">
                  ${state.projects.map(p => `<option value="${p.id}" ${p.id === state.activeProjectId ? 'selected' : ''}>${escapeHtml(p.name)}</option>`).join('')}
                </select>
              </div>
              <div class="flex items-center gap-1.5 text-xs">
                <button type="button" onclick="setView('config')" class="px-2.5 py-2 rounded-xl bg-[#F7F9F7] dark:bg-white/10 font-bold">Config</button>
                <button type="button" onclick="logoutSession()" title="Changer d'utilisateur" class="px-2.5 py-2 rounded-xl bg-[#101513] text-white font-bold flex items-center gap-1">
                  ${ICONS.logout} <span class="hidden sm:inline">${escapeHtml(user ? user.name : 'Connexion')}</span>
                </button>
              </div>
            </header>

            <main class="flex-1 p-4 sm:p-6 pb-24 lg:pb-8 max-w-7xl w-full mx-auto">
              ${viewHtml}
            </main>
          </div>

          <!-- Barre de navigation tactile fixe en bas sur Téléphone -->
          <nav class="lg:hidden fixed bottom-0 inset-x-0 bg-[#101513] text-white border-t border-white/10 grid grid-cols-5 py-1.5 px-1 z-30 no-print">
            <button type="button" onclick="setView('dashboard')" class="flex flex-col items-center justify-center py-1 rounded-lg text-[10px] font-bold ${ui.view === 'dashboard' ? 'text-emerald-400' : 'text-gray-400'}">
              ${ICONS.dashboard}<span class="mt-0.5">Accueil</span>
            </button>
            <button type="button" onclick="setView('receipt')" class="flex flex-col items-center justify-center py-1 rounded-lg text-[10px] font-bold ${ui.view === 'receipt' ? 'text-emerald-400' : 'text-gray-400'}">
              ${ICONS.receipt}<span class="mt-0.5">Réception</span>
            </button>
            <button type="button" onclick="setView('qc')" class="flex flex-col items-center justify-center py-1 rounded-lg text-[10px] font-bold ${ui.view === 'qc' ? 'text-emerald-400' : 'text-gray-400'}">
              ${ICONS.qc}<span class="mt-0.5">PDF Ctrl</span>
            </button>
            <button type="button" onclick="setView('stock')" class="flex flex-col items-center justify-center py-1 rounded-lg text-[10px] font-bold ${ui.view === 'stock' ? 'text-emerald-400' : 'text-gray-400'}">
              ${ICONS.stock}<span class="mt-0.5">Stock</span>
            </button>
            <button type="button" onclick="setView('usage')" class="flex flex-col items-center justify-center py-1 rounded-lg text-[10px] font-bold ${ui.view === 'usage' ? 'text-emerald-400' : 'text-gray-400'}">
              ${ICONS.usage}<span class="mt-0.5">Pieux Soir</span>
            </button>
          </nav>
        </div>
      `;
    }

    function render() {
      const root = document.getElementById('app');
      if (!root) return;
      if (!state.activeUserId || !getActiveUser()) {
        root.innerHTML = renderAuthPortal();
      } else {
        root.innerHTML = renderMainShell();
      }
    }

    // Démarrage garanti après chargement complet de la page
    window.addEventListener('DOMContentLoaded', function () {
      loadState();
      if (state.activeUserId && !ui.receiptDraft.lines.length) {
        syncDraftCages();
      }
      render();
    });
  </script>
</body>
</html>
