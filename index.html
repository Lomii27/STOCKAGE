<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAGESTOCK - Soletanche Bachy</title>
  
  <!-- 1. Design (Tailwind) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 2. React (Moteur de base uniquement, très stable) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- 3. Traducteur de code -->
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#F7F9F7] m-0 p-0 overflow-hidden">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;
    const { createRoot } = ReactDOM;

    // --- ICÔNES INTÉGRÉES (Plus aucun téléchargement externe) ---
    const IconDash = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-5 h-5"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>;
    const IconPack = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-5 h-5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>;
    const IconIn = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-5 h-5"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>;
    const IconOut = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-5 h-5"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>;
    const IconHist = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-5 h-5"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>;
    const IconAlert = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-6 h-6"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>;

    // --- DONNÉES ---
    const initialCages = [
      { id: '1', ref: 'CAGE P01', designation: 'Armature fut Pieu D1000', currentStock: 12, minStock: 5 },
      { id: '2', ref: 'CAGE P02', designation: 'Armature fut Pieu D1200', currentStock: 8, minStock: 5 },
      { id: '3', ref: 'CAGE P03', designation: 'Cage liaison radier', currentStock: 15, minStock: 10 },
      { id: '4', ref: 'CAGE P04', designation: 'Cage spéciale renfort', currentStock: 1, minStock: 2 },
    ];

    const initialMovements = [
      { id: 'm1', date: new Date().toISOString(), cageRef: 'CAGE P01', type: 'RECEIPT', qty: 10, note: 'BL-4920' },
      { id: 'm2', date: new Date().toISOString(), cageRef: 'CAGE P03', type: 'RECEIPT', qty: 15, note: 'BL-4921' },
      { id: 'm3', date: new Date().toISOString(), cageRef: 'CAGE P01', type: 'USAGE', qty: 4, note: 'Pieux P12' },
    ];

    // --- COMPOSANTS ---
    const NavItem = ({ icon: Icon, label, active, onClick }) => (
      <button onClick={onClick} className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg font-medium transition ${active ? 'bg-[#2A623D] text-white shadow-md' : 'text-[#E8F1EB] hover:bg-[#1A472A]'}`}>
        <Icon /> <span>{label}</span>
      </button>
    );

    const Card = ({ title, value, alert, icon: Icon }) => (
      <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
        <div>
          <p className="text-gray-500 text-sm font-medium">{title}</p>
          <p className={`text-3xl font-bold mt-1 ${alert ? 'text-red-500' : 'text-[#101513]'}`}>{value}</p>
        </div>
        <div className={`p-3 rounded-lg ${alert ? 'bg-red-50 text-red-500' : 'bg-green-50 text-[#1A472A]'}`}>
          <Icon />
        </div>
      </div>
    );

    // --- APP ---
    function App() {
      const [view, setView] = useState('dashboard');
      const [cages, setCages] = useState(initialCages);
      const [movements, setMovements] = useState(initialMovements);
      const [msg, setMsg] = useState('');

      const totalStock = cages.reduce((a, c) => a + c.currentStock, 0);
      const alertsCount = cages.filter(c => c.currentStock < c.minStock).length;

      const handleAction = (type, ref, qty, note) => {
        const cage = cages.find(c => c.ref === ref);
        if (type === 'USAGE' && cage.currentStock < qty) return alert("Stock insuffisant !");
        
        setCages(cages.map(c => c.ref === ref ? { ...c, currentStock: type === 'RECEIPT' ? c.currentStock + qty : c.currentStock - qty } : c));
        setMovements([{ id: Math.random().toString(), date: new Date().toISOString(), cageRef: ref, type, qty, note }, ...movements]);
        
        setMsg(`${type === 'RECEIPT' ? 'Réception' : 'Sortie'} validée : ${qty}x ${ref}`);
        setTimeout(() => setMsg(''), 3000);
        setView('stock');
      };

      const FormView = ({ type }) => {
        const [ref, setRef] = useState(cages[0].ref);
        const [qty, setQty] = useState('');
        const isReceipt = type === 'RECEIPT';
        
        return (
          <div className="max-w-xl mx-auto bg-white p-8 rounded-xl shadow-sm mt-8 border border-gray-200">
            <h2 className="text-2xl font-bold mb-6 text-[#101513]">{isReceipt ? 'Nouvelle Réception' : 'Nouvelle Sortie'}</h2>
            <form onSubmit={e => { e.preventDefault(); handleAction(type, ref, parseInt(qty), ''); }}>
              <div className="mb-4">
                <label className="block text-sm font-bold mb-2">Référence</label>
                <select value={ref} onChange={e => setRef(e.target.value)} className="w-full p-3 border rounded-lg bg-white font-medium">
                  {cages.map(c => <option key={c.id} value={c.ref}>{c.ref} ({c.currentStock} en stock)</option>)}
                </select>
              </div>
              <div className="mb-6">
                <label className="block text-sm font-bold mb-2">Quantité</label>
                <input type="number" min="1" required value={qty} onChange={e => setQty(e.target.value)} className="w-full p-3 border rounded-lg text-xl font-bold" />
              </div>
              <button type="submit" className={`w-full py-3 rounded-lg font-bold text-white ${isReceipt ? 'bg-[#1A472A]' : 'bg-red-600'}`}>Valider l'opération</button>
            </form>
          </div>
        );
      };

      return (
        <div className="flex h-screen w-screen overflow-hidden">
          
          {msg && <div className="absolute top-4 right-4 bg-[#101513] text-white px-6 py-3 rounded-lg shadow-xl font-medium">{msg}</div>}

          {/* SIDEBAR */}
          <div className="w-64 bg-[#101513] flex flex-col p-4">
            <div className="flex items-center gap-3 text-white p-2 mb-8">
              <div className="w-10 h-10 bg-[#2A623D] rounded flex items-center justify-center font-bold text-xl">C</div>
              <h1 className="text-xl font-bold tracking-wider">CAGESTOCK</h1>
            </div>
            <NavItem icon={IconDash} label="Tableau de bord" active={view === 'dashboard'} onClick={() => setView('dashboard')} />
            <NavItem icon={IconPack} label="Stock actuel" active={view === 'stock'} onClick={() => setView('stock')} />
            <NavItem icon={IconIn} label="Réception" active={view === 'receipt'} onClick={() => setView('receipt')} />
            <NavItem icon={IconOut} label="Sortie" active={view === 'usage'} onClick={() => setView('usage')} />
            <NavItem icon={IconHist} label="Historique" active={view === 'history'} onClick={() => setView('history')} />
          </div>

          {/* CONTENU */}
          <div className="flex-1 flex flex-col bg-[#F7F9F7] overflow-y-auto">
            <div className="h-16 bg-white border-b flex items-center px-8 font-medium text-[#1A472A]">
              Chantier Actif : Gare de Paris - Ligne 15
            </div>
            
            <div className="p-8">
              
              {view === 'dashboard' && (
                <div>
                  <h2 className="text-3xl font-bold text-[#101513] mb-6">Tableau de Bord</h2>
                  <div className="grid grid-cols-3 gap-6 mb-8">
                    <Card title="Stock Total (Cages)" value={totalStock} icon={IconPack} />
                    <Card title="Derniers Mouvements" value={movements.length} icon={IconHist} />
                    <Card title="Alertes Stock Faible" value={alertsCount} alert={alertsCount > 0} icon={IconAlert} />
                  </div>
                  <div className="bg-white p-6 rounded-xl border border-gray-100 shadow-sm">
                    <h3 className="text-lg font-bold mb-4">Derniers Mouvements</h3>
                    {movements.slice(0, 5).map(m => (
