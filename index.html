      // Recalcul propre des stockBefore / stockAfter chronologique

      return {

    function recalculateMovementChain(movements) {
      const sorted = [...movements].sort((a, b) => new Date(a.date) - new Date(b.date));
      const stockMap = {};
      return sorted.map(m => {
        const before = stockMap[m.refId] || 0;
        let delta = 0;
        if (['RECEIPT', 'RETURN', 'ADJUSTMENT_POS'].includes(m.type)) delta = m.qty;
        else if (['USAGE', 'ADJUSTMENT_NEG'].includes(m.type)) delta = -m.qty;
        else if (m.type === 'CORRECTION') delta = m.signedQty !== undefined ? m.signedQty : -m.qty;
        const after = before + delta;
        stockMap[m.refId] = after;
        return { ...m, stockBefore: before, stockAfter: after };
      });
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.references && parsed.movements) return parsed;
        }
      } catch (e) {
        console.warn('Erreur lecture localStorage, réinitialisation.', e);
      }
      const fresh = buildDefaultData();
      saveState(fresh);
      return fresh;
    }

    function saveState(nextState) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(nextState));
      } catch (e) {
        console.error('Impossible de sauvegarder dans localStorage', e);
      }
    }

      appState = typeof updater === 'function' ? updater(appState) : { ...appState, ...updater };

    // =========================================================================
    // 3. CALCULS MÉTIER RIGOUREUX (STOCK, RÉCEPTIONS, SORTIES, ALERTES)
    // =========================================================================
    function getActiveProject() {
      return appState.projects.find(p => p.id === appState.activeProjectId) || appState.projects[0];
    }

    function getCurrentUser() {
      return DEFAULT_USERS.find(u => u.id === appState.currentUserId) || DEFAULT_USERS[0];
    }

    function canOperate() {
      const role = getCurrentUser().role;
      return role === 'ADMIN' || role === 'OPERATIONAL';
    }

    function isAdmin() {
      return getCurrentUser().role === 'ADMIN';
    }

    function getProjectReferences(includeArchived = true) {
      return appState.references.filter(r => r.projectId === appState.activeProjectId && (includeArchived || r.status === 'ACTIVE'));
    }

    function getProjectMovements() {
      return appState.movements
        .filter(m => m.projectId === appState.activeProjectId)
        .sort((a, b) => new Date(b.date) - new Date(a.date));
    }

    function computeCageMetrics(refObj) {
      const mvs = appState.movements.filter(m => m.refId === refObj.id);
      let totalReceived = 0;
      let totalUsed = 0;
      let totalReturns = 0;
      let totalAdjustments = 0;
      let lastReceiptDate = null;

      mvs.forEach(m => {
        if (m.type === 'RECEIPT') {
          totalReceived += m.qty;
          if (!lastReceiptDate || new Date(m.date) > new Date(lastReceiptDate)) {
            lastReceiptDate = m.date;
          }
        } else if (m.type === 'USAGE') {
          totalUsed += m.qty;
        } else if (m.type === 'RETURN') {
          totalReturns += m.qty;
        } else if (m.type === 'ADJUSTMENT_POS') {
          totalAdjustments += m.qty;
        } else if (m.type === 'ADJUSTMENT_NEG') {
          totalAdjustments -= m.qty;
        } else if (m.type === 'CORRECTION') {
          const s = m.signedQty !== undefined ? m.signedQty : -m.qty;
          totalAdjustments += s;
          if (m.affectsReceived) totalReceived += s;
        }
      });

      const physicalStock = totalReceived - totalUsed + totalReturns + totalAdjustments;
      const reservedQty = refObj.reservedQty || 0;
      const availableStock = Math.max(0, physicalStock - reservedQty);
      const remainingToDeliver = (refObj.plannedQty || 0) - totalReceived;

      let statusCode = 'OK'; // OK | LOW | OUT | ARCHIVED
      let statusLabel = 'Satisfaisant';
      if (refObj.status === 'ARCHIVED') {
        statusCode = 'ARCHIVED';
        statusLabel = 'Archivée';
      } else if (physicalStock <= 0) {
        statusCode = 'OUT';
        statusLabel = 'Rupture';
      } else if (physicalStock <= (refObj.minStock || 0)) {
        statusCode = 'LOW';
        statusLabel = 'Stock faible';
      }

      return {
        ...refObj,
        totalReceived,
        totalUsed,
        totalReturns,
        totalAdjustments,
        physicalStock,
        reservedQty,
        availableStock,
        remainingToDeliver,
        lastReceiptDate,
        statusCode,
        statusLabel,
        movementCount: mvs.length
      };
    }

    function getProjectAlerts() {
      const refs = getProjectReferences(false).map(computeCageMetrics);
      const alerts = [];
      refs.forEach(r => {
        if (r.physicalStock <= 0) {
          alerts.push({
            id: `ALT-OUT-${r.id}`,
            severity: 'danger',
            title: `Rupture de stock : ${r.ref}`,
            message: `Stock physique à 0 cage (seuil minimal : ${r.minStock}). Approvisionnement requis.`,
            refId: r.id
          });
        } else if (r.physicalStock <= r.minStock) {
          alerts.push({
            id: `ALT-LOW-${r.id}`,
            severity: 'warning',
            title: `Stock faible : ${r.ref}`,
            message: `${r.physicalStock} cage(s) restante(s) pour un seuil minimal de ${r.minStock}.`,
            refId: r.id
          });
        }
        if (r.plannedQty > 0 && r.remainingToDeliver < 0) {
          alerts.push({
            id: `ALT-OVR-${r.id}`,
            severity: 'warning',
            title: `Dépassement des prévisions : ${r.ref}`,
            message: `${r.totalReceived} cages réceptionnées pour ${r.plannedQty} prévues (+${Math.abs(r.remainingToDeliver)} cages).`,
            refId: r.id
          });
        }
      });
      return alerts;
    }

    // =========================================================================
    // 4. UTILITAIRES (DATES EUROPE/PARIS, CSV, TOASTS)
    // =========================================================================
    function formatDateTimeFR(isoString) {
      if (!isoString) return '—';
      try {
        return new Intl.DateTimeFormat('fr-FR', {
          timeZone: 'Europe/Paris',
          day: '2-digit', month: '2-digit', year: 'numeric',
          hour: '2-digit', minute: '2-digit'
        }).format(new Date(isoString));
      } catch {
        return isoString;
      }
    }

    function formatDateFR(isoString) {
      if (!isoString) return '—';
      try {
        return new Intl.DateTimeFormat('fr-FR', {
          timeZone: 'Europe/Paris',
          day: '2-digit', month: '2-digit', year: 'numeric'
        }).format(new Date(isoString));
      } catch {
        return isoString;
      }
    }

    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function showToast(title, description = '', type = 'success') {
      const root = document.getElementById('toast-root');
      const el = document.createElement('div');
      const colors = type === 'error'
        ? 'bg-red-950 border-red-700 text-white'
        : type === 'warning'
        ? 'bg-amber-950 border-amber-600 text-white'
        : 'bg-[#101513] border-[#2A623D] text-white';

      el.className = `pointer-events-auto flex items-start gap-3 px-4 py-3.5 rounded-xl border shadow-2xl max-w-sm transition-all duration-300 transform translate-y-2 opacity-0 ${colors}`;
      el.innerHTML = `
        <div class="mt-0.5 shrink-0 ${type === 'error' ? 'text-red-400' : type === 'warning' ? 'text-amber-400' : 'text-emerald-400'}">
          <i data-lucide="${type === 'error' ? 'alert-circle' : type === 'warning' ? 'alert-triangle' : 'check-circle-2'}" class="w-5 h-5"></i>
        </div>
        <div class="flex-1 text-sm">
          <p class="font-semibold">${escapeHTML(title)}</p>
          ${description ? `<p class="text-xs text-gray-300 mt-0.5">${escapeHTML(description)}</p>` : ''}
        </div>
      `;
      root.appendChild(el);
      if (window.lucide) window.lucide.createIcons();
      requestAnimationFrame(() => {
        el.classList.remove('translate-y-2', 'opacity-0');
      });
      setTimeout(() => {
        el.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => el.remove(), 300);
      }, 3800);
    }

    function downloadCSV(filename, headers, rows) {
      const sep = ';'; // Standard Excel français
      const csvContent = '\uFEFF' + [
        headers.join(sep),
        ...rows.map(r => r.map(cell => `"${String(cell ?? '').replace(/"/g, '""')}"`).join(sep))
      ].join('\n');

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Export CSV généré', `Fichier téléchargé : ${filename}`);
    }

    function navigateTo(route, preselectRefId = null) {
      if (route === 'receipt') {
        const activeRefs = getProjectReferences(false);
        const defaultId = preselectRefId || (activeRefs[0] ? activeRefs[0].id : '');
        ui.receiptForm = {
          date: new Date().toISOString().split('T')[0],
          supplier: 'Armatures Île-de-France',
          bl: '',
          zone: '',
          comment: '',
          attachmentName: '',
          lines: [{ refId: defaultId, qty: '' }]
        };
      } else if (route === 'usage') {
        const activeRefs = getProjectReferences(false).map(computeCageMetrics);
        const firstAvailable = activeRefs.find(r => r.physicalStock > 0) || activeRefs[0];
        const defaultId = preselectRefId || (firstAvailable ? firstAvailable.id : '');
        ui.usageForm = {
          date: new Date().toISOString().split('T')[0],
          pile: '',
          zone: '',
          comment: '',
          lines: [{ refId: defaultId, qty: '' }]
        };
      } else if (route === 'inventory') {
        const refs = getProjectReferences(false).map(computeCageMetrics);
        const draft = {};
        refs.forEach(r => {
          draft[r.id] = { counted: String(r.physicalStock), justification: '' };
        });
        ui.inventoryDraft = draft;
      }
      ui.route = route;
      ui.mobileMenuOpen = false;
      render();
    }

    function submitReceiptForm() {
      if (!canOperate()) {
        showToast('Accès refusé', 'Le profil Consultation ne peut pas enregistrer de réception.', 'error');
        return;
      }
      const form = ui.receiptForm;
      const validLines = form.lines.filter(l => l.refId && Number(l.qty) > 0);
      if (validLines.length === 0) {
        showToast('Saisie incomplète', 'Veuillez sélectionner au moins une référence et une quantité entière supérieure à 0.', 'error');
        return;
      }
      for (const l of validLines) {
        if (!Number.isInteger(Number(l.qty)) || Number(l.qty) <= 0) {
          showToast('Quantité invalide', 'Le nombre de cages doit être un entier positif.', 'error');
          return;
        }
      }

      const user = getCurrentUser();
      const nowTime = new Date().toTimeString().split(' ')[0];
      const timestamp = new Date(`${form.date}T${nowTime}`).toISOString();

      const newMovements = validLines.map((l, idx) => ({
        id: `MV-${Date.now().toString().slice(-5)}-${idx + 1}`,
        projectId: appState.activeProjectId,
        refId: l.refId,
        type: 'RECEIPT',
        qty: parseInt(l.qty, 10),
        date: timestamp,
        user: user.name,
        supplier: form.supplier.trim(),
        bl: form.bl.trim(),
        zone: form.zone.trim(),
        comment: [form.comment.trim(), form.attachmentName ? `PJ: ${form.attachmentName}` : ''].filter(Boolean).join(' | ')
      }));

      // Mise à jour éventuelle de la zone de stockage si renseignée
      const updatedRefs = appState.references.map(r => {
        if (form.zone.trim() && validLines.some(l => l.refId === r.id)) {
          return { ...r, zone: form.zone.trim() };
        }
        return r;
      });

      const totalCages = newMovements.reduce((s, m) => s + m.qty, 0);
      setState({
        references: updatedRefs,
        movements: recalculateMovementChain([...appState.movements, ...newMovements])
      });

      showToast('Réception validée avec succès', `+${totalCages} cage(s) ajoutée(s) au stock chantier.`);
      navigateTo('dashboard');
    }

    function submitUsageForm() {
      if (!canOperate()) {
        showToast('Accès refusé', 'Le profil Consultation ne peut pas enregistrer de sortie.', 'error');
        return;
      }
      const form = ui.usageForm;
      const validLines = form.lines.filter(l => l.refId && Number(l.qty) > 0);
      if (validLines.length === 0) {
        showToast('Saisie incomplète', 'Veuillez sélectionner au moins une référence et une quantité utilisée.', 'error');
        return;
      }

      // Cumuler les quantités par référence au cas où la même réf serait saisie deux fois
      const requestedByRef = {};
      for (const l of validLines) {
        const q = Number(l.qty);
        if (!Number.isInteger(q) || q <= 0) {
          showToast('Quantité invalide', 'Le nombre de cages utilisées doit être un entier positif.', 'error');
          return;
        }
        requestedByRef[l.refId] = (requestedByRef[l.refId] || 0) + q;
      }

      // Vérification stricte du stock disponible
      for (const [refId, totalReq] of Object.entries(requestedByRef)) {
        const refObj = appState.references.find(r => r.id === refId);
        const metrics = computeCageMetrics(refObj);
        if (totalReq > metrics.physicalStock) {
          showToast(
            `Stock insuffisant pour ${refObj.ref}`,
            `Sortie demandée : ${totalReq} cages, mais seulement ${metrics.physicalStock} disponible(s) physiquement.`,
            'error'
          );
          return;
        }
      }

      const user = getCurrentUser();
      const nowTime = new Date().toTimeString().split(' ')[0];
      const timestamp = new Date(`${form.date}T${nowTime}`).toISOString();

      const newMovements = validLines.map((l, idx) => ({
        id: `MV-${Date.now().toString().slice(-5)}-${idx + 1}`,
        projectId: appState.activeProjectId,
        refId: l.refId,
        type: 'USAGE',
        qty: parseInt(l.qty, 10),
        date: timestamp,
        user: user.name,
        pile: form.pile.trim(),
        zone: form.zone.trim(),
        comment: form.comment.trim()
      }));

      const totalCages = newMovements.reduce((s, m) => s + m.qty, 0);
      setState({
        movements: recalculateMovementChain([...appState.movements, ...newMovements])
      });

      showToast('Sortie de stock enregistrée', `−${totalCages} cage(s) déduite(s) du stock chantier.`);
      navigateTo('dashboard');
    }

    function submitInventoryValidation() {
      if (!isAdmin()) {
        showToast('Validation réservée aux Administrateurs', 'Seul un Conducteur de Travaux / Administrateur peut valider les écarts d’inventaire.', 'error');
        return;
      }
      const refs = getProjectReferences(false).map(computeCageMetrics);
      const lines = [];
      const adjustmentMovements = [];
      const now = new Date().toISOString();
      const user = getCurrentUser();

      for (const r of refs) {
        const entry = ui.inventoryDraft[r.id] || { counted: String(r.physicalStock), justification: '' };
        const counted = parseInt(entry.counted, 10);
        if (isNaN(counted) || counted < 0) {
          showToast('Valeur invalide', `Le comptage pour ${r.ref} doit être un entier positif ou nul.`, 'error');
          return;
        }
        const diff = counted - r.physicalStock;
        if (diff !== 0 && !entry.justification.trim()) {
          showToast('Justification obligatoire', `Veuillez indiquer le motif de l'écart (${diff > 0 ? '+' + diff : diff}) pour ${r.ref}.`, 'warning');
          return;
        }
        lines.push({
          refId: r.id,
          ref: r.ref,
          theoretical: r.physicalStock,
          counted,
          diff,
          justification: entry.justification.trim() || 'Conforme au stock théorique'
        });

        if (diff !== 0) {
          adjustmentMovements.push({
            id: `MV-INV-${Date.now().toString().slice(-4)}-${r.ref.replace(/\s+/g, '')}`,
            projectId: appState.activeProjectId,
            refId: r.id,
            type: diff > 0 ? 'ADJUSTMENT_POS' : 'ADJUSTMENT_NEG',
            qty: Math.abs(diff),
            date: now,
            user: user.name,
            comment: `Inventaire physique (${r.physicalStock} → ${counted}) : ${entry.justification.trim()}`
          });
        }
      }

      const invRecord = {
        id: `INV-${new Date().getFullYear()}-${String(appState.inventories.length + 1).padStart(2, '0')}`,
        projectId: appState.activeProjectId,
        date: now,
        user: user.name,
        status: 'VALIDATED',
        lines
      };

      setState({
        inventories: [invRecord, ...appState.inventories],
        movements: recalculateMovementChain([...appState.movements, ...adjustmentMovements])
      });

      showToast(
        'Inventaire physique validé',
        adjustmentMovements.length > 0
          ? `${adjustmentMovements.length} mouvement(s) d'ajustement enregistré(s).`
          : 'Aucun écart constaté, stock certifié conforme.'
      );
      render();
    }

          r => r.projectId === appState.activeProjectId && r.ref.toUpperCase() === refCode && r.id !== editRefId

        if (duplicate) {
          showToast('Doublon détecté', `La référence ${refCode} existe déjà sur ce chantier.`, 'error');
          return;
        }

        const payload = {
          ref: refCode,
          type: fd.get('type'),
          designation: fd.get('designation').trim(),
          diameter: Number(fd.get('diameter')),
          length: Number(fd.get('length')),

          planNumber: fd.get('planNumber').trim(),
          planRevision: fd.get('planRevision').trim(),

          plannedQty: parseInt(fd.get('plannedQty'), 10) || 0,
          minStock: parseInt(fd.get('minStock'), 10) || 0,
          reservedQty: parseInt(fd.get('reservedQty'), 10) || 0,
          zone: fd.get('zone').trim(),
          notes: fd.get('notes').trim()
        };

        if (existing) {
          setState({
            references: appState.references.map(r => r.id === editRefId ? { ...r, ...payload } : r)
          });
          showToast('Référence mise à jour', `${refCode} a été modifiée.`);
        } else {
          const newRef = {
            id: `REF-${Date.now().toString().slice(-5)}`,
            projectId: appState.activeProjectId,
            status: 'ACTIVE',
            ...payload
          };
          setState({ references: [...appState.references, newRef] });
          showToast('Référence créée', `${refCode} ajoutée au catalogue du chantier.`);
        }
        closeModal();
      };

              </div>
            </form>
          </div>
        </div>
      `;
      if (window.lucide) window.lucide.createIcons();

      document.getElementById('correction-form').onsubmit = function (e) {
        e.preventDefault();
        const fd = new FormData(e.target);
        const signedQty = parseInt(fd.get('signedQty'), 10);
        const reason = fd.get('reason').trim();

        if (!signedQty || signedQty === 0) {
          showToast('Correction invalide', 'Veuillez saisir un nombre entier non nul (ex: -2 ou +2).', 'error');
          return;
        }
        if (metrics.physicalStock + signedQty < 0) {
          showToast('Stock négatif impossible', `Cette correction rendrait le stock négatif (${metrics.physicalStock + signedQty}).`, 'error');
          return;
        }

        const corrMovement = {
          id: `MV-COR-${Date.now().toString().slice(-5)}`,
          projectId: appState.activeProjectId,
          refId: mv.refId,
          type: 'CORRECTION',
          qty: Math.abs(signedQty),
          signedQty,
          affectsReceived: mv.type === 'RECEIPT',
          date: new Date().toISOString(),
          user: getCurrentUser().name,
          comment: `Correction sur ${mv.id} : ${reason}`
        };

        setState({
          movements: recalculateMovementChain([...appState.movements, corrMovement])
        });
        showToast('Correction enregistrée', `Mouvement compensatoire (${signedQty > 0 ? '+' + signedQty : signedQty}) ajouté au journal.`);
        closeModal();
      };
    }

    function toggleArchiveReference(refId) {
      if (!isAdmin()) {
        showToast('Accès refusé', 'Seul un Administrateur peut archiver ou réactiver une référence.', 'error');
        return;
      }
      const refObj = appState.references.find(r => r.id === refId);
      if (!refObj) return;
      const nextStatus = refObj.status === 'ARCHIVED' ? 'ACTIVE' : 'ARCHIVED';
      setState({
        references: appState.references.map(r => r.id === refId ? { ...r, status: nextStatus } : r)
      });
      showToast(
        nextStatus === 'ARCHIVED' ? 'Référence archivée' : 'Référence réactivée',
        `${refObj.ref} est désormais ${nextStatus === 'ARCHIVED' ? 'archivée (historique conservé)' : 'active'}.`
      );
    }

                        <div class="w-3.5 sm:w-5 bg-[#2A623D] rounded-t-md transition-all duration-300 relative" style="height: ${Math.max(hRec, d.rec > 0 ? 8 : 2)}%" title="Réceptions : ${d.rec}">
                          ${d.rec > 0 ? `<span class="absolute -top-5 left-1/2 -translate-x-1/2 text-[10px] font-bold text-[#1A472A] dark:text-emerald-400">${d.rec}</span>` : ''}
                        </div>
                        <div class="w-3.5 sm:w-5 bg-red-500/85 rounded-t-md transition-all duration-300 relative" style="height: ${Math.max(hUsg, d.usg > 0 ? 8 : 2)}%" title="Sorties : ${d.usg}">
                          ${d.usg > 0 ? `<span class="absolute -top-5 left-1/2 -translate-x-1/2 text-[10px] font-bold text-red-600 dark:text-red-400">${d.usg}</span>` : ''}

                      </div>
                      <span class="text-[11px] text-gray-500 font-medium">${d.label}</span>
                    </div>

              </div>
            </div>

            <!-- Graphique 2 : Stock disponible par référence -->
            <div class="bg-white dark:bg-[#242A26] p-6 rounded-2xl border border-gray-200/80 dark:border-gray-800 shadow-xs">
              <div class="flex items-center justify-between mb-4">

              <div class="space-y-3.5">
                ${metrics.map(m => {
                  const pct = Math.min(100, Math.round((m.physicalStock / maxRefStock) * 100));
                  const barColor = m.statusCode === 'OUT' ? 'bg-red-500' : m.statusCode === 'LOW' ? 'bg-amber-500' : 'bg-[#2A623D]';
                  return `
                    <div class="cursor-pointer group" onclick="openReferenceDetailModal('${m.id}')">
                      <div class="flex justify-between text-xs mb-1">
                        <span class="font-bold group-hover:text-[#2A623D] transition">${escapeHTML(m.ref)} <span class="font-normal text-gray-500">— ${escapeHTML(m.designation.slice(0, 34))}${m.designation.length > 34 ? '…' : ''}</span></span>
                        <span class="font-bold">${m.physicalStock} <span class="text-gray-400 font-normal">(min ${m.minStock})</span></span>
                      </div>
                      <div class="w-full h-2.5 bg-gray-100 dark:bg-[#101513] rounded-full overflow-hidden">
                        <div class="h-full ${barColor} rounded-full transition-all duration-500" style="width: ${pct}%"></div>

          <!-- Derniers mouvements + Répartition par zone -->
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 bg-white dark:bg-[#242A26] p-6 rounded-2xl border border-gray-200/80 dark:border-gray-800 shadow-xs">
              <div class="flex items-center justify-between mb-4">
                <h3 class="text-base font-bold">Derniers mouvements de stock</h3>
                <button onclick="navigateTo('history')" class="text-xs font-semibold text-[#1A472A] dark:text-emerald-400 hover:underline">Journal complet →</button>
              </div>
              <div class="divide-y divide-gray-100 dark:divide-gray-800">
                ${movements.slice(0, 5).map(mv => {
                  const r = refLookup[mv.refId] || { ref: mv.refId };
                  const isPos = ['RECEIPT', 'RETURN', 'ADJUSTMENT_POS'].includes(mv.type) || (mv.type === 'CORRECTION' && (mv.signedQty || 0) > 0);
                  const signed = mv.signedQty !== undefined ? mv.signedQty : (isPos ? mv.qty : -mv.qty);
                  return `
                    <div class="py-3 flex items-center justify-between gap-3">
                      <div class="flex items-center gap-3 min-w-0">
                        <div class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0 ${isPos ? 'bg-emerald-50 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-400' : 'bg-red-50 text-red-600 dark:bg-red-950 dark:text-red-400'}">
                          <i data-lucide="${isPos ? 'arrow-down-left' : 'arrow-up-right'}" class="w-4 h-4"></i>
                        </div>
                        <div class="truncate">
                          <p class="text-sm font-bold truncate">${escapeHTML(r.ref)} <span class="font-normal text-xs text-gray-500">• ${escapeHTML(getMovementTypeLabel(mv.type))}</span></p>
                          <p class="text-xs text-gray-500 truncate">${formatDateTimeFR(mv.date)} par ${escapeHTML(mv.user)} ${mv.bl ? '• BL ' + escapeHTML(mv.bl) : mv.pile ? '• ' + escapeHTML(mv.pile) : ''}</p>
                        </div>
                      </div>
                      <div class="text-right shrink-0">
                        <span class="text-sm font-extrabold ${isPos ? 'text-emerald-600 dark:text-emerald-400' : 'text-red-600 dark:text-red-400'}">${signed > 0 ? '+' + signed : signed}</span>
                        <span class="block text-[11px] text-gray-400">Stock : ${mv.stockAfter}</span>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <div class="bg-white dark:bg-[#242A26] p-6 rounded-2xl border border-gray-200/80 dark:border-gray-800 shadow-xs">
              <h3 class="text-base font-bold mb-1">Répartition par zone</h3>
              <p class="text-xs text-gray-500 mb-4">Emplacements sur chantier</p>
              <div class="space-y-3">
                ${zonesList.map(([zoneName, qty]) => `
                  <div class="p-3 rounded-xl bg-[#F7F9F7] dark:bg-[#101513] flex items-center justify-between">
                    <div class="flex items-center gap-2.5 min-w-0">
                      <i data-lucide="map-pin" class="w-4 h-4 text-[#2A623D] shrink-0"></i>
                      <span class="text-xs font-semibold truncate">${escapeHTML(zoneName)}</span>

                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderStockView() {
      const includeArchived = ui.stockFilter === 'ARCHIVED';
      let items = getProjectReferences(includeArchived).map(computeCageMetrics);

      if (ui.stockSearch.trim()) {
        const q = ui.stockSearch.trim().toLowerCase();
        items = items.filter(m =>
          m.ref.toLowerCase().includes(q) ||
          m.designation.toLowerCase().includes(q) ||
          m.type.toLowerCase().includes(q) ||
          (m.zone || '').toLowerCase().includes(q)
        );
      }

      if (ui.stockFilter === 'AVAILABLE') items = items.filter(m => m.physicalStock > 0 && m.status === 'ACTIVE');
      else if (ui.stockFilter === 'LOW') items = items.filter(m => m.statusCode === 'LOW');
      else if (ui.stockFilter === 'OUT') items = items.filter(m => m.statusCode === 'OUT');
      else if (ui.stockFilter === 'ARCHIVED') items = items.filter(m => m.status === 'ARCHIVED');

      items.sort((a, b) => {
        const dir = ui.stockSortDir === 'asc' ? 1 : -1;
        const valA = a[ui.stockSortBy];
        const valB = b[ui.stockSortBy];
        if (typeof valA === 'number' && typeof valB === 'number') return (valA - valB) * dir;
        return String(valA || '').localeCompare(String(valB || '')) * dir;
      });

      const statusBadge = (m) => {
        if (m.statusCode === 'ARCHIVED') return `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-gray-200 text-gray-700 dark:bg-gray-700 dark:text-gray-300">Archivée</span>`;
        if (m.statusCode === 'OUT') return `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-red-100 text-red-700 dark:bg-red-950 dark:text-red-300">Rupture</span>`;
        if (m.statusCode === 'LOW') return `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300">Stock faible</span>`;
        return `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-[#E8F1EB] text-[#1A472A] dark:bg-[#1A472A] dark:text-emerald-200">Satisfaisant</span>`;
      };

      return `
        <div class="space-y-5 animate-view">
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
              <h2 class="text-2xl font-extrabold">Stock actuel du chantier</h2>
              <p class="text-sm text-gray-500">Calcul automatique en temps réel à partir des mouvements validés</p>
            </div>
            <div class="flex flex-wrap gap-2">
              <button onclick="exportStockCSV()" class="px-4 py-2.5 rounded-xl bg-white dark:bg-[#242A26] border border-gray-300 dark:border-gray-700 text-sm font-semibold hover:bg-gray-50 flex items-center gap-2">
                <i data-lucide="download" class="w-4 h-4 text-[#2A623D]"></i> Exporter CSV
              </button>
              ${canOperate() ? `
                <button onclick="navigateTo('receipt')" class="px-4 py-2.5 rounded-xl bg-[#1A472A] hover:bg-[#2A623D] text-white text-sm font-semibold flex items-center gap-2">
                  <i data-lucide="plus" class="w-4 h-4"></i> Nouvelle réception
                </button>
              ` : ''}
            </div>
          </div>

          <!-- Barre de recherche & filtres -->
          <div class="bg-white dark:bg-[#242A26] p-4 rounded-2xl border border-gray-200/80 dark:border-gray-800 flex flex-col md:flex-row gap-3 justify-between">
            <div class="relative flex-1 max-w-md">
              <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3.5 top-3"></i>
              <input type="text" value="${escapeHTML(ui.stockSearch)}" oninput="setUI({ stockSearch: this.value })" placeholder="Rechercher référence, désignation, zone..." class="w-full pl-10 pr-4 py-2 rounded-xl border border-gray-300 dark:border-gray-700 bg-[#F7F9F7] dark:bg-[#101513] text-sm focus:outline-none focus:ring-2 focus:ring-[#2A623D]" />
            </div>
            <div class="flex flex-wrap gap-1.5">
              ${[
                ['ALL', 'Toutes actives'],
                ['AVAILABLE', 'Disponibles (>0)'],
                ['LOW', 'Stock faible'],
                ['OUT', 'Ruptures'],
                ['ARCHIVED', 'Archivées']
              ].map(([id, label]) => `
                <button onclick="setUI({ stockFilter: '${id}' })" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition ${ui.stockFilter === id ? 'bg-[#1A472A] text-white' : 'bg-gray-100 dark:bg-[#101513] text-gray-600 dark:text-gray-300 hover:bg-gray-200'}">
                  ${label}
                </button>
              `).join('')}
            </div>
          </div>

          <!-- Tableau Desktop -->
          <div class="hidden lg:block bg-white dark:bg-[#242A26] rounded-2xl border border-gray-200/80 dark:border-gray-800 shadow-xs overflow-x-auto">
            <table class="w-full text-left border-collapse text-sm">
              <thead>
                <tr class="bg-[#F7F9F7] dark:bg-[#101513] text-gray-600 dark:text-gray-400 text-xs uppercase tracking-wider border-b border-gray-200 dark:border-gray-800">
                  <th class="p-3.5 cursor-pointer hover:text-[#1A472A]" onclick="toggleStockSort('ref')">Référence ↕</th>
                  <th class="p-3.5">Désignation & Dimensions</th>
                  <th class="p-3.5 text-center">Reçues</th>
                  <th class="p-3.5 text-center">Utilisées</th>
                  <th class="p-3.5 text-center cursor-pointer hover:text-[#1A472A]" onclick="toggleStockSort('physicalStock')">Stock Physique ↕</th>
                  <th class="p-3.5 text-center">Réservées</th>
                  <th class="p-3.5 text-center">Dispo. Libre</th>
                  <th class="p-3.5 text-center">Reste à livrer</th>
                  <th class="p-3.5">Zone</th>
                  <th class="p-3.5 text-center">Statut</th>
                  <th class="p-3.5 text-right">Actions rapides</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-100 dark:divide-gray-800">
                ${items.length === 0 ? `<tr><td colspan="11" class="p-8 text-center text-gray-500">Aucune référence ne correspond aux filtres sélectionnés.</td></tr>` : items.map(m => `
                  <tr class="hover:bg-[#F7F9F7] dark:hover:bg-white/5 transition">
                    <td class="p-3.5 font-extrabold text-[#1A472A] dark:text-emerald-400 whitespace-nowrap">
                      <button onclick="openReferenceDetailModal('${m.id}')" class="hover:underline">${escapeHTML(m.ref)}</button>
                    </td>
                    <td class="p-3.5">
                      <p class="font-semibold text-[#101513] dark:text-white">${escapeHTML(m.designation)}</p>
                      <p class="text-xs text-gray-500">${escapeHTML(m.type)} • Ø${m.diameter} mm • L = ${m.length} m</p>
                    </td>
                    <td class="p-3.5 text-center text-gray-600 dark:text-gray-300 font-medium">${m.totalReceived}</td>
                    <td class="p-3.5 text-center text-gray-600 dark:text-gray-300 font-medium">${m.totalUsed}</td>
                    <td class="p-3.5 text-center">
                      <span class="text-lg font-extrabold">${m.physicalStock}</span>
                    </td>
                    <td class="p-3.5 text-center text-gray-500">${m.reservedQty}</td>
                    <td class="p-3.5 text-center font-bold text-[#1A472A] dark:text-emerald-400">${m.availableStock}</td>
                    <td class="p-3.5 text-center font-semibold ${m.remainingToDeliver < 0 ? 'text-amber-600' : 'text-gray-600 dark:text-gray-300'}">
                      ${m.plannedQty > 0 ? (m.remainingToDeliver < 0 ? `+${Math.abs(m.remainingToDeliver)} (dép.)` : m.remainingToDeliver) : '—'}
                    </td>
                    <td class="p-3.5 text-xs text-gray-600 dark:text-gray-400">${escapeHTML(m.zone || '—')}</td>
                    <td class="p-3.5 text-center">${statusBadge(m)}</td>
                    <td class="p-3.5 text-right whitespace-nowrap">
                      <div class="inline-flex items-center gap-1.5">
                        ${canOperate() && m.status === 'ACTIVE' ? `
                          <button onclick="navigateTo('receipt', '${m.id}')" title="Réceptionner cette référence" class="px-2.5 py-1.5 rounded-lg bg-[#E8F1EB] hover:bg-[#1A472A] text-[#1A472A] hover:text-white text-xs font-bold transition">+ Récept.</button>
                          <button onclick="navigateTo('usage', '${m.id}')" title="Enregistrer une sortie" class="px-2.5 py-1.5 rounded-lg bg-red-50 hover:bg-red-600 text-red-700 hover:text-white text-xs font-bold transition">− Sortie</button>
                        ` : ''}
                        <button onclick="openReferenceDetailModal('${m.id}')" title="Fiche & Historique" class="p-1.5 rounded-lg border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-white/10 text-gray-600 dark:text-gray-300">
                          <i data-lucide="eye" class="w-4 h-4"></i>
                        </button>
                      </div>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>

          <!-- Cartes Responsive Mobile / Tablette -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 lg:hidden">
            ${items.map(m => `
              <div class="bg-white dark:bg-[#242A26] p-4 rounded-2xl border border-gray-200 dark:border-gray-800 shadow-xs space-y-3">
                <div class="flex items-start justify-between gap-2">
                  <div>
                    <span class="text-base font-extrabold text-[#1A472A] dark:text-emerald-400">${escapeHTML(m.ref)}</span>
                    <h4 class="text-sm font-semibold mt-0.5">${escapeHTML(m.designation)}</h4>
                    <p class="text-xs text-gray-500">Ø${m.diameter} mm • L: ${m.length} m • ${escapeHTML(m.zone || '')}</p>
                  </div>
                  ${statusBadge(m)}
                </div>
                <div class="grid grid-cols-3 gap-2 text-center bg-[#F7F9F7] dark:bg-[#101513] p-2.5 rounded-xl">
                  <div><span class="text-[11px] text-gray-500 block">Physique</span><span class="text-lg font-extrabold">${m.physicalStock}</span></div>
                  <div><span class="text-[11px] text-gray-500 block">Dispo libre</span><span class="text-lg font-bold text-[#2A623D] dark:text-emerald-400">${m.availableStock}</span></div>
                  <div><span class="text-[11px] text-gray-500 block">Reste livrer</span><span class="text-lg font-bold">${m.plannedQty > 0 ? m.remainingToDeliver : '—'}</span></div>
                </div>
                <div class="flex gap-2 pt-1">
                  ${canOperate() && m.status === 'ACTIVE' ? `
                    <button onclick="navigateTo('receipt', '${m.id}')" class="flex-1 py-2.5 rounded-xl bg-[#1A472A] text-white text-xs font-bold">+ Réceptionner</button>
                    <button onclick="navigateTo('usage', '${m.id}')" class="flex-1 py-2.5 rounded-xl bg-red-600 text-white text-xs font-bold">− Sortie</button>
                  ` : ''}
                  <button onclick="openReferenceDetailModal('${m.id}')" class="px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-700 text-xs font-semibold">Détails</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function toggleStockSort(field) {
      if (ui.stockSortBy === field) {
        ui.stockSortDir = ui.stockSortDir === 'asc' ? 'desc' : 'asc';
      } else {
        ui.stockSortBy = field;
        ui.stockSortDir = 'asc';
      }
      render();
    }

    function renderReceiptView() {
      const project = getActiveProject();
      const activeRefs = getProjectReferences(false).map(computeCageMetrics);
      const form = ui.receiptForm;

      // Calcul du récapitulatif avant validation
      const summaryLines = form.lines
        .filter(l => l.refId && Number(l.qty) > 0)
        .map(l => {
          const m = activeRefs.find(r => r.id === l.refId);
          if (!m) return null;
          const q = parseInt(l.qty, 10);
          return { ref: m.ref, designation: m.designation, before: m.physicalStock, added: q, after: m.physicalStock + q };
        })
        .filter(Boolean);

      return `
        <div class="max-w-4xl mx-auto space-y-6 animate-view">
          <div class="flex items-center justify-between">
            <div>
              <span class="inline-flex items-center gap-1.5 text-xs font-bold uppercase tracking-wider text-[#2A623D] dark:text-emerald-400">
                <i data-lucide="zap" class="w-3.5 h-3.5"></i> Saisie express chantier (< 30 sec)
              </span>
              <h2 class="text-2xl font-extrabold mt-0.5">Nouvelle réception de cages d'armatures</h2>
            </div>
            <button onclick="navigateTo('stock')" class="text-sm text-gray-500 hover:text-[#101513] dark:hover:text-white font-medium">← Retour au stock</button>
          </div>

          ${!canOperate() ? `
            <div class="p-4 rounded-xl bg-amber-50 border border-amber-300 text-amber-900 text-sm font-medium">
              Vous êtes connecté avec le profil <strong>Consultation</strong>. Passez en profil <strong>Utilisateur opérationnel</strong> ou <strong>Administrateur</strong> en haut de l'écran pour enregistrer une réception.
            </div>
          ` : ''}

          <div class="bg-white dark:bg-[#242A26] rounded-2xl border border-gray-200 dark:border-gray-800 shadow-sm overflow-hidden">
            <div class="p-6 space-y-6">
              <!-- Informations générales livraison -->
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div>
                  <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Chantier concerné</label>
                  <input type="text" disabled value="${escapeHTML(project.name)}" class="w-full p-2.5 rounded-xl bg-gray-100 dark:bg-[#101513] border border-gray-200 dark:border-gray-700 text-sm font-semibold text-gray-600 dark:text-gray-300" />
                </div>
                <div>
                  <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Date de réception *</label>
                  <input type="date" value="${form.date}" onchange="ui.receiptForm.date=this.value" class="w-full p-2.5 rounded-xl border border-gray-300 dark:border-gray-700 bg-white dark:bg-[#101513] text-sm font-medium" />
                </div>
                <div>
                  <label class="block text-xs font-bold uppercase text-gray-500 mb-1">N° Bon de Livraison (BL)</label>
                  <input type="text" value="${escapeHTML(form.bl)}" oninput="ui.receiptForm.bl=this.value" placeholder="Ex: BL-2026-925" class="w-full p-2.5 rounded-xl border border-gray-300 dark:border-gray-700 bg-white dark:bg-[#101513] text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Fournisseur</label>
                  <select onchange="ui.receiptForm.supplier=this.value" class="w-full p-2.5 rounded-xl border border-gray-300 dark:border-gray-700 bg-white dark:bg-[#101513] text-sm">
                    ${['Armatures Île-de-France', 'SiderArmature Pro', 'Acier & Fondations France', 'Autre fournisseur'].map(s =>
                      `<option value="${s}" ${form.supplier === s ? 'selected' : ''}>${s}</option>`
                    ).join('')}
                  </select>
                </div>
              </div>

              <!-- Lignes de cages réceptionnées -->
              <div class="space-y-3">
                <div class="flex items-center justify-between">
                  <label class="text-sm font-bold text-[#101513] dark:text-white">Cages réceptionnées dans cette livraison *</label>
                  <span class="text-xs text-gray-500">Saisissez uniquement des quantités entières</span>
                </div>

                ${form.lines.map((line, idx) => {
                  const selectedMetric = activeRefs.find(r => r.id === line.refId);
                  return `
                    <div class="p-4 rounded-xl bg-[#F7F9F7] dark:bg-[#101513] border border-gray-200 dark:border-gray-800 flex flex-col sm:flex-row gap-3 items-stretch sm:items-end">
                      <div class="flex-1">
                        <label class="block text-xs font-semibold text-gray-500 mb-1">Référence de cage #${idx + 1}</label>
                        <select onchange="ui.receiptForm.lines[${idx}].refId=this.value; render();" class="w-full p-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-white dark:bg-[#242A26] font-bold text-sm">
                          ${activeRefs.map(r => `<option value="${r.id}" ${line.refId === r.id ? 'selected' : ''}>${escapeHTML(r.ref)} — ${escapeHTML(r.designation)} (Stock : ${r.physicalStock})</option>`).join('')}

                        <label class="block text-xs font-semibold text-gray-500 mb-1">Quantité reçue *</label>

                      </div>

    function renderReceiptSummaryHTML(summaryLines) {
      if (!summaryLines || summaryLines.length === 0) {
        return `<div class="p-4 rounded-xl bg-gray-50 dark:bg-[#101513]/60 border border-gray-200 dark:border-gray-800 text-xs text-gray-500">Indiquez une quantité ci-dessus pour visualiser le calcul automatique du nouveau stock.</div>`;
      }
      return `
        <div class="p-4 rounded-xl bg-[#E8F1EB] dark:bg-[#1A472A]/40 border border-[#2A623D]/30 space-y-2">
          <p class="text-xs font-bold uppercase tracking-wider text-[#1A472A] dark:text-emerald-300">Récapitulatif automatique avant validation</p>
          <div class="divide-y divide-[#2A623D]/15">
            ${summaryLines.map(s => `
              <div class="py-1.5 flex items-center justify-between text-sm">
                <span class="font-bold">${escapeHTML(s.ref)}</span>
                <span>Ancien stock : <strong>${s.before}</strong> → Réception : <strong class="text-emerald-700 dark:text-emerald-400">+${s.added}</strong> → Nouveau stock : <strong class="text-base underline">${s.after} cages</strong></span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function updateReceiptPreview() {
      const box = document.getElementById('receipt-summary-box');
      if (!box) return;
      const activeRefs = getProjectReferences(false).map(computeCageMetrics);
      const summaryLines = ui.receiptForm.lines
        .filter(l => l.refId && Number(l.qty) > 0)
        .map(l => {
          const m = activeRefs.find(r => r.id === l.refId);
          if (!m) return null;
          const q = parseInt(l.qty, 10);
          return { ref: m.ref, designation: m.designation, before: m.physicalStock, added: q, after: m.physicalStock + q };
        })
        .filter(Boolean);
      box.innerHTML = renderReceiptSummaryHTML(summaryLines);
    }

    function renderForecastsView() {
      const refs = getProjectReferences(false).map(computeCageMetrics);
      const forecastMap = Object.fromEntries(appState.forecasts.map(f => [f.refId, f]));

      return `
        <div class="space-y-6 animate-view">
          <div>
            <h2 class="text-2xl font-extrabold">Livraisons prévisionnelles & Avancement</h2>
            <p class="text-sm text-gray-500">Suivi des quantités prévues au marché vs quantités déjà réceptionnées sur chantier</p>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
            ${refs.map(r => {
              const fc = forecastMap[r.id] || {};
              const planned = r.plannedQty || 0;
              const pct = planned > 0 ? Math.min(100, Math.round((r.totalReceived / planned) * 100)) : 0;
              const isOver = planned > 0 && r.remainingToDeliver < 0;

              return `
                <div class="bg-white dark:bg-[#242A26] p-5 rounded-2xl border ${isOver ? 'border-amber-300 dark:border-amber-700' : 'border-gray-200 dark:border-gray-800'} shadow-xs space-y-4">
                  <div class="flex items-start justify-between">
                    <div>

                      <h3 class="text-sm font-bold">${escapeHTML(r.designation)}</h3>
                    </div>
                    <span class="px-2.5 py-1 rounded-lg text-xs font-bold ${isOver ? 'bg-amber-100 text-amber-800' : 'bg-[#E8F1EB] text-[#1A472A]'}">

                    <div class="w-full h-3 bg-gray-100 dark:bg-[#101513] rounded-full overflow-hidden">

                    </div>
                    <div class="flex justify-between text-xs mt-2 font-medium">
                      <span>Prévu : <strong>${planned}</strong></span>
                      <span>Réceptionné : <strong class="text-emerald-700 dark:text-emerald-400">${r.totalReceived}</strong></span>
                      <span>Reste à recevoir : <strong class="${isOver ? 'text-amber-600' : ''}">${isOver ? 'Dépassement (+' + Math.abs(r.remainingToDeliver) + ')' : Math.max(0, r.remainingToDeliver)}</strong></span>

                  </div>

                  <div class="pt-3 border-t border-gray-100 dark:border-gray-800 flex items-center justify-between text-xs text-gray-500">
                    <span>Stock dispo actuel : <strong class="text-[#101513] dark:text-white">${r.physicalStock} cages</strong></span>

                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

            m.id.toLowerCase().includes(q) ||
            (r.ref || '').toLowerCase().includes(q) ||
            (m.user || '').toLowerCase().includes(q) ||

              <div class="flex items-center gap-2 bg-[#E8F1EB] dark:bg-[#1A472A]/60 px-3 py-1.5 rounded-xl border border-[#2A623D]/20">
                <span class="w-2 h-2 rounded-full bg-[#2A623D] dark:bg-emerald-400 shrink-0"></span>
                <select onchange="setState({ activeProjectId: this.value }); navigateTo(ui.route);" class="bg-transparent text-xs sm:text-sm font-bold text-[#1A472A] dark:text-emerald-200 focus:outline-none cursor-pointer max-w-[180px] sm:max-w-xs truncate">
                  ${appState.projects.map(p => `<option value="${p.id}" class="text-black" ${p.id === project.id ? 'selected' : ''}>${escapeHTML(p.name)}</option>`).join('')}
                </select>
              </div>
            </div>

            <div class="flex items-center gap-2 sm:gap-4">
              <span class="hidden md:flex items-center gap-1.5 text-xs font-medium text-gray-500 dark:text-gray-400">
                <i data-lucide="calendar" class="w-4 h-4"></i> ${todayFormatted}
              </span>

              <!-- Sélecteur rapide de rôle de démonstration -->
              <select onchange="setState({ currentUserId: this.value }); showToast('Rôle modifié', 'Profil actif : ' + this.options[this.selectedIndex].text);" title="Changer le profil utilisateur de démonstration" class="hidden sm:block text-xs font-semibold px-2.5 py-1.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-[#F7F9F7] dark:bg-[#101513] cursor-pointer">
                ${DEFAULT_USERS.map(u => `<option value="${u.id}" ${u.id === user.id ? 'selected' : ''}>${escapeHTML(u.name)} (${u.role === 'ADMIN' ? 'Admin' : u.role === 'OPERATIONAL' ? 'Opé.' : 'Consult.'})</option>`).join('')}
              </select>

              <!-- Cloche notifications alertes -->
              <button onclick="navigateTo('stock')" class="relative p-2 rounded-xl hover:bg-gray-100 dark:hover:bg-white/5 text-gray-600 dark:text-gray-300" title="Alertes de stock">
                <i data-lucide="bell" class="w-5 h-5"></i>
                ${alerts.length > 0 ? `<span class="absolute top-1.5 right-1.5 w-2.5 h-2.5 rounded-full bg-red-500 ring-2 ring-white dark:ring-[#242A26]"></span>` : ''}
              </button>
            </div>
          </header>

          <!-- Contenu Scrollable -->
          <main class="flex-1 overflow-y-auto custom-scrollbar p-4 sm:p-6 lg:p-8">
            <div class="max-w-7xl mx-auto">
              ${mainContent}
            </div>
          </main>
        </div>
      `;

      if (window.lucide) {
        window.lucide.createIcons();
      }
    }

    // Lancement initial au chargement
    window.addEventListener('DOMContentLoaded', () => {
      render();
    });
    render();
  </script>
</body>
</html>
