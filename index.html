        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');

    function fmtDateTime(iso) {
      if (!iso) return '—';
      try {
        return new Date(iso).toLocaleString('fr-FR', {
          timeZone: 'Europe/Paris',
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
      } catch {
        return iso;
      }
    }

    function toast(title, desc = '', type = 'success') {
      const root = document.getElementById('toast-root');
      if (!root) return;
      const el = document.createElement('div');
      const bg = type === 'error' ? 'bg-red-700' : type === 'warn' ? 'bg-amber-600' : 'bg-[#101513]';
      el.className = `${bg} text-white px-4 py-3 rounded-2xl shadow-2xl border border-white/10 max-w-sm pointer-events-auto animate-view`;
      el.innerHTML = `<p class="text-xs font-extrabold">${esc(title)}</p>${desc ? `<p class="text-[11px] text-gray-200 mt-0.5">${esc(desc)}</p>` : ''}`;
      root.appendChild(el);
      setTimeout(() => el.remove(), 3800);
    }

        req.onupgradeneeded = () => {
          const idb = req.result;
          if (!idb.objectStoreNames.contains(IDB_STORE)) idb.createObjectStore(IDB_STORE);
        };
        req.onsuccess = () => {
          const idb = req.result;
          const tx = idb.transaction(IDB_STORE, 'readwrite');
          tx.objectStore(IDB_STORE).put(snapshot, 'latest');
        };
      } catch {}
    }

    function restoreFromIndexedDBIfNeeded() {
      if (state.initialized) return;
      try {
        const req = indexedDB.open(IDB_NAME, 1);
        req.onsuccess = () => {
          const idb = req.result;
          if (!idb.objectStoreNames.contains(IDB_STORE)) return;
          const tx = idb.transaction(IDB_STORE, 'readonly');
          const getReq = tx.objectStore(IDB_STORE).get('latest');
          getReq.onsuccess = () => {
            if (getReq.result && getReq.result.initialized) {
              state = getReq.result;
              localStorage.setItem(LOCAL_KEY, JSON.stringify(state));
              render();
            }
          };
        };
      } catch {}
    }

    async function persistState(pushCloud = true) {
      try {
        const serialized = JSON.stringify(state);
        localStorage.setItem(LOCAL_KEY, serialized);
        saveToIndexedDB(state);
        if (pushCloud && db && cloudStatus.connected && state.initialized) {
          await setDoc(doc(db, 'stocage_workspaces', 'main_workspace'), {
            payload: serialized,
            updatedAt: new Date().toISOString()
          });
        }
      } catch (e) {
        cloudStatus.connected = false;
        cloudStatus.error = e?.message || 'Accès Cloud restreint';
      }
    }

    function updateState(patch) {
      state = { ...state, ...patch };
      persistState(true);
      render();
    }

    async function initFirebaseSync() {
      const cfg = state.firebaseConfig;
      if (!cfg || !cfg.apiKey || !cfg.projectId) {
        cloudStatus.connected = false;
        return;
      }
      try {
        const app = initializeApp(cfg);
        const auth = getAuth(app);
        db = getFirestore(app);
        await signInAnonymously(auth);
        onSnapshot(
          doc(db, 'stocage_workspaces', 'main_workspace'),
          (snap) => {
            cloudStatus.connected = true;
            cloudStatus.error = null;
            if (snap.exists() && snap.data().payload) {
              const remote = JSON.parse(snap.data().payload);
              if (remote && remote.initialized) {
                state = { ...remote, firebaseConfig: state.firebaseConfig };
                localStorage.setItem(LOCAL_KEY, JSON.stringify(state));
                render();
              }
            }
          },
          (err) => {
            cloudStatus.connected = false;
            cloudStatus.error = err.message;
            db = null;
            render();
          }
        );
      } catch (err) {
        cloudStatus.connected = false;
        cloudStatus.error = err.message;
        db = null;
      }
    }
