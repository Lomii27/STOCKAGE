    // =========================================================================

    function loadInitialState() {
      try {
        const raw = localStorage.getItem(LOCAL_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.initialized === true && Array.isArray(parsed.projects) && parsed.projects.length > 0) {

          }
        }
      } catch (e) {
        console.warn('Lecture localStorage impossible:', e);
      }
      return createUnconfiguredState();
    }

      return String(v ?? '')

        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');

      if (!iso) return '—';
      try {
        return new Date(iso).toLocaleString('fr-FR', {
          timeZone: 'Europe/Paris',
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'

      } catch {
        return iso;
      }

    function toast(title, desc = '', type = 'success') {
      const root = document.getElementById('toast-root');
      if (!root) return;
      const el = document.createElement('div');
      const bg = type === 'error' ? 'bg-red-700' : type === 'warn' ? 'bg-amber-600' : 'bg-[#101513]';
      el.className = `${bg} text-white px-4 py-3 rounded-2xl shadow-2xl border border-white/10 max-w-sm pointer-events-auto animate-view`;
      el.innerHTML = `<p class="text-xs font-extrabold">${esc(title)}</p>${desc ? `<p class="text-[11px] text-gray-200 mt-0.5">${esc(desc)}</p>` : ''}`;
      root.appendChild(el);
      setTimeout(() => el.remove(), 3800);
    }

    // =========================================================================
    // 4. PERSISTANCE DOUBLE (LOCALSTORAGE + INDEXEDDB + FIREBASE)
    // =========================================================================
    function saveToIndexedDB(snapshot) {
      try {
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = () => {
          const idb = req.result;
          if (!idb.objectStoreNames.contains(IDB_STORE)) idb.createObjectStore(IDB_STORE);
        };
        req.onsuccess = () => {
          const idb = req.result;
          const tx = idb.transaction(IDB_STORE, 'readwrite');
          tx.objectStore(IDB_STORE).put(snapshot, 'latest');
        };
      } catch {}
    }

    function restoreFromIndexedDBIfNeeded() {
      if (state.initialized) return;
      try {
        const req = indexedDB.open(IDB_NAME, 1);
        req.onsuccess = () => {
          const idb = req.result;
          if (!idb.objectStoreNames.contains(IDB_STORE)) return;
          const tx = idb.transaction(IDB_STORE, 'readonly');
          const getReq = tx.objectStore(IDB_STORE).get('latest');
          getReq.onsuccess = () => {
            if (getReq.result && getReq.result.initialized) {
              state = getReq.result;
              localStorage.setItem(LOCAL_KEY, JSON.stringify(state));
              render();
            }
          };
        };
      } catch {}
    }

    async function persistState(pushCloud = true) {
      try {
        const serialized = JSON.stringify(state);
        localStorage.setItem(LOCAL_KEY, serialized);
        saveToIndexedDB(state);
        if (pushCloud && db && state.initialized) {
          await setDoc(doc(db, 'stocage_workspaces', 'main_workspace'), {
            payload: serialized,
            updatedAt: new Date().toISOString()
          });
        }
      } catch (e) {
        console.warn('Erreur sauvegarde:', e);
      }
    }

    function updateState(patch) {
      state = { ...state, ...patch };
      persistState(true);
      render();
    }

    async function initFirebaseSync() {
      const cfg = state.firebaseConfig || (typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null);
      if (!cfg || !cfg.apiKey || !cfg.projectId) return;
      try {
        const app = initializeApp(cfg);
        const auth = getAuth(app);
        db = getFirestore(app);
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
        cloudStatus.connected = true;
        onSnapshot(doc(db, 'stocage_workspaces', 'main_workspace'), (snap) => {
          if (snap.exists() && snap.data().payload) {
            const remote = JSON.parse(snap.data().payload);
            if (remote && remote.initialized) {
              state = { ...remote, firebaseConfig: state.firebaseConfig };
              localStorage.setItem(LOCAL_KEY, JSON.stringify(state));
              render();
            }
          }
        });
        render();
      } catch (err) {
        cloudStatus.connected = false;
        cloudStatus.error = err.message;
      }
    }

    // =========================================================================
    // 5. ACCESSEURS MÉTIER & CALCULS DE STOCK
    // =========================================================================
    function getActiveProject() {
      return state.projects.find(p => p.id === state.activeProjectId) || state.projects[0];
    }

    function getCurrentUser() {
      return state.users.find(u => u.id === state.currentUserId) || state.users[0] || { name: 'Administrateur', role: 'ADMIN' };
    }

    function isAdmin() {
      return getCurrentUser().role === 'ADMIN';
    }

    function canOperate() {
      return ['ADMIN', 'OPERATIONAL'].includes(getCurrentUser().role);
    }

    function getProjectRefs(includeArchived = true) {
      return state.references.filter(r => r.projectId === state.activeProjectId && (includeArchived || r.active !== false));
    }

    function getProjectMovements() {
      return state.movements
        .filter(m => m.projectId === state.activeProjectId)
        .sort((a, b) => new Date(b.date) - new Date(a.date));
    }

    function getProjectPiles() {
      return state.ndcPiles.filter(p => p.projectId === state.activeProjectId);
    }

    function computeRefStats(refObj) {
      const mvs = state.movements.filter(m => m.projectId === state.activeProjectId && m.refId === refObj.id);
      let received = 0;
      let used = 0;
      let adjustments = 0;
      mvs.forEach(m => {
        if (m.type === 'RECEIPT') received += m.qty;
        else if (m.type === 'USAGE') used += m.qty;
        else if (m.type === 'RETURN' || m.type === 'ADJUSTMENT_POS') adjustments += m.qty;
        else if (m.type === 'ADJUSTMENT_NEG') adjustments -= m.qty;
      });
      const initial = Number(refObj.initialStock || 0);
      const currentStock = initial + received - used + adjustments;
      const planned = Number(refObj.plannedQty || 0);
      const remainingToDeliver = planned - (initial + received);
      let status = 'OK';
      if (refObj.active === false) status = 'ARCHIVED';
      else if (currentStock <= 0) status = 'OUT';
      else if (currentStock <= Number(refObj.minStock || 0)) status = 'LOW';

      return {
        ...refObj,
        received,
        used,
        currentStock,
        planned,
        remainingToDeliver,
        status
      };
    }

    function recalculateChain(movementsList) {
      const sorted = [...movementsList].sort((a, b) => new Date(a.date) - new Date(b.date));
      const running = {};
      state.references.forEach(r => {
        running[r.id] = Number(r.initialStock || 0);
      });
      return sorted.map(m => {
        const before = running[m.refId] ?? 0;
        const delta = ['RECEIPT', 'RETURN', 'ADJUSTMENT_POS'].includes(m.type) ? m.qty : -m.qty;
        const after = before + delta;
        running[m.refId] = after;
        return { ...m, stockBefore: before, stockAfter: after };
      });
    }

    window.restoreBackupJSON = function (event) {

      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {

          if (!imported || !Array.isArray(imported.projects)) {
            return toast('Fichier invalide', 'Ce fichier ne correspond pas à une sauvegarde STOCAGE.', 'error');
          }
          state = { ...imported, initialized: true };
          persistState(true);
          render();
          toast('Sauvegarde restaurée', 'Toutes vos données chantier ont été rechargées.');
        } catch {
          toast('Erreur de lecture', 'Impossible de lire le fichier JSON.', 'error');

      reader.readAsText(file);
    };

      const lines = [header.join(';')].concat(rows.map(r => [
        r.ref, r.diameter, r.length, r.initialStock, r.received, r.used, r.currentStock, r.planned, r.remainingToDeliver, r.zone
      ].join(';')));
      const blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);

    window.handleReceiptSubmit = function (e) {
      e.preventDefault();
      if (!canOperate()) return toast('Accès refusé', 'Votre profil est en consultation seule.', 'error');
      const f = ui.receipt;
      const validLines = f.lines.filter(l => l.refId && parseInt(l.qty, 10) > 0);
      if (!validLines.length) return toast('Quantité requise', 'Saisissez au moins une quantité valide.', 'error');

      const user = getCurrentUser();
      const isoDate = `${f.date}T${new Date().toTimeString().slice(0, 8)}`;
      const newMvs = [...state.movements];

      validLines.forEach((l, idx) => {
        newMvs.push({
          id: `MV-REC-${Date.now().toString().slice(-5)}-${idx}`,
          projectId: state.activeProjectId,
          refId: l.refId,
          type: 'RECEIPT',
          qty: parseInt(l.qty, 10),
          date: isoDate,
          user: user.name,
          bl: f.bl.trim(),
          comment: [f.supplier.trim(), f.comment.trim()].filter(Boolean).join(' — ')
        });
      });

      updateState({ movements: recalculateChain(newMvs) });
      ui.receipt.bl = '';
      ui.receipt.comment = '';
      ui.receipt.lines = [{ refId: validLines[0].refId, qty: '' }];

    window.handleUsageSubmit = function (e) {
      e.preventDefault();
      if (!canOperate()) return toast('Accès refusé', 'Votre profil est en consultation seule.', 'error');
      const f = ui.usage;
      const validLines = f.lines.filter(l => l.refId && parseInt(l.qty, 10) > 0);
      if (!validLines.length) return toast('Quantité requise', 'Saisissez au moins une quantité.', 'error');

      const statsMap = Object.fromEntries(getProjectRefs(true).map(r => [r.id, computeRefStats(r)]));
      for (const l of validLines) {
        const st = statsMap[l.refId];
        const q = parseInt(l.qty, 10);

          return toast('Stock physique insuffisant', `${st ? st.ref : 'Cage'} : disponible ${st ? st.currentStock : 0}, demandé ${q}.`, 'error');
        }
      }

      const user = getCurrentUser();
      const isoDate = `${f.date}T${new Date().toTimeString().slice(0, 8)}`;
      const newMvs = [...state.movements];

      validLines.forEach((l, idx) => {
        newMvs.push({
          id: `MV-USE-${Date.now().toString().slice(-5)}-${idx}`,
          projectId: state.activeProjectId,
          refId: l.refId,

          pile: f.pileNumber.trim() ? `Pieu ${f.pileNumber.trim()}` : '',
          comment: [f.zone.trim(), f.comment.trim()].filter(Boolean).join(' — ')
        });
      });

      updateState({ movements: recalculateChain(newMvs) });
      ui.usage.pileNumber = '';
      ui.usage.comment = '';
      ui.usage.lines = [{ refId: validLines[0].refId, qty: '' }];
      toast('Sortie enregistrée', 'Le stock physique a été déduit.');

    function renderNdcView() {
      const refs = getProjectRefs(false);
      const refMap = Object.fromEntries(state.references.map(r => [r.id, r]));
      const nf = ui.ndcForm;
      const ngfVal = parseFloat(nf.ngfDepth);
      const nbrVal = parseFloat(nf.nbr);
      const deltaPreview = (!isNaN(ngfVal) && !isNaN(nbrVal)) ? (ngfVal - nbrVal).toFixed(2) : '—';

      let piles = getProjectPiles();
      if (ui.diameterFilter !== 'ALL') piles = piles.filter(p => p.diameter === ui.diameterFilter);
      if (ui.ndcSearch.trim()) {
        const q = ui.ndcSearch.trim().toLowerCase();
        piles = piles.filter(p => p.pileNumber.toLowerCase().includes(q) || p.diameter.toLowerCase().includes(q));
      }

      window.handleNdcSubmit = function (e) {
        e.preventDefault();
        if (!canOperate()) return toast('Accès refusé', 'Profil en consultation seule.', 'error');
        const pileNum = nf.pileNumber.trim();
        if (!pileNum) return;

        const validCages = nf.cages.filter(c => c.refId && parseInt(c.qty, 10) > 0).map(c => ({
          refId: c.refId,
          qty: parseInt(c.qty, 10)
        }));

        const ngf = parseFloat(nf.ngfDepth);
        const nbr = parseFloat(nf.nbr);
        const delta = (!isNaN(ngf) && !isNaN(nbr)) ? Number((ngf - nbr).toFixed(2)) : null;

        const newPile = {
          id: `NDC-${Date.now().toString(36).toUpperCase()}`,
          projectId: state.activeProjectId,
          pileNumber: pileNum,
          diameter: nf.diameter,
          ngfDepth: isNaN(ngf) ? null : ngf,
          pileLength: parseFloat(nf.pileLength) || 0,
          soupape: nf.soupape === 'OUI',
          soupapeHeight: nf.soupape === 'OUI' ? (parseFloat(nf.soupapeHeight) || 0) : null,
          nbr: isNaN(nbr) ? null : nbr,
          delta,
          cages: validCages,
          status: nf.status
        };

        let newRefs = [...state.references];
        let newMvs = [...state.movements];

        // Mise à jour des quantités prévues NDC sur les cages associées
        validCages.forEach(item => {
          newRefs = newRefs.map(r => r.id === item.refId ? { ...r, plannedQty: Number(r.plannedQty || 0) + item.qty } : r);
        });

        // Si le pieu est déjà marqué Coulé, déduire automatiquement du stock
        if (newPile.status === 'COULE' && validCages.length > 0) {
          const statsMap = Object.fromEntries(newRefs.map(r => [r.id, computeRefStats(r)]));
          for (const item of validCages) {
            if ((statsMap[item.refId]?.currentStock || 0) < item.qty) {
              return toast('Stock insuffisant pour coulage', `Impossible de passer ${pileNum} en Coulé : stock cage insuffisant.`, 'error');
            }
          }
          const user = getCurrentUser();
          const now = new Date().toISOString();
          validCages.forEach((item, idx) => {
            newMvs.push({
              id: `MV-NDC-${Date.now().toString().slice(-5)}-${idx}`,
              projectId: state.activeProjectId,
              refId: item.refId,
              type: 'USAGE',
              qty: item.qty,
              date: now,
              user: user.name,
              pile: `Pieu ${pileNum}`,
              comment: `Note de Calcul (${nf.diameter}, L=${newPile.pileLength}m)`
            });
          });
        }

        updateState({
          ndcPiles: [newPile, ...state.ndcPiles],
          references: newRefs,
          movements: recalculateChain(newMvs)
        });

        ui.ndcForm.pileNumber = '';
        ui.ndcForm.ngfDepth = '';
        ui.ndcForm.pileLength = '';
        ui.ndcForm.soupapeHeight = '';
        ui.ndcForm.nbr = '';
        toast('Pieu ajouté à la Note de Calcul', `${pileNum} (${nf.diameter}) enregistré.`);
      };

      window.markPilePoured = function (pileId) {
        if (!canOperate()) return toast('Accès refusé', '', 'error');
        const pile = state.ndcPiles.find(p => p.id === pileId);
        if (!pile || pile.status === 'COULE') return;

        const statsMap = Object.fromEntries(getProjectRefs(true).map(r => [r.id, computeRefStats(r)]));
        for (const item of pile.cages || []) {
          if ((statsMap[item.refId]?.currentStock || 0) < item.qty) {
            return toast('Stock insuffisant', `Stock insuffisant pour couler le pieu ${pile.pileNumber}.`, 'error');
          }
        }

        const user = getCurrentUser();
        const now = new Date().toISOString();
        const newMvs = [...state.movements];
        (pile.cages || []).forEach((item, idx) => {
          newMvs.push({
            id: `MV-NDC-${Date.now().toString().slice(-5)}-${idx}`,
            projectId: state.activeProjectId,
            refId: item.refId,
            type: 'USAGE',
            qty: item.qty,
            date: now,
            user: user.name,
            pile: `Pieu ${pile.pileNumber}`,
            comment: `Coulage pieu NDC (${pile.diameter})`
          });
        });

        updateState({
          ndcPiles: state.ndcPiles.map(p => p.id === pileId ? { ...p, status: 'COULE' } : p),
          movements: recalculateChain(newMvs)
        });
        toast('Pieu marqué Coulé', `Les cages du pieu ${pile.pileNumber} ont été déduites du stock.`);
      };

      return `
        <div class="space-y-6 animate-view">
          <div>
            <h2 class="text-2xl font-extrabold">Note de Calcul (NDC) — Carnet des Pieux</h2>
            <p class="text-sm text-gray-500">Saisissez les paramètres géotechniques et armatures de chaque pieu ; le passage en « Coulé » déduit automatiquement les cages du stock</p>
          </div>

          ${renderDiameterFilterBar()}

          <form onsubmit="handleNdcSubmit(event)" class="bg-white dark:bg-[#242A26] p-6 rounded-2xl border border-gray-200 dark:border-gray-800 space-y-4 text-xs">
            <h3 class="text-sm font-extrabold uppercase tracking-wider text-[#1A472A] dark:text-emerald-400">+ Saisir une ligne de Note de Calcul</h3>
            <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-3">
              <div>
                <label class="block font-bold text-gray-500 mb-1">N° Pieu *</label>
                <input type="text" required value="${esc(nf.pileNumber)}" oninput="ui.ndcForm.pileNumber=this.value" placeholder="Ex: P14" class="w-full p-2.5 rounded-xl border border-gray-300 dark:border-gray-700 bg-[#F7F9F7] dark:bg-[#101513] font-extrabold" />
              </div>
              <div>
                <label class="block font-bold text-gray-500 mb-1">Diamètre *</label>
                <select onchange="ui.ndcForm.diameter=this.value; render();" class="w-full p-2.5 rounded-xl border border-gray-300 dark:border-gray-700 bg-[#F7F9F7] dark:bg-[#101513] font-bold">
                  ${AVAILABLE_DIAMETERS.map(d => `<option value="${d}" ${nf.diameter === d ? 'selected' : ''}>${d}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block font-bold text-gray-500 mb-1">Profondeur NGF</label>
                <input type="number" step="0.01" value="${esc(nf.ngfDepth)}" oninput="ui.ndcForm.ngfDepth=this.value; render();" placeholder="Ex: 28.50" class="w-full p-2.5 rounded-xl border border-gray-300 dark:border-gray-700 bg-[#F7F9F7] dark:bg-[#101513]" />
              </div>
              <div>
                <label class="block font-bold text-gray-500 mb-1">Long. pieu (m)</label>
                <input type="number" step="0.1" value="${esc(nf.pileLength)}" oninput="ui.ndcForm.pileLength=this.value" placeholder="Ex: 18.5" class="w-full p-2.5 rounded-xl border border-gray-300 dark:border-gray-700 bg-[#F7F9F7] dark:bg-[#101513]" />
              </div>
              <div>
                <label class="block font-bold text-gray-500 mb-1">Soupape ?</label>
                <select onchange="ui.ndcForm.soupape=this.value; render();" class="w-full p-2.5 rounded-xl border border-gray-300 dark:border-gray-700 bg-[#F7F9F7] dark:bg-[#101513] font-bold">
                  <option value="NON" ${nf.soupape === 'NON' ? 'selected' : ''}>Non</option>
                  <option value="OUI" ${nf.soupape === 'OUI' ? 'selected' : ''}>Oui</option>
                </select>
              </div>
              <div>
                <label class="block font-bold text-gray-500 mb-1">Cote / Haut. Soupape</label>
                <input type="number" step="0.01" ${nf.soupape === 'NON' ? 'disabled' : ''} value="${esc(nf.soupapeHeight)}" oninput="ui.ndcForm.soupapeHeight=this.value" placeholder="${nf.soupape === 'OUI' ? 'Ex: 1.50' : '—'}" class="w-full p-2.5 rounded-xl border border-gray-300 dark:border-gray-700 bg-[#F7F9F7] dark:bg-[#101513] disabled:opacity-40" />
              </div>
              <div>
                <label class="block font-bold text-gray-500 mb-1">NBR (Arase)</label>
                <input type="number" step="0.01" value="${esc(nf.nbr)}" oninput="ui.ndcForm.nbr=this.value; render();" placeholder="Ex: 10.00" class="w-full p-2.5 rounded-xl border border-gray-300 dark:border-gray-700 bg-[#F7F9F7] dark:bg-[#101513]" />
              </div>
              <div>
                <label class="block font-bold text-gray-500 mb-1">Delta (NGF − NBR)</label>
                <div class="w-full p-2.5 rounded-xl bg-[#E8F1EB] dark:bg-[#1A472A]/40 text-[#1A472A] dark:text-emerald-300 font-extrabold text-center">${deltaPreview} m</div>
              </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-3 items-end pt-2">
              <div class="lg:col-span-2 space-y-2">
                <label class="block font-bold text-gray-500">Type(s) d'armature constituant la colonne :</label>
                ${nf.cages.map((c, idx) => `
                  <div class="flex gap-2">
                    <select onchange="ui.ndcForm.cages[${idx}].refId=this.value" class="flex-1 p-2.5 rounded-xl border border-gray-300 dark:border-gray-700 bg-[#F7F9F7] dark:bg-[#101513] font-bold">
                      ${refs.map(r => `<option value="${r.id}" ${c.refId === r.id ? 'selected' : ''}>${esc(r.ref)} (${esc(r.diameter)})</option>`).join('')}
                    </select>
                    <input type="number" min="1" value="${c.qty}" oninput="ui.ndcForm.cages[${idx}].qty=this.value" class="w-20 p-2.5 rounded-xl border border-gray-300 dark:border-gray-700 bg-[#F7F9F7] dark:bg-[#101513] text-center font-extrabold" />
                    ${nf.cages.length > 1 ? `<button type="button" onclick="ui.ndcForm.cages.splice(${idx},1); render();" class="px-2.5 text-red-500">✕</button>` : ''}
                  </div>
                `).join('')}
                <button type="button" onclick="ui.ndcForm.cages.push({ refId: '${refs[0] ? refs[0].id : ''}', qty: 1 }); render();" class="text-[#1A472A] dark:text-emerald-400 font-bold underline cursor-pointer">+ Ajouter un tronçon de cage</button>
              </div>
              <div class="flex gap-2">
                <select onchange="ui.ndcForm.status=this.value" class="p-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-[#F7F9F7] dark:bg-[#101513] font-bold">
                  <option value="PREVU" ${nf.status === 'PREVU' ? 'selected' : ''}>Statut : Prévu</option>
                  <option value="COULE" ${nf.status === 'COULE' ? 'selected' : ''}>Statut : Déjà Coulé</option>
                </select>
                <button type="submit" class="flex-1 py-3 px-4 rounded-xl bg-[#1A472A] hover:bg-[#2A623D] text-white font-extrabold cursor-pointer">Enregistrer pieu</button>
              </div>
            </div>

          <div class="bg-white dark:bg-[#242A26] rounded-2xl border border-gray-200 dark:border-gray-800 overflow-x-auto">
            <table class="w-full text-left border-collapse text-xs">
              <thead class="bg-[#F7F9F7] dark:bg-[#101513] text-gray-500 uppercase border-b border-gray-200 dark:border-gray-800">
                <tr>
                  <th class="p-3.5">N° Pieu</th>
                  <th class="p-3.5 text-center">Diamètre</th>

                ${piles.length === 0 ? `<tr><td colspan="9" class="p-8 text-center text-gray-500">Aucun pieu saisi dans la Note de Calcul pour ce chantier.</td></tr>` : piles.map(p => `

              </div>
              <div class="flex flex-wrap gap-2">
                <button onclick="downloadBackupJSON()" class="px-4 py-2.5 rounded-xl bg-[#1A472A] text-white text-xs font-bold flex items-center gap-1.5 cursor-pointer">${icon('download', 'w-4 h-4')} Sauvegarde complète (.json)</button>
                <label class="px-4 py-2.5 rounded-xl border border-gray-300 dark:border-gray-700 text-xs font-bold flex items-center gap-1.5 cursor-pointer hover:bg-gray-50 dark:hover:bg-white/5">
                  ${icon('upload', 'w-4 h-4')} Restaurer (.json)
                  <input type="file" accept=".json" onchange="restoreBackupJSON(event)" class="hidden" />
                </label>
                <button onclick="resetToOnboarding()" class="px-4 py-2.5 rounded-xl border border-red-300 bg-red-50 text-red-700 text-xs font-bold cursor-pointer">Tout effacer / Nouveau départ</button>
              </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 text-xs">
              <div class="space-y-2.5 bg-[#F7F9F7] dark:bg-[#101513] p-4 rounded-xl border border-gray-200 dark:border-gray-800">
                <p class="font-extrabold text-sm text-[#1A472A] dark:text-emerald-400">Comment activer la base de données partagée en ligne (gratuit) :</p>
                <ol class="list-decimal list-inside space-y-1.5 text-gray-600 dark:text-gray-300">
                  <li>Rendez-vous sur <strong>console.firebase.google.com</strong> et créez un projet nommé <code>STOCAGE-SBFS</code>.</li>
                  <li>Dans le menu de gauche, ouvrez <strong>Créer → Firestore Database</strong> et cliquez sur <em>Créer une base de données</em> (mode production ou test).</li>
                  <li>Ouvrez <strong>Paramètres du projet</strong> (icône engrenage) → <em>Vos applications → Web (&lt;/&gt;)</em> et copiez les 6 clés ci-contre.</li>
                </ol>
              </div>

              <form onsubmit="saveFirebaseConfig(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                <input name="apiKey" value="${esc(cfg.apiKey)}" placeholder="apiKey" class="p-2.5 rounded-xl border border-gray-300 dark:border-gray-700 bg-[#F7F9F7] dark:bg-[#101513]" />
                <input name="projectId" value="${esc(cfg.projectId)}" placeholder="projectId" class="p-2.5 rounded-xl border border-gray-300 dark:border-gray-700 bg-[#F7F9F7] dark:bg-[#101513]" />
                <input name="authDomain" value="${esc(cfg.authDomain)}" placeholder="authDomain" class="p-2.5 rounded-xl border border-gray-300 dark:border-gray-700 bg-[#F7F9F7] dark:bg-[#101513]" />
                <input name="storageBucket" value="${esc(cfg.storageBucket)}" placeholder="storageBucket" class="p-2.5 rounded-xl border border-gray-300 dark:border-gray-700 bg-[#F7F9F7] dark:bg-[#101513]" />
                <input name="messagingSenderId" value="${esc(cfg.messagingSenderId)}" placeholder="messagingSenderId" class="p-2.5 rounded-xl border border-gray-300 dark:border-gray-700 bg-[#F7F9F7] dark:bg-[#101513]" />
                <input name="appId" value="${esc(cfg.appId)}" placeholder="appId" class="p-2.5 rounded-xl border border-gray-300 dark:border-gray-700 bg-[#F7F9F7] dark:bg-[#101513]" />
                <button type="submit" class="sm:col-span-2 py-2.5 rounded-xl bg-[#1A472A] hover:bg-[#2A623D] text-white font-bold cursor-pointer">Connecter la base Cloud Firebase</button>
              </form>
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 11. ÉCRAN D'INITIALISATION DE PRODUCTION (PREMIER LANCEMENT)
    // =========================================================================
    function renderOnboardingScreen() {
      const ob = ui.onboarding;

      window.submitOnboarding = function (e) {
        e.preventDefault();
        const fd = new FormData(e.target);
        const userName = String(fd.get('userName') || ob.userName || '').trim();
        const userPin = String(fd.get('userPin') || ob.userPin || '1234').trim() || '1234';
        const projectName = String(fd.get('projectName') || ob.projectName || '').trim();
        const projectRef = String(fd.get('projectRef') || ob.projectRef || '').trim();
        const projectLocation = String(fd.get('projectLocation') || ob.projectLocation || '').trim();
        const projectStartDate = String(fd.get('projectStartDate') || ob.projectStartDate || todayISO());
        const catalogMode = String(fd.get('catMode') || ob.catalogMode || 'ndc35');

        if (!userName || !projectName) {
          return toast('Champs obligatoires', 'Renseignez votre nom et le nom du chantier.', 'error');
        }

        const userId = 'U-ADMIN-1';
        const projectId = 'PRJ-' + Date.now().toString(36).toUpperCase();
        const userObj = {
          id: userId,
          name: userName,
          email: userName.toLowerCase().replace(/[^a-z0-9]/g, '.') + '@soletanche-bachy.com',
          role: 'ADMIN',
          pin: userPin
        };
        const projectObj = {
          id: projectId,
          ref: projectRef || `AFF-${new Date().getFullYear()}-001`,
          name: projectName,
          location: projectLocation || 'France',
          startDate: projectStartDate,
          status: 'ACTIF'
        };

        const refs = catalogMode === 'ndc35' ? buildCatalogForProject(projectId) : [];

        state = {
          initialized: true,
          darkMode: state.darkMode,
          activeProjectId: projectId,
          currentUserId: userId,
          users: [userObj],
          projects: [projectObj],
          references: refs,
          movements: [],
          ndcPiles: [],
          firebaseConfig: state.firebaseConfig
        };

        persistState();
        ui.activeTab = 'config';
        toast('Espace chantier créé', `Bienvenue ${userName} sur ${projectName} !`);
        render();
      };

      return `
        <div class="min-h-screen bg-[#F7F9F7] dark:bg-[#101513] flex items-center justify-center p-4 sm:p-8">
          <div class="max-w-2xl w-full bg-white dark:bg-[#242A26] rounded-3xl border border-gray-200 dark:border-gray-800 shadow-2xl overflow-hidden animate-view">
            <div class="bg-[#101513] text-white p-6 sm:p-8 border-b border-gray-800">
              <div class="flex items-center gap-3 mb-3">
                <div class="w-11 h-11 rounded-2xl bg-[#2A623D] flex items-center justify-center font-extrabold text-xl">S</div>
                <div>
                  <span class="text-xs font-extrabold uppercase tracking-widest text-emerald-400">Soletanche Bachy Fondations Spéciales</span>
                  <h1 class="text-2xl font-extrabold tracking-tight">Initialiser mon espace chantier STOCAGE</h1>
                </div>
              </div>
              <p class="text-sm text-gray-300">Créez votre profil responsable et configurez votre chantier en quelques secondes. Aucune donnée fictive n'est imposée.</p>
            </div>

            <form onsubmit="submitOnboarding(event)" class="p-6 sm:p-8 space-y-6 text-sm">
              <!-- BLOC 1 : UTILISATEUR -->
              <div class="space-y-3">
                <h2 class="text-xs font-extrabold uppercase tracking-wider text-[#1A472A] dark:text-emerald-400 flex items-center gap-2">
                  ${icon('users', 'w-4 h-4')} 1. Votre profil Administrateur
                </h2>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <div class="sm:col-span-2">
                    <label class="block text-xs font-bold text-gray-600 dark:text-gray-300 mb-1">Votre Nom & Prénom *</label>
                    <input type="text" name="userName" required value="${esc(ob.userName)}" oninput="ui.onboarding.userName=this.value" placeholder="Ex: Jean-Marc Moreau" class="w-full p-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-[#F7F9F7] dark:bg-[#101513] font-bold" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-gray-600 dark:text-gray-300 mb-1">Code PIN (4 chiffres)</label>
                    <input type="text" name="userPin" maxlength="6" value="${esc(ob.userPin)}" oninput="ui.onboarding.userPin=this.value" placeholder="1234" class="w-full p-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-[#F7F9F7] dark:bg-[#101513] text-center font-extrabold" />
                  </div>
                </div>
              </div>

              <!-- BLOC 2 : CHANTIER -->
              <div class="space-y-3 pt-4 border-t border-gray-200 dark:border-gray-800">
                <h2 class="text-xs font-extrabold uppercase tracking-wider text-[#1A472A] dark:text-emerald-400 flex items-center gap-2">
                  ${icon('building', 'w-4 h-4')} 2. Identification du Chantier
                </h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label class="block text-xs font-bold text-gray-600 dark:text-gray-300 mb-1">Nom du chantier *</label>
                    <input type="text" name="projectName" required value="${esc(ob.projectName)}" oninput="ui.onboarding.projectName=this.value" placeholder="Ex: Ouvrage A16 — Pont de Creil" class="w-full p-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-[#F7F9F7] dark:bg-[#101513] font-bold" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-gray-600 dark:text-gray-300 mb-1">Code Affaire / Référence</label>
                    <input type="text" name="projectRef" value="${esc(ob.projectRef)}" oninput="ui.onboarding.projectRef=this.value" placeholder="Ex: SB-2026-108" class="w-full p-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-[#F7F9F7] dark:bg-[#101513]" />
                  </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label class="block text-xs font-bold text-gray-600 dark:text-gray-300 mb-1">Localisation / Ville</label>
                    <input type="text" name="projectLocation" value="${esc(ob.projectLocation)}" oninput="ui.onboarding.projectLocation=this.value" placeholder="Ex: Creil (60)" class="w-full p-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-[#F7F9F7] dark:bg-[#101513]" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-gray-600 dark:text-gray-300 mb-1">Date de début</label>
                    <input type="date" name="projectStartDate" value="${esc(ob.projectStartDate)}" onchange="ui.onboarding.projectStartDate=this.value" class="w-full p-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-[#F7F9F7] dark:bg-[#101513]" />
                  </div>
                </div>
              </div>

              <!-- BLOC 3 : CATALOGUE INITIAL -->
              <div class="space-y-2.5 pt-4 border-t border-gray-200 dark:border-gray-800">
                <h2 class="text-xs font-extrabold uppercase tracking-wider text-[#1A472A] dark:text-emerald-400">3. Base de cages d'armatures au démarrage</h2>
                <label class="flex items-start gap-3 p-3.5 rounded-xl border ${ob.catalogMode === 'ndc35' ? 'border-[#1A472A] bg-[#E8F1EB]/60 dark:bg-[#1A472A]/20' : 'border-gray-200 dark:border-gray-800'} cursor-pointer">
                  <input type="radio" name="catMode" value="ndc35" ${ob.catalogMode === 'ndc35' ? 'checked' : ''} onchange="ui.onboarding.catalogMode='ndc35'; render();" class="mt-1" />
                  <div>
                    <p class="font-extrabold">Pré-charger les 35 références types NDC (stocks à 0)</p>
                    <p class="text-xs text-gray-500">Inclut 2, L=5,5 (AB) jusqu'à G-3, L=7 (AB) avec diamètres Ø620 à Ø1220 prêts à être paramétrés.</p>
                  </div>
                </label>
                <label class="flex items-start gap-3 p-3.5 rounded-xl border ${ob.catalogMode === 'empty' ? 'border-[#1A472A] bg-[#E8F1EB]/60 dark:bg-[#1A472A]/20' : 'border-gray-200 dark:border-gray-800'} cursor-pointer">
                  <input type="radio" name="catMode" value="empty" ${ob.catalogMode === 'empty' ? 'checked' : ''} onchange="ui.onboarding.catalogMode='empty'; render();" class="mt-1" />
                  <div>
                    <p class="font-extrabold">Démarrer avec un catalogue 100 % vide</p>
                    <p class="text-xs text-gray-500">Vous créerez uniquement vos propres références de cages une par une.</p>
                  </div>
                </label>
              </div>

              <div class="pt-2 flex flex-col sm:flex-row items-center justify-between gap-3">
                <label class="text-xs font-bold text-gray-500 hover:text-[#1A472A] cursor-pointer underline">
                  Ou restaurer une sauvegarde (.json) existante
                  <input type="file" accept=".json" onchange="restoreBackupJSON(event)" class="hidden" />
                </label>
                <button type="submit" class="w-full sm:w-auto px-8 py-3.5 rounded-2xl bg-[#1A472A] hover:bg-[#2A623D] text-white font-extrabold text-sm shadow-xl cursor-pointer">
                  Créer et paramétrer mon chantier →
                </button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 12. ARCHITECTURE GLOBALE & NAVIGATION
    // =========================================================================
    function renderMainShell() {
      const project = getActiveProject();
      const user = getCurrentUser();
      const stats = getProjectRefs(false).map(computeRefStats);
      const alertCount = stats.filter(s => s.status === 'LOW' || s.status === 'OUT').length;

      const navItems = [
        { id: 'dashboard', label: 'Tableau de bord', icon: 'dashboard' },
        { id: 'stock', label: 'Stock & Prévisions NDC', icon: 'package', badge: alertCount > 0 ? alertCount : null },
        { id: 'receipt', label: 'Nouvelle réception', icon: 'arrowDown' },
        { id: 'usage', label: 'Sorties de stock', icon: 'arrowUp' },
        { id: 'ndc', label: 'Note de Calcul (Pieux)', icon: 'calc' },
        { id: 'history', label: 'Historique mouvements', icon: 'history' },
        { id: 'inventory', label: 'Inventaire physique', icon: 'clipboard' },
        { id: 'config', label: 'Configuration chantier', icon: 'sliders' },
        { id: 'database', label: 'Utilisateurs & Base BDD', icon: 'database' }
      ];

      let viewHtml = '';
      if (ui.activeTab === 'dashboard') viewHtml = renderDashboardView();
      else if (ui.activeTab === 'stock') viewHtml = renderStockView();
      else if (ui.activeTab === 'receipt') viewHtml = renderReceiptView();
      else if (ui.activeTab === 'usage') viewHtml = renderUsageView();
      else if (ui.activeTab === 'ndc') viewHtml = renderNdcView();
      else if (ui.activeTab === 'history') viewHtml = renderHistoryView();
      else if (ui.activeTab === 'inventory') viewHtml = renderInventoryView();
      else if (ui.activeTab === 'config') viewHtml = renderConfigView();
      else if (ui.activeTab === 'database') viewHtml = renderUsersAndDatabaseView();

      return `
        <div class="min-h-screen flex bg-[#F7F9F7] dark:bg-[#101513] text-[#101513] dark:text-white">
          ${ui.mobileMenuOpen ? `<div onclick="ui.mobileMenuOpen=false; render();" class="fixed inset-0 bg-black/50 z-30 lg:hidden"></div>` : ''}

          <!-- SIDEBAR -->
          <aside class="fixed lg:static inset-y-0 left-0 z-40 w-72 bg-[#101513] text-white flex flex-col border-r border-gray-800 transform transition-transform duration-200 ${ui.mobileMenuOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'}">
            <div class="p-5 border-b border-gray-800 flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-[#2A623D] flex items-center justify-center font-extrabold text-xl shadow-md">S</div>
                <div>
                  <h1 class="text-lg font-extrabold tracking-wider">STOCAGE</h1>
                  <p class="text-[10px] font-bold uppercase tracking-widest text-emerald-400">Soletanche Bachy</p>
                </div>
              </div>
              <button onclick="ui.mobileMenuOpen=false; render();" class="lg:hidden p-1.5 text-gray-400 hover:text-white">${icon('x', 'w-5 h-5')}</button>
            </div>

            <!-- SÉLECTEUR DE CHANTIER -->
            <div class="p-4 border-b border-gray-800">
              <label class="block text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-1.5">Chantier actif</label>
              <select onchange="switchProject(this.value)" class="w-full p-2.5 rounded-xl bg-[#242A26] border border-gray-700 text-xs font-bold text-white">
                ${state.projects.map(pr => `<option value="${pr.id}" ${pr.id === state.activeProjectId ? 'selected' : ''}>${esc(pr.name)}</option>`).join('')}
              </select>
            </div>

            <!-- NAVIGATION -->
            <nav class="flex-1 p-3 space-y-1 overflow-y-auto custom-scrollbar">
              ${navItems.map(item => `
                <button onclick="goTab('${item.id}')" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-bold transition cursor-pointer ${ui.activeTab === item.id ? 'bg-[#2A623D] text-white shadow-md' : 'text-gray-300 hover:bg-white/5'}">
                  <span class="flex items-center gap-3">${icon(item.icon, 'w-4 h-4')} ${item.label}</span>
                  ${item.badge ? `<span class="px-2 py-0.5 rounded-full text-[10px] bg-red-600 text-white font-extrabold">${item.badge}</span>` : ''}
                </button>
              `).join('')}
            </nav>

            <!-- UTILISATEUR & MODE SOMBRE -->
            <div class="p-4 border-t border-gray-800 space-y-3">
              <div class="flex items-center justify-between">
                <div class="min-w-0">
                  <p class="text-xs font-extrabold truncate">${esc(user.name)}</p>
                  <p class="text-[11px] text-emerald-400 font-semibold">${esc(user.role)}</p>
                </div>
                <button onclick="toggleDarkMode()" class="p-2 rounded-xl bg-white/5 hover:bg-white/10 text-gray-300 cursor-pointer" title="Basculer thème clair / sombre">
                  ${state.darkMode ? icon('sun', 'w-4 h-4') : icon('moon', 'w-4 h-4')}
                </button>
              </div>
            </div>
          </aside>

          <!-- ZONE PRINCIPALE -->
          <div class="flex-1 flex flex-col min-w-0">
            <header class="h-16 bg-white dark:bg-[#242A26] border-b border-gray-200 dark:border-gray-800 px-4 sm:px-8 flex items-center justify-between gap-4 shrink-0">
              <div class="flex items-center gap-3 min-w-0">
                <button onclick="ui.mobileMenuOpen=true; render();" class="lg:hidden p-2 rounded-xl border border-gray-200 dark:border-gray-700">${icon('menu', 'w-5 h-5')}</button>
                <div class="min-w-0">
                  <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                    <span class="text-sm font-extrabold truncate">${esc(project.name)}</span>
                    <span class="hidden md:inline text-xs text-gray-400">(${esc(project.ref)})</span>
                  </div>
                </div>
              </div>

              <div class="flex items-center gap-2 sm:gap-3">
                <button onclick="resetToOnboarding()" class="px-3 py-1.5 rounded-xl text-xs font-bold border border-amber-300 bg-amber-50 text-amber-900 hover:bg-amber-100 cursor-pointer" title="Effacer et créer un nouvel espace chantier vierge">
                  + Nouveau chantier vierge
                </button>
                <button onclick="goTab('database')" class="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold border ${cloudStatus.connected ? 'border-emerald-300 bg-emerald-50 text-emerald-800' : 'border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300'}">
                  ${icon('database', 'w-3.5 h-3.5')}
                  <span>${cloudStatus.connected ? 'Cloud Actif' : 'BDD Locale'}</span>
                </button>
                <button onclick="downloadBackupJSON()" class="p-2 rounded-xl border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-white/5" title="Télécharger une sauvegarde de secours (.json)">
                  ${icon('shield', 'w-4 h-4 text-[#2A623D]')}
                </button>
              </div>
            </header>

            <main class="flex-1 p-4 sm:p-8 overflow-y-auto custom-scrollbar max-w-7xl w-full mx-auto">
              ${viewHtml}
            </main>
          </div>
        </div>
      `;
    }

    function render() {
      if (state.darkMode) document.documentElement.classList.add('dark');
      else document.documentElement.classList.remove('dark');

      const root = document.getElementById('app');
      if (!root) return;

      if (!state.initialized || !state.projects || state.projects.length === 0) {
        root.innerHTML = renderOnboardingScreen();
      } else {
        root.innerHTML = renderMainShell();
      }
    }

    window.render = render;

    // Initialisation au démarrage
    render();
    restoreFromIndexedDBIfNeeded();
    initFirebaseSync();
  </script>
</body>
</html>
