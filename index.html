    };

    // =========================================================================
    // 2. RÉFÉRENTIEL DES 35 CAGES NDC (SOLETANCHE BACHY FONDATIONS SPÉCIALES)
    // =========================================================================
    const NDC_35_CAGES = [
      { code: '2, L=5,5 (AB)', length: 5.5, diameter: 820, type: 'Cage Principale AB' },
      { code: '2c, L=5 (AB)', length: 5.0, diameter: 820, type: 'Cage Courante AB' },
      { code: '2c, L=7 (AB)', length: 7.0, diameter: 820, type: 'Cage Courante AB' },
      { code: '2rc, L=7,5 (AB)', length: 7.5, diameter: 820, type: 'Cage Renforcée AB' },
      { code: '3, L=6 (AB)', length: 6.0, diameter: 920, type: 'Cage Principale AB' },
      { code: '3b, L=6,5 (AB)', length: 6.5, diameter: 920, type: 'Cage Intermédiaire AB' },
      { code: '3b, L=7,5 (AB)', length: 7.5, diameter: 920, type: 'Cage Intermédiaire AB' },
      { code: '3a, L=9 (AB)', length: 9.0, diameter: 920, type: 'Cage Haute AB' },
      { code: '3c, L=6 (AB)', length: 6.0, diameter: 920, type: 'Cage Courante AB' },
      { code: '3c, L=12 (AB)', length: 12.0, diameter: 920, type: 'Cage Courante AB' },
      { code: '3rb, L=6,5 (AB)', length: 6.5, diameter: 920, type: 'Cage Renforcée AB' },
      { code: '3rb, L=8 (AB)', length: 8.0, diameter: 920, type: 'Cage Renforcée AB' },
      { code: '3rb, L=12 (AB)', length: 12.0, diameter: 920, type: 'Cage Renforcée AB' },
      { code: '3rc, L=6,5 (AB)', length: 6.5, diameter: 920, type: 'Cage Renforcée AB' },
      { code: '3rc, L=12,5 (AB)', length: 12.5, diameter: 920, type: 'Cage Renforcée AB' },
      { code: '4, L=6 (AB)', length: 6.0, diameter: 1020, type: 'Cage Principale AB' },
      { code: '4, L=7 (AB)', length: 7.0, diameter: 1020, type: 'Cage Principale AB' },
      { code: '4, L=8,5 (AB)', length: 8.5, diameter: 1020, type: 'Cage Principale AB' },
      { code: '4, L=10,5 (AB)', length: 10.5, diameter: 1020, type: 'Cage Principale AB' },
      { code: '4, L=12,5 (AB)', length: 12.5, diameter: 1020, type: 'Cage Principale AB' },
      { code: '4b, L=8,5 (AB)', length: 8.5, diameter: 1020, type: 'Cage Intermédiaire AB' },
      { code: '4a, L=10,5 (AB)', length: 10.5, diameter: 1020, type: 'Cage Haute AB' },
      { code: '4b, L=11 (AB)', length: 11.0, diameter: 1020, type: 'Cage Intermédiaire AB' },
      { code: '4c, L=7,5 (AB)', length: 7.5, diameter: 1020, type: 'Cage Courante AB' },
      { code: '4c, L=11 (AB)', length: 11.0, diameter: 1020, type: 'Cage Courante AB' },
      { code: '4rb, L=8 (AB)', length: 8.0, diameter: 1020, type: 'Cage Renforcée AB' },
      { code: '4rb, L=11 (AB)', length: 11.0, diameter: 1020, type: 'Cage Renforcée AB' },
      { code: '4rc, L=5,5 (AB)', length: 5.5, diameter: 1020, type: 'Cage Renforcée AB' },
      { code: '4rc, L=11 (AB)', length: 11.0, diameter: 1020, type: 'Cage Renforcée AB' },
      { code: '5b, L=6 (AB)', length: 6.0, diameter: 1220, type: 'Cage Gros Diamètre AB' },
      { code: '6a, L=8,5 (AB)', length: 8.5, diameter: 1520, type: 'Cage Gros Diamètre AB' },
      { code: '6a, L=6 (AB)', length: 6.0, diameter: 1520, type: 'Cage Gros Diamètre AB' },
      { code: 'G-3, L=6 (AB)', length: 6.0, diameter: 920, type: 'Cage Spéciale G AB' },
      { code: 'G-3a, L=8.5 (AB)', length: 8.5, diameter: 920, type: 'Cage Spéciale G AB' },
      { code: 'G-3, L=7 (AB)', length: 7.0, diameter: 920, type: 'Cage Spéciale G AB' }
    ];

    const DIAMETERS_LIST = [620, 820, 920, 1020, 1220, 1520];
    const LOCAL_KEY = 'stocage_sbfs_v3_state';

    // =========================================================================
    // 3. ÉTAT GLOBAL & PERSISTANCE DOUBLE (LOCALSTORAGE + INDEXEDDB + CLOUD)
    // =========================================================================
    let db = null;
    let cloudStatus = { connected: false, error: null };

    let state = {
      initialized: false,
      activeProjectId: null,
      activeUserId: null,
      darkMode: false,
      firebaseConfig: null,
      users: [],
      projects: [],
      cages: [],
      movements: [],
      ndcPiles: [],
      qcSheets: [],
      inventories: []
    };

    let ui = {
      view: 'dashboard',
      diameterFilter: 'ALL',
      searchQuery: '',
      stockFilter: 'ALL',
      selectedQcId: null,
      receiptDraft: {
        date: new Date().toISOString().slice(0, 10),
        supplier: 'Armatures de France',
        blNumber: '',
        zone: 'Parc Nord',
        notes: '',
        lines: [{ cageId: '', qty: 1 }]
      },
      usageDraft: {
        date: new Date().toISOString().slice(0, 10),
        pileNumber: '',
        phase: 'Forage / Bétonnage',
        notes: '',
        lines: [{ cageId: '', qty: 1 }]
      },
      ndcDraft: {
        pileNo: '',
        diameter: 920,
        ngf: '',
        length: '',
        cageId1: '',
        cageId2: '',
        soupape: 'NON',
        soupapeDepth: '',
        nbr: ''
      }
    };

    function uid(prefix = 'id') {
      return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
    }

    function todayISO() {
      return new Date().toISOString().slice(0, 10);
    }

    function formatDateTimeFR(iso) {
      if (!iso) return '-';
      try {
        return new Date(iso).toLocaleString('fr-FR', {
          timeZone: 'Europe/Paris',
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
      } catch (e) {
        return iso;
      }
    }

    function formatDateFR(iso) {
      if (!iso) return '-';
      const parts = iso.slice(0, 10).split('-');
      return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : iso;
    }

    function showToast(message, type = 'success') {
      const root = document.getElementById('toast-root');
      if (!root) return;
      const el = document.createElement('div');
      const bg = type === 'error' ? 'bg-red-600' : type === 'warn' ? 'bg-amber-600' : 'bg-[#1A472A]';
      el.className = `${bg} text-white px-4 py-3 rounded-xl shadow-xl text-sm font-semibold flex items-center gap-2 pointer-events-auto border border-white/10`;
      el.innerHTML = `<span>${type === 'error' ? '⚠️' : '✅'}</span><span>${escapeHtml(message)}</span>`;
      root.appendChild(el);
      setTimeout(() => { el.remove(); }, 3800);
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function saveIndexedDB(jsonStr) {
      try {
        const req = indexedDB.open('StocageSBFS_DB', 1);
        req.onupgradeneeded = (e) => {
          const idb = e.target.result;
          if (!idb.objectStoreNames.contains('backup')) idb.createObjectStore('backup');
        };
        req.onsuccess = (e) => {
          const idb = e.target.result;
          const tx = idb.transaction('backup', 'readwrite');
          tx.objectStore('backup').put(jsonStr, 'latest');
        };
      } catch (e) {}
    }

    function persistState() {
      try {
        const payload = JSON.stringify(state);
        localStorage.setItem(LOCAL_KEY, payload);
        saveIndexedDB(payload);
        if (db && window.__stocageSetDoc) {
          window.__stocageSetDoc(payload).catch(() => {});
        }
      } catch (e) {}
    }

    function loadInitialState() {
      try {
        const raw = localStorage.getItem(LOCAL_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.initialized) {
            state = { ...state, ...parsed };
          }
        }
      } catch (e) {}
      if (state.darkMode) document.documentElement.classList.add('dark');
      else document.documentElement.classList.remove('dark');
    }

    async function initFirebaseSync() {
      if (!state.firebaseConfig || !state.firebaseConfig.apiKey || !state.firebaseConfig.projectId) {
        return;
      }
      try {
        const [{ initializeApp }, { getFirestore, doc, setDoc, onSnapshot }] = await Promise.all([
          import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
          import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js')
        ]);
        const app = initializeApp(state.firebaseConfig);
        db = getFirestore(app);
        const workspaceId = state.firebaseConfig.workspaceId || 'sbfs_default';
        const ref = doc(db, 'stocage_workspaces', workspaceId);
        window.__stocageSetDoc = (payload) => setDoc(ref, { payload, updatedAt: new Date().toISOString() }, { merge: true });
        onSnapshot(ref, (snap) => {
          cloudStatus = { connected: true, error: null };
          if (snap.exists() && snap.data().payload) {
            try {
              const remote = JSON.parse(snap.data().payload);
              if (remote && remote.initialized) {
                state = { ...state, ...remote, firebaseConfig: state.firebaseConfig };
                localStorage.setItem(LOCAL_KEY, JSON.stringify(state));
                render();
              }
            } catch (e) {}
          }
        }, (err) => {
          cloudStatus = { connected: false, error: err.message };
        });
      } catch (e) {
        cloudStatus = { connected: false, error: e.message };
      }
    }

    // =========================================================================
    // 4. ACCESSEURS MÉTIER & CALCULS DYNAMIQUES
    // =========================================================================
    function getActiveProject() {
      return state.projects.find(p => p.id === state.activeProjectId) || state.projects[0] || null;
    }

    function getActiveUser() {
      return state.users.find(u => u.id === state.activeUserId) || state.users[0] || null;
    }

    function getProjectCages() {
      const p = getActiveProject();
      if (!p) return [];
      return state.cages.filter(c => c.projectId === p.id);
    }

    function getFilteredCages() {
      let list = getProjectCages();
      if (ui.diameterFilter !== 'ALL') {
        list = list.filter(c => Number(c.diameter) === Number(ui.diameterFilter));
      }
      if (ui.searchQuery.trim()) {
        const q = ui.searchQuery.toLowerCase();
        list = list.filter(c =>
          c.code.toLowerCase().includes(q) ||
          (c.type || '').toLowerCase().includes(q) ||
          (c.zone || '').toLowerCase().includes(q)
        );
      }
      if (ui.stockFilter === 'AVAILABLE') list = list.filter(c => c.currentStock > 0);
      if (ui.stockFilter === 'LOW') list = list.filter(c => c.currentStock > 0 && c.currentStock <= c.minStock);
      if (ui.stockFilter === 'EMPTY') list = list.filter(c => c.currentStock === 0);
      return list;
    }

    function getProjectMovements() {
      const p = getActiveProject();
      if (!p) return [];
      return state.movements
        .filter(m => m.projectId === p.id)
        .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    }

    function getProjectPiles() {
      const p = getActiveProject();
      if (!p) return [];
      return state.ndcPiles.filter(pile => pile.projectId === p.id);
    }

    function getProjectQcSheets() {
      const p = getActiveProject();
      if (!p) return [];
      return state.qcSheets
        .filter(q => q.projectId === p.id)
        .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    }

    function computeSamplingCount(qty) {
      const n = Number(qty) || 0;
      if (n <= 0) return 0;
      if (n <= 2) return n;
      if (n <= 8) return 2;
      if (n <= 15) return 3;
      return Math.max(3, Math.ceil(n * 0.2));
    }

    function createInitialCagesForProject(projectId, mode) {
      if (mode !== 'ndc35') return [];
      return NDC_35_CAGES.map((item, idx) => ({
        id: uid('cage'),
        projectId,
        code: item.code,
        type: item.type,
        diameter: item.diameter,
        length: item.length,
        currentStock: 0,
        totalReceived: 0,
        totalUsed: 0,
        plannedQty: 0,
        forecastNextQty: 0,
        forecastNextDate: '',
        minStock: 2,
        zone: 'Parc Principal',
        orderIndex: idx
      }));
    }

    // =========================================================================
    // 5. ACTIONS UTILISATEUR (INITIALISATION, RÉCEPTION, CONTRÔLE PDF, NDC, SOIR)
    // =========================================================================
    window.completeOnboarding = function (e) {
      e.preventDefault();
      const userName = (document.getElementById('ob-user-name')?.value || '').trim();
      const userRole = document.getElementById('ob-user-role')?.value || 'ADMIN';
      const userPin = (document.getElementById('ob-user-pin')?.value || '1234').trim() || '1234';
      const projectName = (document.getElementById('ob-project-name')?.value || '').trim();
      const projectRef = (document.getElementById('ob-project-ref')?.value || 'SBFS-515579').trim();
      const projectLocation = (document.getElementById('ob-project-loc')?.value || '').trim();
      const projectDate = document.getElementById('ob-project-date')?.value || todayISO();
      const catalogRadio = document.querySelector('input[name="ob-catalog"]:checked');
      const catalogMode = catalogRadio ? catalogRadio.value : 'ndc35';

      if (!userName || !projectName) {
        showToast('Veuillez renseigner votre nom et le nom du chantier.', 'error');
        return;

    window.addNdcPile = function (e) {
      e.preventDefault();
      const project = getActiveProject();
      if (!project) return;

      const pileNo = (document.getElementById('ndc-pile-no')?.value || '').trim();
      const diameter = parseInt(document.getElementById('ndc-diam')?.value, 10) || 920;
      const ngf = parseFloat(document.getElementById('ndc-ngf')?.value);
      const length = parseFloat(document.getElementById('ndc-len')?.value);
      const nbr = parseFloat(document.getElementById('ndc-nbr')?.value);
      const soupape = document.getElementById('ndc-soupape')?.value || 'NON';
      const soupapeDepth = (document.getElementById('ndc-soupape-depth')?.value || '').trim();
      const cageId1 = document.getElementById('ndc-cage-1')?.value || '';
      const cageId2 = document.getElementById('ndc-cage-2')?.value || '';

      if (!pileNo) {
        showToast('Saisissez un numéro de pieu.', 'error');
        return;
      }

      const delta = (!isNaN(ngf) && !isNaN(nbr)) ? Number((ngf - nbr).toFixed(2)) : null;
      const cageIds = [cageId1, cageId2].filter(Boolean);

      state.ndcPiles.push({
        id: uid('pile'),
        projectId: project.id,
        pileNo,
        diameter,
        ngf: isNaN(ngf) ? null : ngf,
        length: isNaN(length) ? null : length,
        nbr: isNaN(nbr) ? null : nbr,
        delta,
        soupape,
        soupapeDepth: soupape === 'OUI' ? soupapeDepth : '',
        cageIds,
        status: 'A_REALISER',
        doneDate: null
      });

      // Met à jour automatiquement les besoins prévus NDC par cage
      recomputePlannedFromNdc();
      persistState();
      showToast(`Pieu ${pileNo} ajouté à la Note de Calcul.`);
      render();
    };

    function recomputePlannedFromNdc() {
      const cages = getProjectCages();
      const piles = getProjectPiles();
      const counts = {};
      piles.forEach(p => {
        (p.cageIds || []).forEach(cid => {
          counts[cid] = (counts[cid] || 0) + 1;
        });
      });
      cages.forEach(c => {
        if (counts[c.id] !== undefined) {
          c.plannedQty = Math.max(c.plannedQty || 0, counts[c.id]);
        }
      });
    }

    window.markPileCompleted = function (pileId) {
      const pile = state.ndcPiles.find(p => p.id === pileId);
      const project = getActiveProject();
      const user = getActiveUser();
      if (!pile || !project || !user || pile.status === 'COULE') return;

      const cageCounts = {};
      (pile.cageIds || []).forEach(cid => {
        cageCounts[cid] = (cageCounts[cid] || 0) + 1;
      });

      // Vérification stock disponible
      for (const [cid, qty] of Object.entries(cageCounts)) {
        const cage = state.cages.find(c => c.id === cid);
        if (!cage || cage.currentStock < qty) {
          showToast(`Stock insuffisant pour ${cage ? cage.code : 'la cage'} (requis: ${qty}).`, 'error');
          return;
        }
      }

      // Déduction stock
      for (const [cid, qty] of Object.entries(cageCounts)) {
        const cage = state.cages.find(c => c.id === cid);
        const before = cage.currentStock;
        cage.currentStock -= qty;
        cage.totalUsed += qty;
        state.movements.push({
          id: uid('mov'),
          projectId: project.id,
          cageId: cage.id,
          cageCode: cage.code,
          type: 'USAGE',
          qty,
          beforeStock: before,
          afterStock: cage.currentStock,
          userName: user.name,
          pileNumber: pile.pileNo,
          notes: `Clôture pieu ${pile.pileNo} (Ø${pile.diameter})`,
          createdAt: new Date().toISOString()
        });
      }

      pile.status = 'COULE';
      pile.doneDate = todayISO();
      persistState();
      showToast(`Pieu ${pile.pileNo} validé coulé — stock mis à jour !`);
      render();
    };

      if (user.role !== 'ADMIN') {

      const cages = getProjectCages();
      let adjustments = 0;

      cages.forEach(c => {
        const input = document.getElementById(`inv-real-${c.id}`);
        const reasonInput = document.getElementById(`inv-reason-${c.id}`);
        if (!input || input.value === '') return;
        const physical = Math.max(0, parseInt(input.value, 10));
        const diff = physical - c.currentStock;
        if (diff !== 0) {
          const before = c.currentStock;
          c.currentStock = physical;
          state.movements.push({
            id: uid('mov'),
            projectId: project.id,
            cageId: c.id,
            cageCode: c.code,
            type: diff > 0 ? 'ADJUSTMENT_POS' : 'ADJUSTMENT_NEG',
            qty: Math.abs(diff),
            beforeStock: before,
            afterStock: physical,
            userName: user.name,
            notes: `Inventaire physique (${diff > 0 ? '+' : ''}${diff}) : ${reasonInput?.value || 'Régularisation'}`,
            createdAt: new Date().toISOString()
          });
          adjustments++;
        }
      });

      persistState();
      showToast(adjustments > 0 ? `${adjustments} écart(s) régularisé(s) avec traçabilité.` : 'Aucun écart constaté.');

    window.exportStockCsv = function () {
      const cages = getFilteredCages();
      const headers = ['Reference', 'Type', 'Diametre_mm', 'Longueur_m', 'Stock_Actuel', 'Recu_Total', 'Utilise_Total', 'Prevu_NDC', 'Reste_A_Livrer', 'Livraison_Prev_Qte', 'Livraison_Prev_Date', 'Zone'];
      const rows = cages.map(c => [
        `"${c.code}"`,
        `"${c.type || ''}"`,
        c.diameter,
        c.length,
        c.currentStock,
        c.totalReceived,
        c.totalUsed,
        c.plannedQty || 0,
        Math.max(0, (c.plannedQty || 0) - c.totalReceived),
        c.forecastNextQty || 0,
        `"${c.forecastNextDate || ''}"`,
        `"${c.zone || ''}"`
      ].join(';'));
      const csv = '\uFEFF' + [headers.join(';'), ...rows].join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;

                    <th class="p-3">Cage Type</th>
                    <th class="p-3 text-center">Stock Théorique</th>
                    <th class="p-3 text-center">Stock Physique Compté</th>
                    <th class="p-3">Justification de l'écart</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-gray-100 dark:divide-white/10">
                  ${cages.map(c => `
                    <tr>
                      <td class="p-3 font-bold">${escapeHtml(c.code)} <span class="text-gray-400">(Ø${c.diameter})</span></td>
                      <td class="p-3 text-center font-extrabold">${c.currentStock}</td>
                      <td class="p-3 text-center">
                        <input id="inv-real-${c.id}" type="number" min="0" placeholder="${c.currentStock}" class="w-24 px-2.5 py-1.5 rounded-lg border border-gray-300 dark:border-white/15 bg-white dark:bg-[#101513] text-center font-bold" />
                      </td>
                      <td class="p-3">
                        <input id="inv-reason-${c.id}" type="text" placeholder="Ex: Recomptage parc Sud" class="w-full px-3 py-1.5 rounded-lg border border-gray-300 dark:border-white/15 bg-white dark:bg-[#101513]" />
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </form>
        </div>
      `;
    }

    function renderUsersAndDatabaseView() {
      const activeUser = getActiveUser();
      return `
        <div class="space-y-6 animate-view">
          <div>
            <h2 class="text-2xl font-extrabold">Utilisateurs, Chantiers & Base de Données Sécurisée</h2>
            <p class="text-xs text-gray-500">Gérez les accès collaborateurs, créez d'autres chantiers isolés, sauvegardez vos données contre toute perte ou connectez votre base Cloud.</p>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Espaces Utilisateurs -->
            <div class="bg-white dark:bg-[#242A26] p-5 rounded-2xl border border-gray-200/80 dark:border-white/10 shadow-sm space-y-4">
              <h3 class="text-sm font-extrabold text-[#1A472A] dark:text-emerald-400">Espaces Utilisateurs (${state.users.length})</h3>
              <div class="space-y-2">
                ${state.users.map(u => `
                  <div class="p-3 rounded-xl bg-[#F7F9F7] dark:bg-white/5 flex items-center justify-between text-xs">
                    <div>
                      <div class="font-bold">${escapeHtml(u.name)} ${u.id === activeUser?.id ? '<span class="text-emerald-600">(Connecté)</span>' : ''}</div>
                      <div class="text-gray-500">${escapeHtml(u.title)} • PIN: ****</div>
                    </div>
                    ${u.id !== activeUser?.id ? `<button onclick="switchUser('${u.id}')" class="px-3 py-1.5 rounded-lg bg-[#1A472A] text-white font-bold">Basculer</button>` : ''}
                  </div>
                `).join('')}
              </div>

              <form onsubmit="createNewUser(event)" class="pt-3 border-t border-gray-100 dark:border-white/10 grid grid-cols-1 sm:grid-cols-4 gap-2 text-xs">
                <input id="usr-new-name" type="text" required placeholder="Nom collaborateur" class="sm:col-span-2 px-3 py-2 rounded-xl border border-gray-300 dark:border-white/15 bg-white dark:bg-[#101513]" />
                <select id="usr-new-role" class="px-2.5 py-2 rounded-xl border border-gray-300 dark:border-white/15 bg-white dark:bg-[#101513]">
                  <option value="OPERATIONAL">Chef chantier</option>
                  <option value="ADMIN">Administrateur</option>
                  <option value="VIEWER">Consultation</option>
                </select>
                <button type="submit" class="px-3 py-2 rounded-xl bg-[#1A472A] text-white font-bold">+ Créer</button>
              </form>
            </div>

            <!-- Multi-Chantiers -->
            <div class="bg-white dark:bg-[#242A26] p-5 rounded-2xl border border-gray-200/80 dark:border-white/10 shadow-sm space-y-4">
              <h3 class="text-sm font-extrabold text-[#1A472A] dark:text-emerald-400">Chantiers Soletanche Bachy (${state.projects.length})</h3>
              <div class="space-y-2">
                ${state.projects.map(p => `
                  <div class="p-3 rounded-xl bg-[#F7F9F7] dark:bg-white/5 flex items-center justify-between text-xs">
                    <div>
                      <div class="font-bold">${escapeHtml(p.name)}</div>
                      <div class="text-gray-500">${escapeHtml(p.reference)} • ${escapeHtml(p.location || 'Chantier actif')}</div>
                    </div>
                    <button onclick="switchProject('${p.id}')" class="px-3 py-1.5 rounded-lg ${p.id === state.activeProjectId ? 'bg-emerald-100 text-emerald-800' : 'bg-[#101513] text-white'} font-bold">
                      ${p.id === state.activeProjectId ? 'Actif' : 'Ouvrir'}
                    </button>
                  </div>
                `).join('')}
              </div>

              <form onsubmit="createNewProject(event)" class="pt-3 border-t border-gray-100 dark:border-white/10 space-y-2 text-xs">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                  <input id="prj-new-name" type="text" required placeholder="Nom du nouveau chantier *" class="px-3 py-2 rounded-xl border border-gray-300 dark:border-white/15 bg-white dark:bg-[#101513]" />
                  <input id="prj-new-ref" type="text" placeholder="Réf. Affaire" class="px-3 py-2 rounded-xl border border-gray-300 dark:border-white/15 bg-white dark:bg-[#101513]" />
                </div>
                <div class="flex items-center justify-between gap-2">
                  <label class="flex items-center gap-2">
                    <input id="prj-new-ndc35" type="checkbox" checked class="accent-[#1A472A]" />
                    <span>Inclure les 35 cages types NDC</span>
                  </label>
                  <button type="submit" class="px-4 py-2 rounded-xl bg-[#1A472A] text-white font-bold">+ Créer chantier</button>
                </div>
              </form>
            </div>
          </div>

          <!-- Protection Anti-Perte & Base de Données Cloud -->
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-white dark:bg-[#242A26] p-5 rounded-2xl border border-gray-200/80 dark:border-white/10 shadow-sm space-y-4">
              <h3 class="text-sm font-extrabold text-[#1A472A] dark:text-emerald-400">Sécurité Anti-Perte & Sauvegarde Locale</h3>
              <p class="text-xs text-gray-600 dark:text-gray-300">Vos données sont enregistrées automatiquement en double dans votre navigateur (<code>localStorage</code> + <code>IndexedDB</code>). Téléchargez régulièrement une copie de secours <code>.json</code> sur votre PC ou clé USB pour une protection totale contre tout virus ou nettoyage navigateur.</p>
              <div class="flex flex-wrap gap-3">
                <button onclick="exportBackupJson()" class="px-4 py-2.5 rounded-xl bg-[#1A472A] text-white text-xs font-bold shadow-sm">
                  Télécharger sauvegarde (.json)
                </button>
                <label class="px-4 py-2.5 rounded-xl border border-gray-300 dark:border-white/15 text-xs font-bold cursor-pointer hover:bg-gray-50 dark:hover:bg-white/5">
                  Restaurer un fichier (.json)
                  <input type="file" accept=".json" onchange="importBackupJson(event)" class="hidden" />
                </label>
                <button onclick="resetAllToOnboarding()" class="px-4 py-2.5 rounded-xl bg-red-50 text-red-700 text-xs font-bold hover:bg-red-100">
                  Réinitialiser à zéro
                </button>
              </div>
            </div>

            <div class="bg-white dark:bg-[#242A26] p-5 rounded-2xl border border-gray-200/80 dark:border-white/10 shadow-sm space-y-3">
              <div class="flex items-center justify-between">
                <h3 class="text-sm font-extrabold text-[#1A472A] dark:text-emerald-400">Synchronisation Cloud Multi-Utilisateurs (Firebase)</h3>
                <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold ${cloudStatus.connected ? 'bg-emerald-100 text-emerald-800' : 'bg-gray-100 text-gray-600'}">
                  ${cloudStatus.connected ? 'Connecté Cloud' : 'Mode Local Actif'}
                </span>
              </div>
              <p class="text-xs text-gray-500">Pour partager le stock en temps réel entre plusieurs téléphones/PC : créez un projet gratuit sur <strong>console.firebase.google.com</strong> (Firestore Database) et collez vos identifiants ci-dessous.</p>
              <form onsubmit="saveFirebaseConfigForm(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                <input id="fb-apikey" type="text" value="${escapeHtml(state.firebaseConfig?.apiKey || '')}" placeholder="apiKey Firebase" class="px-3 py-2 rounded-xl border border-gray-300 dark:border-white/15 bg-white dark:bg-[#101513]" />
                <input id="fb-projectid" type="text" value="${escapeHtml(state.firebaseConfig?.projectId || '')}" placeholder="projectId Firebase" class="px-3 py-2 rounded-xl border border-gray-300 dark:border-white/15 bg-white dark:bg-[#101513]" />
                <input id="fb-authdomain" type="text" value="${escapeHtml(state.firebaseConfig?.authDomain || '')}" placeholder="authDomain (optionnel)" class="px-3 py-2 rounded-xl border border-gray-300 dark:border-white/15 bg-white dark:bg-[#101513]" />
                <button type="submit" class="px-4 py-2 rounded-xl bg-[#101513] text-white font-bold">Connecter la base Cloud</button>
              </form>
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 8. SHELL PRINCIPAL & RENDU GLOBAL
    // =========================================================================
    function renderMainShell() {
      const project = getActiveProject();
      const user = getActiveUser();

      const navItems = [
        { id: 'dashboard', label: 'Tableau de bord', icon: ICONS.dashboard },
        { id: 'receipt', label: '1. Réception (Matin)', icon: ICONS.receipt },
        { id: 'qc', label: '2. Fiche Contrôle PDF', icon: ICONS.qc },
        { id: 'stock', label: '3. Stock Réel & NDC', icon: ICONS.stock },
        { id: 'usage', label: '4. Clôture Pieux (Soir)', icon: ICONS.usage },
        { id: 'ndc', label: 'Note de Calcul (Pieux)', icon: ICONS.ndc },
        { id: 'history', label: 'Historique mouvements', icon: ICONS.history },
        { id: 'inventory', label: 'Inventaire physique', icon: ICONS.inventory },
        { id: 'config', label: 'Configuration cages', icon: ICONS.config },
        { id: 'users', label: 'Utilisateurs & Base BDD', icon: ICONS.users }
      ];

      let viewHtml = '';
      if (ui.view === 'dashboard') viewHtml = renderDashboardView();
      else if (ui.view === 'stock') viewHtml = renderStockView();
      else if (ui.view === 'receipt') viewHtml = renderReceiptView();
      else if (ui.view === 'qc') viewHtml = renderQcSheetView();
      else if (ui.view === 'usage') viewHtml = renderUsageView();
      else if (ui.view === 'ndc') viewHtml = renderNdcView();
      else if (ui.view === 'history') viewHtml = renderHistoryView();
      else if (ui.view === 'inventory') viewHtml = renderInventoryView();
      else if (ui.view === 'config') viewHtml = renderConfigView();
      else if (ui.view === 'users') viewHtml = renderUsersAndDatabaseView();

      return `
        <div class="flex min-h-screen">
          <!-- Sidebar Desktop -->
          <aside class="hidden lg:flex w-64 bg-[#101513] text-white flex-col shrink-0 border-r border-white/10 no-print">
            <div class="p-5 border-b border-white/10">
              ${renderBrandLogo(false)}
            </div>

            <nav class="flex-1 p-3 space-y-1 overflow-y-auto custom-scrollbar">
              ${navItems.map(item => `
                <button onclick="setView('${item.id}')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold transition ${ui.view === item.id ? 'bg-[#1A472A] text-white shadow-md' : 'text-gray-300 hover:bg-white/5 hover:text-white'}">
                  ${item.icon}
                  <span>${item.label}</span>
                </button>
              `).join('')}
            </nav>

            <div class="p-4 border-t border-white/10 text-xs space-y-2">
              <div class="flex items-center justify-between">
                <span class="text-gray-400">Collaborateur :</span>
                <span class="font-bold text-emerald-300">${escapeHtml(user?.name || '')}</span>
              </div>
              <button onclick="toggleDarkMode()" class="w-full px-3 py-2 rounded-xl bg-white/5 hover:bg-white/10 flex items-center justify-center gap-2 font-semibold">
                ${state.darkMode ? ICONS.sun : ICONS.moon}
                <span>${state.darkMode ? 'Mode Clair' : 'Mode Sombre'}</span>
              </button>
            </div>
          </aside>

          <!-- Zone Principale -->
          <div class="flex-1 flex flex-col min-w-0">
            <!-- Header -->
            <header class="bg-white dark:bg-[#242A26] border-b border-gray-200/80 dark:border-white/10 px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3 sticky top-0 z-20 no-print">
              <div class="flex items-center gap-3">
                <div class="lg:hidden">${renderBrandLogo(true)}</div>
                <div>
                  <div class="text-[10px] uppercase tracking-wider font-bold text-gray-400">Chantier Actif</div>
                  <select onchange="switchProject(this.value)" class="font-extrabold text-sm bg-transparent text-[#1A472A] dark:text-emerald-400 outline-none cursor-pointer">
                    ${state.projects.map(p => `<option value="${p.id}" ${p.id === project?.id ? 'selected' : ''}>${escapeHtml(p.name)} (${escapeHtml(p.reference)})</option>`).join('')}
                  </select>
                </div>
              </div>

              <div class="flex items-center gap-2 sm:gap-3 text-xs">
                <span class="hidden sm:inline-block px-3 py-1.5 rounded-lg bg-[#F7F9F7] dark:bg-white/5 font-semibold text-gray-600 dark:text-gray-300">
                  ${formatDateFR(todayISO())}
                </span>
                <button onclick="setView('users')" class="px-3 py-1.5 rounded-lg bg-[#E8F1EB] dark:bg-emerald-950/60 text-[#1A472A] dark:text-emerald-300 font-bold">
                  👤 ${escapeHtml(user?.name || 'Utilisateur')}
                </button>
              </div>
            </header>

            <!-- Navigation Mobile horizontale -->
            <div class="lg:hidden flex overflow-x-auto gap-1.5 p-2.5 bg-[#101513] text-white no-print">
              ${navItems.map(item => `
                <button onclick="setView('${item.id}')" class="px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap ${ui.view === item.id ? 'bg-[#1A472A] text-white' : 'text-gray-300'}">
                  ${item.label}
                </button>
              `).join('')}
            </div>

            <!-- Contenu -->
            <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto">
              ${viewHtml}
            </main>
          </div>
        </div>
      `;
    }

    function render() {
      const root = document.getElementById('app');
      if (!root) return;
      if (!state.initialized || !state.projects || state.projects.length === 0) {
        root.innerHTML = renderOnboardingScreen();
      } else {
        root.innerHTML = renderMainShell();
      }
    }

    // Démarrage immédiat de STOCAGE
    loadInitialState();
    render();
    initFirebaseSync();
  </script>
</body>
</html>
