    function saveToIndexedDB(stateObj) {
      try {
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = () => {
          if (!req.result.objectStoreNames.contains(IDB_STORE)) {
            req.result.createObjectStore(IDB_STORE);
          }
        };
        req.onsuccess = () => {
          const tx = req.result.transaction(IDB_STORE, 'readwrite');
          tx.objectStore(IDB_STORE).put(JSON.stringify(stateObj), 'latest');
        };
      } catch (e) {
        console.warn('IndexedDB indisponible :', e);
      }
    }

    function recalculateChain(movements) {
      const sorted = [...movements].sort((a, b) => new Date(a.date) - new Date(b.date));
      const balances = {};
      return sorted.map(m => {
        const before = balances[m.refId] || 0;
        let delta = 0;
        if (['RECEIPT', 'RETURN', 'ADJUSTMENT_POS'].includes(m.type)) delta = m.qty;
        else if (['USAGE', 'ADJUSTMENT_NEG'].includes(m.type)) delta = -m.qty;
        else if (m.type === 'CORRECTION') delta = m.signedQty !== undefined ? m.signedQty : -m.qty;
        const after = before + delta;
        balances[m.refId] = after;
        return { ...m, stockBefore: before, stockAfter: after };
      });

      } catch (e) {
        console.warn('Lecture localStorage impossible:', e);
      }
      const fresh = createInitialState();
      persistLocal(fresh);
      return fresh;
    }

    function persistLocal(next) {
      next.lastUpdated = new Date().toISOString();
      try {
        localStorage.setItem(LOCAL_KEY, JSON.stringify(next));
      } catch (e) {
        console.error('Erreur localStorage:', e);
      }
      saveToIndexedDB(next);
    }

    // 4. MOTEUR CLOUD FIREBASE FIRESTORE (TEMPS RÉEL MULTI-UTILISATEURS)
    // =========================================================================
    let cloudStatus = { connected: false, mode: 'LOCAL', message: 'Sauvegarde locale sécurisée active (navigateur + IndexedDB)', db: null, unsub: null };

    async function initCloudSync(customConfig = null) {
      // Vérifie d'abord la config globale de l'environnement, sinon celle enregistrée par l'utilisateur
      let cfg = customConfig;
      if (!cfg && typeof __firebase_config !== 'undefined' && __firebase_config) {
        try { cfg = JSON.parse(__firebase_config); } catch {}
      }
      if (!cfg && state.firebaseConfig) {
        cfg = state.firebaseConfig;
      }
      if (!cfg || !cfg.apiKey || !cfg.projectId) {
        cloudStatus = { connected: false, mode: 'LOCAL', message: 'Mode Local Sécurisé (Connectez Firebase pour la synchro multi-téléphones)', db: null, unsub: null };
        render();
        return false;
      }

      try {
        const appName = 'STOCAGE_APP_' + cfg.projectId;
        const fbApp = initializeApp(cfg, appName);
        const auth = getAuth(fbApp);
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        const db = getFirestore(fbApp);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'stocage-sbfs-prod';
        const sharedDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'stocage_state', 'main');

        if (cloudStatus.unsub) cloudStatus.unsub();

        const unsub = onSnapshot(sharedDocRef, (snap) => {
          if (snap.exists()) {
            const remoteData = snap.data();
            if (remoteData && remoteData.payload) {
              const parsed = JSON.parse(remoteData.payload);
              // Ne remplace que si le timestamp distant est plus récent
              if (!state.lastUpdated || new Date(parsed.lastUpdated) > new Date(state.lastUpdated)) {
                const currentSession = state.sessionUserId;
                const currentDark = state.darkMode;
                state = { ...parsed, sessionUserId: currentSession, darkMode: currentDark, firebaseConfig: cfg };
                persistLocal(state);
                render();
              }
            }
          } else {
            // Initialise le document Cloud avec l'état local actuel
            setDoc(sharedDocRef, { payload: JSON.stringify(state), updatedAt: new Date().toISOString() });
          }
        }, (err) => {
          console.error('Erreur snapshot Firestore:', err);
          cloudStatus = { connected: false, mode: 'ERROR', message: 'Erreur de connexion Firebase : ' + err.message, db: null, unsub: null };
          render();
        });

        cloudStatus = { connected: true, mode: 'CLOUD', db, sharedDocRef, unsub, message: `Connecté au Cloud Firebase (${cfg.projectId}) — Synchro temps réel active` };
        render();
        return true;
      } catch (err) {
        console.error('Échec init Firebase:', err);
        cloudStatus = { connected: false, mode: 'ERROR', message: 'Configuration Firebase invalide : ' + err.message, db: null, unsub: null };
        render();
        return false;
      }
    }

    // Calcul complet pour chaque référence de cage (Stock actuel, Besoin NDC, Stock à livrer, Prévisions)
    function computeRefStats(refObj) {
      const mvs = state.movements.filter(m => m.refId === refObj.id);
      let totalReceived = 0;
      let totalUsed = 0;
      let totalAdjust = 0;

      mvs.forEach(m => {
        if (m.type === 'RECEIPT') totalReceived += m.qty;
        else if (m.type === 'USAGE') totalUsed += m.qty;
        else if (m.type === 'RETURN' || m.type === 'ADJUSTMENT_POS') totalAdjust += m.qty;
        else if (m.type === 'ADJUSTMENT_NEG') totalAdjust -= m.qty;
        else if (m.type === 'CORRECTION') {
          const s = m.signedQty !== undefined ? m.signedQty : -m.qty;
          totalAdjust += s;
          if (m.affectsReceived) totalReceived += s;
        }
      });

      const currentStock = totalReceived - totalUsed + totalAdjust;

      // Calcul du besoin NDC depuis les pieux saisis dans l'onglet Note de Calcul (non encore coulés + coulés)
      const piles = getProjectNdcPiles();
      let ndcTotalNeeded = 0;
      let ndcRemainingNeeded = 0; // Pour les pieux restant à réaliser
      piles.forEach(p => {
        (p.cages || []).forEach(c => {
          if (c.refId === refObj.id) {
            ndcTotalNeeded += Number(c.qty || 0);
            if (p.status !== 'COULE') {
              ndcRemainingNeeded += Number(c.qty || 0);
            }
          }
        });
      });

      // Stock à livrer = Besoin pour les pieux à réaliser - Stock physique déjà présent sur chantier (min 0)
      const stockToDeliver = Math.max(0, ndcRemainingNeeded - currentStock);

      let status = 'OK';
      let statusLabel = 'Satisfaisant';
      if (refObj.status === 'ARCHIVED') {
        status = 'ARCHIVED';
        statusLabel = 'Archivée';
      } else if (currentStock <= 0) {
        status = 'OUT';
        statusLabel = 'Rupture';
      } else if (currentStock <= (refObj.minStock || 0)) {
        status = 'LOW';
        statusLabel = 'Stock faible';
      }

      return {
        ...refObj,
        totalReceived,
        totalUsed,
        currentStock,
        ndcTotalNeeded,
        ndcRemainingNeeded,
        stockToDeliver,
        status,
        statusLabel
      };
    }

    function fmtDateTime(iso) {

      try {

          timeZone: 'Europe/Paris', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
        }).format(new Date(iso));

    }

    function toast(title, detail = '', type = 'success') {
      const root = document.getElementById('toast-root');
      const el = document.createElement('div');
      const style = type === 'error'
        ? 'bg-red-950 border-red-700 text-white'
        : type === 'warning'
        ? 'bg-amber-950 border-amber-600 text-white'
        : 'bg-[#101513] border-[#2A623D] text-white';
      el.className = `pointer-events-auto flex items-start gap-3 px-4 py-3 rounded-xl border shadow-2xl max-w-sm transition-all duration-300 ${style}`;
      el.innerHTML = `
        <div class="mt-0.5 ${type === 'error' ? 'text-red-400' : type === 'warning' ? 'text-amber-400' : 'text-emerald-400'}">
          ${icon(type === 'error' || type === 'warning' ? 'alert' : 'check', 'w-5 h-5')}
        </div>
        <div class="text-sm">
          <p class="font-bold">${esc(title)}</p>
          ${detail ? `<p class="text-xs text-gray-300 mt-0.5">${esc(detail)}</p>` : ''}
        </div>
      `;
      root.appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3600);
    }

    function restoreBackupJSON(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          const payload = parsed.data || parsed;
          if (!payload.references || !payload.projects) {
            toast('Fichier invalide', 'Ce fichier ne correspond pas à une sauvegarde STOCAGE valide.', 'error');
            return;
          }
          updateState({ ...payload, firebaseConfig: state.firebaseConfig });
          toast('Restauration réussie', 'Toutes vos données chantiers, stocks et NDC ont été restaurées.');
        } catch {
          toast('Erreur de lecture', 'Impossible de lire ce fichier de sauvegarde.', 'error');
        }
      };
      reader.readAsText(file);
    }

    function exportStockCSV() {
      const project = getActiveProject();
      const stats = getProjectRefs(false).map(computeRefStats);
      const sep = ';';
      const headers = ['Chantier', 'Référence Cage', 'Longueur (m)', 'Diamètre', 'Besoin NDC', 'Stock Actuel', 'Stock à Livrer', 'Livraison Prévisionnelle', 'Date Livraison Prévue', 'Zone', 'Statut'];
      const rows = stats.map(s => [
        project.name, s.ref, s.length, s.diameter, s.ndcRemainingNeeded, s.currentStock, s.stockToDeliver, s.forecastQty || 0, s.forecastDate || '', s.zone || '', s.statusLabel
      ]);
      const csv = '\uFEFF' + [headers.join(sep), ...rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(sep))].join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `STOCAGE_Stock_NDC_${project.code}_${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      toast('Export Excel/CSV généré');

        ui.receipt = {
          date: new Date().toISOString().split('T')[0],
          bl: '',
          supplier: 'Armatures Île-de-France',
          comment: '',
          lines: [{ refId: preselectRefId || (refs[0] ? refs[0].id : ''), qty: '' }]
        };
      } else if (tab === 'usage') {
        const withStock = refs.map(computeRefStats).find(r => r.currentStock > 0);
        ui.usage = {
          date: new Date().toISOString().split('T')[0],
          pileNumber: '',
          zone: '',
          comment: '',
          lines: [{ refId: preselectRefId || (withStock ? withStock.id : (refs[0] ? refs[0].id : '')), qty: '' }]
        };
      } else if (tab === 'ndc') {
        const defaultDia = ui.diameterFilter !== 'ALL' ? ui.diameterFilter : 'Ø920';
        const matching = refs.filter(r => r.diameter === defaultDia);

        ui.ndcForm.cage2Id = matching[1] ? matching[1].id : '';

        const draft = {};
        refs.map(computeRefStats).forEach(r => {
          draft[r.id] = { counted: String(r.currentStock), justification: '' };

      }

      render();

    // Validation Sortie
    window.handleUsageSubmit = function (e) {
      e.preventDefault();
      if (!canOperate()) return toast('Accès refusé', 'Votre profil est en lecture seule.', 'error');
      const lines = ui.usage.lines.filter(l => l.refId && parseInt(l.qty, 10) > 0);
      if (lines.length === 0) return toast('Saisie requise', 'Indiquez au moins une référence et une quantité > 0.', 'error');

      // Vérification stock physique suffisant
      const totals = {};
      for (const l of lines) {
        const q = parseInt(l.qty, 10);
        totals[l.refId] = (totals[l.refId] || 0) + q;
      }
      for (const [refId, reqQty] of Object.entries(totals)) {
        const refObj = state.references.find(r => r.id === refId);
        const st = computeRefStats(refObj);
        if (reqQty > st.currentStock) {
          return toast(`Stock insuffisant (${refObj.ref})`, `Stock disponible : ${st.currentStock} cage(s), sortie demandée : ${reqQty}.`, 'error');
        }
      }

      const user = getCurrentUser();
      const timePart = new Date().toTimeString().split(' ')[0];
      const dateISO = new Date(`${ui.usage.date}T${timePart}`).toISOString();

      const newMvs = lines.map((l, idx) => ({
        id: `MV-${Date.now().toString().slice(-5)}-${idx + 1}`,
        projectId: state.activeProjectId,
        refId: l.refId,
        type: 'USAGE',
        qty: parseInt(l.qty, 10),

        user: user.name,
        pile: ui.usage.pileNumber.trim(),
        zone: ui.usage.zone.trim(),
        comment: ui.usage.comment.trim()
      }));

      updateState({ movements: recalculateChain([...state.movements, ...newMvs]) });

    // Ajout d'un pieu dans la Note de Calcul (NDC)
    window.handleAddNdcPile = function (e) {
      e.preventDefault();
      if (!canOperate()) return toast('Accès refusé', 'Profil en lecture seule.', 'error');
      const f = ui.ndcForm;
      const pileNum = f.pileNumber.trim().toUpperCase();
      if (!pileNum) return toast('N° Pieu manquant', 'Veuillez saisir le numéro du pieu (ex: P06).', 'error');

      const ngf = parseFloat(f.ngfDepth);
      const nbr = parseFloat(f.nbr);
      const pileLen = parseFloat(f.pileLength);
      const soupapeYes = f.soupape === 'OUI';
      const soupapeH = soupapeYes ? (parseFloat(f.soupapeHeight) || 0) : 0;
      const computedDelta = (!isNaN(ngf) && !isNaN(nbr)) ? Number((ngf - nbr).toFixed(2)) : 0;
      const finalDelta = f.deltaManual !== '' ? parseFloat(f.deltaManual) : computedDelta;

      const cages = [];
      if (f.cage1Id && parseInt(f.cage1Qty, 10) > 0) {
        cages.push({ refId: f.cage1Id, qty: parseInt(f.cage1Qty, 10) });
      }
      if (f.cage2Id && parseInt(f.cage2Qty, 10) > 0) {
        cages.push({ refId: f.cage2Id, qty: parseInt(f.cage2Qty, 10) });
      }
      if (cages.length === 0) {
        return toast('Armature manquante', 'Sélectionnez au moins une cage d’armature pour ce pieu.', 'error');
      }

      const newPile = {
        id: `NDC-${Date.now().toString().slice(-5)}`,
        projectId: state.activeProjectId,
        pileNumber: pileNum,
        diameter: f.diameter,
        ngfDepth: isNaN(ngf) ? 0 : ngf,
        pileLength: isNaN(pileLen) ? 0 : pileLen,
        cages,
        soupape: soupapeYes,
        soupapeHeight: soupapeH,
        nbr: isNaN(nbr) ? 0 : nbr,
        deltaNgfNbr: finalDelta,
        status: 'A_REALISER',
        notes: f.notes.trim()
      };

      ui.ndcForm.pileNumber = '';
      ui.ndcForm.notes = '';
      updateState({ ndcPiles: [newPile, ...state.ndcPiles] });
      toast(`Pieu ${pileNum} ajouté à la NDC`, 'Les besoins et quantités à livrer ont été recalculés.');
    };

    // Passer un pieu de la NDC en statut "Coulé" et déduire automatiquement ses cages du stock
    window.markNdcPileAsCast = function (pileId) {
      if (!canOperate()) return toast('Accès refusé', 'Profil en lecture seule.', 'error');
      const pile = state.ndcPiles.find(p => p.id === pileId);
      if (!pile || pile.status === 'COULE') return;

      // Vérifier le stock pour chaque cage du pieu
      for (const c of pile.cages) {
        const refObj = state.references.find(r => r.id === c.refId);
        if (!refObj) continue;
        const st = computeRefStats(refObj);
        if (c.qty > st.currentStock) {
          return toast(
            `Impossible de couler ${pile.pileNumber}`,
            `Stock insuffisant pour ${refObj.ref} (requis : ${c.qty}, dispo : ${st.currentStock}). Réceptionnez d'abord les cages.`,
            'error'
          );
        }
      }

      const user = getCurrentUser();
      const now = new Date().toISOString();
      const newMvs = pile.cages.map((c, idx) => ({
        id: `MV-NDC-${Date.now().toString().slice(-4)}-${idx + 1}`,
        projectId: state.activeProjectId,
        refId: c.refId,
        type: 'USAGE',
        qty: c.qty,
        date: now,
        user: user.name,
        pile: `Pieu ${pile.pileNumber} (${pile.diameter})`,
        zone: 'Exécution NDC',
        comment: `Sortie automatique — Pieu ${pile.pileNumber} coulé (L=${pile.pileLength}m, NGF=${pile.ngfDepth})`
      }));

      updateState({
        ndcPiles: state.ndcPiles.map(p => p.id === pileId ? { ...p, status: 'COULE', castDate: now } : p),
        movements: recalculateChain([...state.movements, ...newMvs])
      });
      toast(`Pieu ${pile.pileNumber} marqué Coulé`, 'Les cages correspondantes ont été automatiquement sorties du stock.');
    };

    window.deleteNdcPile = function (pileId) {

      updateState({ ndcPiles: state.ndcPiles.filter(p => p.id !== pileId) });
      toast('Ligne NDC supprimée');
    };

    function renderStockView() {
      let stats = getProjectRefs(false).map(computeRefStats);

    function renderInventoryView() {
      let refs = getProjectRefs(false).map(computeRefStats);
      if (ui.diameterFilter !== 'ALL') refs = refs.filter(r => r.diameter === ui.diameterFilter);

      window.validatePhysicalInventory = function () {
        if (!isAdmin()) return toast('Réservé aux Administrateurs', '', 'error');
        const adjustments = [];
        const lines = [];
        const now = new Date().toISOString();
        const user = getCurrentUser();

        for (const r of refs) {
          const entry = ui.inventoryDraft[r.id] || { counted: String(r.currentStock), justification: '' };
          const counted = parseInt(entry.counted, 10);
          if (isNaN(counted) || counted < 0) return toast('Erreur', `Valeur invalide pour ${r.ref}`, 'error');
          const diff = counted - r.currentStock;
          if (diff !== 0 && !entry.justification.trim()) {
            return toast('Justification requise', `Indiquez le motif de l'écart (${diff}) pour ${r.ref}.`, 'warning');
          }
          lines.push({ ref: r.ref, theoretical: r.currentStock, counted, diff, justification: entry.justification });
          if (diff !== 0) {
            adjustments.push({
              id: `MV-INV-${Date.now().toString().slice(-4)}-${r.id}`,
              projectId: state.activeProjectId,
              refId: r.id,
              type: diff > 0 ? 'ADJUSTMENT_POS' : 'ADJUSTMENT_NEG',
              qty: Math.abs(diff),
              date: now,
              user: user.name,
              comment: `Inventaire physique (${r.currentStock} → ${counted}) : ${entry.justification}`
            });
          }
        }

        updateState({
          inventories: [{ id: `INV-${Date.now().toString().slice(-5)}`, projectId: state.activeProjectId, date: now, user: user.name, lines }, ...state.inventories],
          movements: recalculateChain([...state.movements, ...adjustments])
        });
        toast('Inventaire physique validé', `${adjustments.length} ajustement(s) enregistré(s).`);
      };

      return `
        <div class="space-y-5 animate-view">
          <div>
            <h2 class="text-2xl font-extrabold">Inventaire physique</h2>
            <p class="text-sm text-gray-500">Rapprochement entre stock informatique et comptage réel sur parc</p>

          ${renderDiameterFilterBar()}
          <div class="bg-white dark:bg-[#242A26] rounded-2xl border border-gray-200 dark:border-gray-800 overflow-x-auto">
            <table class="w-full text-left border-collapse text-sm">
              <thead>
                <tr class="bg-[#F7F9F7] dark:bg-[#101513] text-xs uppercase text-gray-500 border-b border-gray-200 dark:border-gray-800">

      window.handleSaveFirebaseConfig = async function (e) {
        e.preventDefault();
        const raw = document.getElementById('fb-config-input').value.trim();
        try {
          // Accepte soit du JSON pur, soit le bloc copié depuis la console Firebase (const firebaseConfig = { ... };)
          let cleaned = raw;
          const firstBrace = raw.indexOf('{');
          const lastBrace = raw.lastIndexOf('}');
          if (firstBrace !== -1 && lastBrace !== -1) {
            cleaned = raw.slice(firstBrace, lastBrace + 1);
            // Convertit les clés JS non-quotées (apiKey: "...") en JSON valide ("apiKey": "...")
            cleaned = cleaned.replace(/(['"])?([a-zA-Z0-9_]+)(['"])?\s*:/g, '"$2":');
          }
          const cfg = JSON.parse(cleaned);
          if (!cfg.apiKey || !cfg.projectId) {
            return toast('Configuration incomplète', 'Vérifiez que apiKey et projectId sont bien présents.', 'error');
          }
          updateState({ firebaseConfig: cfg });
          const ok = await initCloudSync(cfg);
          if (ok) {
            toast('Base de données Cloud connectée !', 'Synchronisation temps réel activée pour toute l’équipe.');
          }

          toast('Format invalide', 'Collez directement l’objet firebaseConfig copié depuis Firebase.', 'error');
        }
      };

                    <div>
                      <p class="font-bold text-sm">${esc(u.name)} <span class="text-xs font-normal text-gray-500">— ${esc(u.title)}</span></p>
                      <p class="text-xs text-[#2A623D] dark:text-emerald-400 font-semibold">Rôle : ${u.role === 'ADMIN' ? 'Administrateur' : u.role === 'OPERATIONAL' ? 'Opérationnel' : 'Consultation'} • PIN : ${isAdmin() ? esc(u.pin) : '••••'}</p>
                    </div>
                    <button onclick="openLoginModal('${u.id}')" class="px-3 py-1.5 rounded-lg border border-gray-300 dark:border-gray-700 text-xs font-bold hover:bg-white">
                      ${u.id === state.sessionUserId ? 'Connecté' : 'Basculer'}
                    </button>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>

          <!-- 3. Guide pas-à-pas pour connecter la Base de Données Cloud Firebase (Gratuit) -->
          <div class="bg-white dark:bg-[#242A26] p-6 rounded-2xl border border-gray-200 dark:border-gray-800 space-y-5">
            <div class="flex items-center gap-3">
              <div class="p-3 rounded-xl bg-[#101513] text-emerald-400">${icon('database', 'w-6 h-6')}</div>
              <div>
                <h3 class="text-lg font-extrabold">Connexion Base de Données Cloud (Firebase Firestore)</h3>
                <p class="text-xs text-gray-500">${esc(cloudStatus.message)}</p>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs bg-[#F7F9F7] dark:bg-[#101513] p-4 rounded-xl border border-gray-200 dark:border-gray-800">
              <div class="space-y-1">
                <span class="px-2 py-0.5 rounded bg-[#1A472A] text-white font-bold">Étape 1 (1 min)</span>
                <p class="font-bold text-sm mt-1">Créer un projet gratuit</p>
                <p class="text-gray-600 dark:text-gray-400">Allez sur <strong>console.firebase.google.com</strong> avec un compte Google, cliquez sur <em>"Ajouter un projet"</em> et nommez-le <strong>STOCAGE</strong>.</p>
              </div>
              <div class="space-y-1">
                <span class="px-2 py-0.5 rounded bg-[#1A472A] text-white font-bold">Étape 2 (1 min)</span>
                <p class="font-bold text-sm mt-1">Activer Firestore & Auth</p>
                <p class="text-gray-600 dark:text-gray-400">Dans le menu à gauche : cliquez sur <strong>Firestore Database</strong> → <em>Créer une base de données</em> (mode test), puis <strong>Authentication</strong> → activez <em>Anonyme</em>.</p>
              </div>
              <div class="space-y-1">
                <span class="px-2 py-0.5 rounded bg-[#1A472A] text-white font-bold">Étape 3 (30 sec)</span>
                <p class="font-bold text-sm mt-1">Copier la configuration</p>
                <p class="text-gray-600 dark:text-gray-400">Cliquez sur l'engrenage <strong>Paramètres du projet</strong> → icône Web <code>&lt;/&gt;</code> → copiez le bloc <code>const firebaseConfig = { ... }</code> et collez-le ci-dessous.</p>
              </div>
            </div>

            <form onsubmit="handleSaveFirebaseConfig(event)" class="space-y-3">
              <label class="block text-xs font-bold uppercase text-gray-500">Coller ici votre configuration Firebase (firebaseConfig)</label>
              <textarea id="fb-config-input" rows="4" placeholder='const firebaseConfig = { apiKey: "AIzaSy...", authDomain: "stocage.firebaseapp.com", projectId: "stocage-...", ... };' class="w-full p-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-[#F7F9F7] dark:bg-[#101513] font-mono text-xs">${state.firebaseConfig ? JSON.stringify(state.firebaseConfig, null, 2) : ''}</textarea>
              <button type="submit" class="px-6 py-3 rounded-xl bg-[#1A472A] hover:bg-[#2A623D] text-white text-xs font-bold shadow-md">
                Enregistrer et synchroniser avec la base de données Cloud
              </button>
            </form>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 11. ÉCRAN / MODALE DE CONNEXION UTILISATEUR (SÉCURITÉ PIN)
    // =========================================================================
    window.openLoginModal = function (preselectUserId = null) {
      const targetId = preselectUserId || state.users[0].id;
      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div class="fixed inset-0 z-50 flex items-center justify-center bg-[#101513]/90 backdrop-blur-sm p-4">
          <div class="bg-white dark:bg-[#242A26] rounded-2xl shadow-2xl max-w-md w-full overflow-hidden border border-gray-200 dark:border-gray-700 animate-view">
            <div class="p-6 bg-[#101513] text-white text-center space-y-2">
              <div class="w-12 h-12 rounded-2xl bg-[#2A623D] mx-auto flex items-center justify-center font-extrabold text-2xl">S</div>
              <h2 class="text-xl font-extrabold tracking-wider">STOCAGE</h2>
              <p class="text-xs text-emerald-400 uppercase tracking-widest font-semibold">Soletanche Bachy Fondations Spéciales</p>
            </div>
            <form id="pin-login-form" class="p-6 space-y-4 text-sm">
              <div>
                <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Sélectionner votre espace utilisateur</label>
                <select id="login-user-select" class="w-full p-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-[#F7F9F7] dark:bg-[#101513] font-bold">
                  ${state.users.map(u => `<option value="${u.id}" ${u.id === targetId ? 'selected' : ''}>${esc(u.name)} — ${esc(u.title)}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Code PIN d'accès</label>
                <input type="password" id="login-pin-input" required placeholder="••••" class="w-full p-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-[#F7F9F7] dark:bg-[#101513] text-center text-xl font-mono tracking-widest" />
                <p class="text-[11px] text-gray-400 mt-1.5 text-center">Codes démo : Admin = <strong>1234</strong> • Chef chantier = <strong>0000</strong> • Consultation = <strong>1111</strong></p>
              </div>
              <div class="flex gap-2 pt-2">
                ${state.sessionUserId ? `<button type="button" onclick="document.getElementById('modal-root').innerHTML='';" class="flex-1 py-3 rounded-xl border border-gray-300 dark:border-gray-700 font-semibold">Annuler</button>` : ''}
                <button type="submit" class="flex-1 py-3 rounded-xl bg-[#1A472A] hover:bg-[#2A623D] text-white font-bold shadow-lg">Ouvrir ma session</button>
              </div>
            </form>
          </div>
        </div>
      `;

      document.getElementById('pin-login-form').onsubmit = function (e) {
        e.preventDefault();
        const uid = document.getElementById('login-user-select').value;
        const pin = document.getElementById('login-pin-input').value.trim();
        const user = state.users.find(u => u.id === uid);
        if (!user || user.pin !== pin) {
          return toast('Code PIN incorrect', 'Vérifiez votre code d’accès utilisateur.', 'error');
        }
        document.getElementById('modal-root').innerHTML = '';
        updateState({ sessionUserId: user.id });
        toast(`Bienvenue ${user.name}`, `Session ouverte (${user.role})`);
      };
    };

    window.lockSession = function () {
      updateState({ sessionUserId: null });
      window.openLoginModal();
    };

    // =========================================================================
    // 12. RENDU GLOBAL DE L'APPLICATION (SIDEBAR + HEADER + CONTENU)
    // =========================================================================
    window.render = function () {
      if (state.darkMode) document.documentElement.classList.add('dark');
      else document.documentElement.classList.remove('dark');

      const user = getCurrentUser();
      const project = getActiveProject();

      const navItems = [
        { id: 'dashboard', label: 'Tableau de bord', icon: 'dashboard' },
        { id: 'stock', label: 'Stock & Prévisions NDC', icon: 'package' },
        { id: 'ndc', label: 'Note de Calcul (Pieux)', icon: 'calc' },
        { id: 'receipt', label: 'Nouvelle réception', icon: 'arrowDown' },
        { id: 'usage', label: 'Sorties de stock', icon: 'arrowUp' },
        { id: 'history', label: 'Historique mouvements', icon: 'history' },
        { id: 'inventory', label: 'Inventaire physique', icon: 'clipboard' },
        { id: 'config', label: 'Chantiers & Config Cages', icon: 'sliders' },
        { id: 'database', label: 'Utilisateurs & Base BDD', icon: 'database' }
      ];

      let content = '';
      if (!user) {
        content = `<div class="h-screen flex items-center justify-center"><button onclick="openLoginModal()" class="px-6 py-3 rounded-xl bg-[#1A472A] text-white font-bold">Se connecter à STOCAGE</button></div>`;
      } else {
        switch (ui.tab) {
          case 'stock': content = renderStockView(); break;
          case 'ndc': content = renderNdcView(); break;
          case 'receipt': content = renderReceiptView(); break;
          case 'usage': content = renderUsageView(); break;
          case 'history': content = renderHistoryView(); break;
          case 'inventory': content = renderInventoryView(); break;
          case 'config': content = renderConfigView(); break;
          case 'database': content = renderDatabaseAndUsersView(); break;
          default: content = renderDashboard();
        }
      }

      document.getElementById('app').innerHTML = `
        <div class="flex h-screen overflow-hidden">
          ${ui.mobileMenu ? `<div onclick="ui.mobileMenu=false; render();" class="fixed inset-0 bg-black/60 z-30 lg:hidden"></div>` : ''}

          <!-- SIDEBAR VERT SERPENTARD / NOIR PROFOND -->
          <aside class="fixed lg:static inset-y-0 left-0 z-40 w-68 bg-[#101513] text-white flex flex-col border-r border-white/10 transition-transform duration-200 ${ui.mobileMenu ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'} shrink-0">
            <div class="p-5 border-b border-white/10 flex items-center justify-between">
              <div class="flex items-center gap-3">
                <img src="/public/images/logo.png" alt="Logo" class="h-9 w-auto rounded" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
                <div style="display:none" class="w-9 h-9 rounded-xl bg-[#2A623D] text-white font-extrabold text-lg items-center justify-center">S</div>
                <div>
                  <span class="font-extrabold tracking-wider text-lg block leading-none">STOCAGE</span>
                  <span class="text-emerald-400 text-[10px] font-bold uppercase tracking-widest block mt-1">Soletanche Bachy</span>
                </div>
              </div>
              <button onclick="ui.mobileMenu=false; render();" class="lg:hidden text-gray-400 hover:text-white">${icon('x', 'w-5 h-5')}</button>
            </div>

            <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto custom-scrollbar">
              ${navItems.map(item => `
                <button onclick="goTab('${item.id}')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition cursor-pointer ${
                  ui.tab === item.id ? 'bg-[#2A623D] text-white font-bold shadow-sm' : 'text-gray-300 hover:bg-white/5 hover:text-white'
                }">
                  ${icon(item.icon, 'w-4 h-4')}
                  <span>${item.label}</span>
                </button>
              `).join('')}
            </nav>

            <!-- Pied Sidebar : Thème & Verrouillage session -->
            <div class="p-4 border-t border-white/10 space-y-3">
              <div class="flex items-center justify-between">
                <button onclick="updateState({ darkMode: !state.darkMode })" class="flex items-center gap-2 px-3 py-2 rounded-xl bg-white/5 hover:bg-white/10 text-xs font-semibold text-gray-300">
                  ${icon(state.darkMode ? 'sun' : 'moon', 'w-4 h-4')}
                  <span>${state.darkMode ? 'Mode Clair' : 'Mode Sombre'}</span>
                </button>
                <button onclick="lockSession()" class="p-2 rounded-xl bg-white/5 hover:bg-red-950 text-gray-300 hover:text-red-300" title="Verrouiller / Changer d'utilisateur">
                  ${icon('lock', 'w-4 h-4')}
                </button>
              </div>
              ${user ? `
                <div onclick="openLoginModal()" class="cursor-pointer flex items-center gap-2.5 p-2.5 rounded-xl bg-white/5 hover:bg-white/10">
                  <div class="w-8 h-8 rounded-full bg-[#2A623D] flex items-center justify-center font-bold text-xs">${esc(user.name[0])}</div>
                  <div class="min-w-0 flex-1">
                    <p class="text-xs font-bold truncate">${esc(user.name)}</p>
                    <p class="text-[11px] text-emerald-400 truncate">${user.role === 'ADMIN' ? 'Administrateur' : user.role === 'OPERATIONAL' ? 'Opérationnel' : 'Consultation'}</p>
                  </div>
                </div>
              ` : ''}
            </div>
          </aside>

          <!-- ZONE PRINCIPALE -->
          <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
            <header class="h-16 bg-white dark:bg-[#242A26] border-b border-gray-200 dark:border-gray-800 px-4 lg:px-8 flex items-center justify-between gap-3 shrink-0">
              <div class="flex items-center gap-3 min-w-0">
                <button onclick="ui.mobileMenu=true; render();" class="lg:hidden p-2 rounded-xl border border-gray-200 dark:border-gray-700">${icon('menu', 'w-5 h-5')}</button>
                <div class="flex items-center gap-2 bg-[#E8F1EB] dark:bg-[#1A472A]/60 px-3 py-1.5 rounded-xl">
                  <span class="w-2 h-2 rounded-full bg-[#2A623D] dark:bg-emerald-400"></span>
                  <select onchange="updateState({ activeProjectId: this.value }); goTab(ui.tab);" class="bg-transparent text-xs sm:text-sm font-bold text-[#1A472A] dark:text-emerald-200 focus:outline-none cursor-pointer">
                    ${state.projects.map(p => `<option value="${p.id}" class="text-black" ${p.id === project.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
                  </select>
                </div>
              </div>

              <div class="flex items-center gap-2 sm:gap-3">
                <button onclick="goTab('database')" class="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold border ${cloudStatus.connected ? 'border-emerald-300 bg-emerald-50 text-emerald-800' : 'border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300'}">
                  ${icon('database', 'w-3.5 h-3.5')}
                  <span>${cloudStatus.connected ? 'Cloud Actif' : 'BDD Locale'}</span>
                </button>
                <button onclick="downloadBackupJSON()" class="p-2 rounded-xl border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-white/5" title="Télécharger une sauvegarde de secours (.json)">
                  ${icon('shield', 'w-4 h-4 text-[#2A623D]')}
                </button>
              </div>
            </header>

            <main class="flex-1 overflow-y-auto custom-scrollbar p-4 sm:p-6 lg:p-8">
              <div class="max-w-7xl mx-auto">
                ${content}
              </div>
            </main>
          </div>
        </div>
      `;
    };

    // Exposition des fonctions utiles au contexte global HTML
    window.updateState = updateState;
    window.toast = toast;
    window.downloadBackupJSON = downloadBackupJSON;
    window.restoreBackupJSON = restoreBackupJSON;
    window.exportStockCSV = exportStockCSV;

    // Initialisation
    render();
    initCloudSync();
  </script>
</body>
</html>
